ONE);\nc.getColumn().setText(\"Tên\"); c.getColumn().setWidth(160);\nc.setLabelProvider(new ColumnLabelProvider() { public String getText(Object o) { return ((Person) o).name(); } });\nv.setInput(people);","h":[["BT 5.1.1 – Bảng nhân viên","Dựng bảng 4 cột từ danh sách đối tượng. Đạt khi: sắp xếp theo cột và lọc theo ô tìm."],["BT 5.1.2 – Đổi dữ liệu","Đổi model rồi cập nhật bảng bằng update thay vì refresh toàn bộ. Đạt khi: giải thích chênh lệch hiệu năng."]]},{"t":"Bài 5.2 – TreeViewer, chỉnh sửa tại chỗ và Data Binding","m":"90 phút","g":"Chỉnh sửa trực tiếp trong bảng/cây.","k":["TreeViewer với ITreeContentProvider","EditingSupport và CellEditor (Text, Combo, Checkbox)","Cập nhật model và viewer đồng bộ","Giới thiệu JFace Data Binding: ObservableValue","Hoàn tác (undo) mức cơ bản"],"e":"","h":[["BT 5.2.1 – Sửa điểm tại chỗ","Cho sửa điểm ngay trong bảng, kiểm tra 0–10. Đạt khi: giá trị sai bị từ chối."],["BT 5.2.2 – Cây phòng ban","Dựng cây phòng ban – nhân viên có kéo thả cơ bản. Đạt khi: thao tác cập nhật model đúng."]]}]},{"t":"Chương 6: Mô hình dữ liệu và lưu trữ","ls":[{"t":"Bài 6.1 – Mô hình, sự kiện thay đổi và lưu trữ","m":"75 phút","g":"Thiết kế model quan sát được và lưu bền vững.","k":["PropertyChangeSupport và thông báo thay đổi","Lưu JSON/XML bằng Jackson, tệp cấu hình người dùng","SQLite/H2 nhúng với JDBC","Đồng bộ model và nhiều viewer","Xử lý lỗi I/O thân thiện"],"e":"","h":[["BT 6.1.1 – Hai viewer một model","Đổi model thì cả bảng và biểu đồ cập nhật. Đạt khi: không gọi refresh thủ công ở nhiều nơi."],["BT 6.1.2 – Lưu bền vững","Lưu dữ liệu vào SQLite. Đạt khi: mở lại thấy dữ liệu và migration phiên bản."]]},{"t":"Bài 6.2 – Kiểm thử và quy ước dự án","m":"60 phút","g":"Giữ dự án SWT sạch và kiểm thử được.","k":["Kiểm thử Presenter/Model bằng JUnit","Kiểm thử UI: SWTBot (giới thiệu)","Quy ước mã, Checkstyle, SpotBugs","Quản lý phụ thuộc bằng Maven/Tycho","Tài liệu kiến trúc ngắn"],"e":"","h":[["BT 6.2.1 – 15 kiểm thử","Viết 15 kiểm thử cho model B2B cho ngành CNTT.","pre":["Biết dùng Figma ở mức cơ bản","Hiểu cơ bản HTML/CSS giúp bàn giao thiết kế tốt hơn"],"map":[{"t":"Giai đoạn 1 – Nghiên cứu và tư duy thiết kế","w":"Tuần 1–2","g":"Hiểu người dùng và xác định đúng vấn đề trước khi vẽ giao diện.","i":["Quy trình thiết kế và nghiên cứu người dùng","Persona dựa trên dữ liệu, bản đồ hành trình","Heuristic Nielsen và nguyên tắc UI"],"o":"Báo cáo nghiên cứu: 5 phỏng vấn, persona, hành trình, danh sách vấn đề ưu tiên."},{"t":"Giai đoạn 2 – Thiết kế và mẫu thử","w":"Tuần 3–5","g":"Chuyển nghiên cứu thành luồng, wireframe và mẫu thử có thể bấm trên Figma.","i":["User flow, wireframe","Figma: auto layout, component, variant","Typography, lưới, màu sắc, tương phản AA"],"o":"Mẫu thử tương tác cho một luồng hoàn chỉnh, đủ trạng thái trống, tải, lỗi."},{"t":"Giai đoạn 3 – Hệ thống thiết kế và kiểm chứng","w":"Tuần 6–8","g":"Xây hệ thống thiết kế, bàn giao và kiểm chứng thiết kế bằng người dùng thật.","i":["Design system và tokens","Pattern thương mại điện tử B2B","Kiểm thử khả dụng, đo lường, bàn giao"],"o":"Dự án cuối khóa: thiết kế luồng B2B đầy đủ, design system nhỏ và báo cáo kiểm thử khả dụng."}],"areas":[{"n":"Nghiên cứu người dùng","d":"Thiết kế tốt bắt đầu từ việc hiểu người dùng, không phải từ sở thích của người thiết kế.","p":["Xác định mục tiêu kinh doanh và mục tiêu người dùng","Phỏng vấn người dùng: câu hỏi mở, tránh dẫn dắt","Persona dựa trên dữ liệu thật, không dựa trên phỏng đoán","Bản đồ hành trình và điểm đau","Ưu tiên vấn đề theo mức tác động và công sức"],"x":[["Bài 1 – Cơ bản: Phỏng vấn 3 người","Soạn 8 câu hỏi mở và phỏng vấn 3 người về cách họ mua thiết bị hoặc phần mềm cho công việc. Đạt khi: có biên bản và 5 phát hiện chính, không có câu hỏi dẫn dắt."],["Bài 2 – Nâng cao: Hành trình và ưu tiên","Vẽ bản đồ hành trình mua hàng B2B từ nhu cầu đến thanh toán, đánh dấu điểm đau và xếp hạng ưu tiên. Đạt khi: mỗi điểm đau có bằng chứng từ phỏng vấn."]]},{"n":"Heuristic và nguyên tắc thiết kế giao diện","d":"Bộ tiêu chí để rà soát và cải thiện giao diện một cách có hệ thống.","p":["10 heuristic của Nielsen với ví dụ cho từng nguyên tắc","Phân cấp thị giác, nhất quán, khoảng trắng, căn lề","Typography: cỡ chữ, độ dài dòng, khoảng cách dòng","Màu sắc và tương phản theo WCAG AA","Luật thiết kế thường gặp: Fitts, Hick, Miller"],"x":[["Bài 1 – Cơ bản: Rà soát heuristic","Chọn một sàn thương mại điện tử, rà soát một luồng mua hàng theo 10 heuristic và ghi 10 phát hiện kèm mức nghiêm trọng. Đạt khi: mỗi phát hiện có ảnh chụp và đề xuất sửa."],["Bài 2 – Nâng cao: Thiết kế lại một màn hình","Thiết kế lại một màn hình tệ trong bài 1, giải thích từng thay đổi bằng nguyên tắc cụ thể. Đạt khi: bản mới đạt tương phản AA và giảm số bước thao tác."]]},{"n":"Wireframe và mẫu thử trên Figma","d":"Biến ý tưởng thành thứ có thể bấm và thử nghiệm sớm, trước khi tốn công lập trình.","p":["User flow: điểm vào, quyết định, điểm ra, trường hợp lỗi","Wireframe độ trung thực thấp trước, cao sau","Figma: frame, auto layout, constraints, component, variant, variables","Mẫu thử tương tác: chuyển màn, overlay, trạng thái","Thiết kế đủ trạng thái: mặc định, hover, focus, tải, trống, lỗi, thành công"],"x":[["Bài 1 – Cơ bản: Wireframe luồng tìm kiếm","Vẽ wireframe 5 màn hình luồng tìm sản phẩm, lọc và xem chi tiết. Đạt khi: người khác nhìn vào hiểu được luồng mà không cần giải thích."],["Bài 2 – Nâng cao: Mẫu thử tương tác","Dựng mẫu thử Figma cho luồng yêu cầu báo giá với đủ trạng thái lỗi và trống. Đạt khi: 3 người thử hoàn thành nhiệm vụ không cần hướng dẫn."]]},{"n":"Hệ thống thiết kế (design system)","d":"Giúp sản phẩm nhất quán, thiết kế nhanh và bàn giao dễ cho lập trình viên.","p":["Design tokens: màu, khoảng cách, bo góc, kiểu chữ, đổ bóng","Component có biến thể và trạng thái, đặt tên rõ ràng","Tài liệu hóa cách dùng và điều không nên làm","Xuất tokens sang biến CSS để dùng chung với mã","Quy trình cập nhật và quản lý phiên bản"],"x":[["Bài 1 – Cơ bản: Bộ tokens","Xây bộ tokens (màu, khoảng cách, kiểu chữ, bo góc) trên Figma Variables. Đạt khi: đổi một token thì toàn bộ mẫu thiết kế cập nhật."],["Bài 2 – Nâng cao: Bộ component lõi","Xây 6 component: nút, ô nhập, thẻ sản phẩm, bảng, hộp thoại, thông báo, đủ biến thể và trạng thái. Đạt khi: dựng được một màn hình mới chỉ bằng các component này."]]},{"n":"Pattern thương mại điện tử B2B và kiểm thử khả dụng","d":"Áp dụng vào sàn thương mại điện tử cho ngành CNTT và chứng minh thiết kế hiệu quả bằng dữ liệu.","p":["Tìm kiếm và lọc theo thông số kỹ thuật, so sánh sản phẩm","Giá theo bậc số lượng, giá theo hợp đồng, yêu cầu báo giá (RFQ)","Đặt hàng nhanh theo SKU hoặc tải CSV, mua lại đơn cũ","Quy trình phê duyệt đơn, nhiều tài khoản và địa chỉ, hóa đơn và công nợ","Kiểm thử khả dụng 5 người, tỷ lệ hoàn thành nhiệm vụ, điểm SUS"],"x":[["Bài 1 – Cơ bản: Trang chi tiết sản phẩm B2B","Thiết kế trang chi tiết sản phẩm có bảng giá theo bậc, thông số, nút yêu cầu báo giá. Đạt khi: người dùng thử xác định được giá cho 500 sản phẩm trong dưới 30 giây."],["Bài 2 – Nâng cao: Kiểm thử khả dụng","Soạn 4 nhiệm vụ, kiểm thử với 5 người, đo tỷ lệ hoàn thành, thời gian và lỗi, viết báo cáo cải tiến. Đạt khi: báo cáo nêu 5 vấn đề kèm đề xuất và mức ưu tiên."]]}],"pit":["Thiết kế theo sở thích cá nhân thay vì dữ liệu người dùng","Bỏ qua trạng thái lỗi, trống và đang tải","Thiết kế sàn B2B như cửa hàng B2C, thiếu báo giá, giá theo bậc, phê duyệt","Màu có tương phản thấp, chỉ dùng màu để truyền đạt trạng thái","Tạo design system quá lớn trước khi có sản phẩm"],"proj":["Thiết kế luồng 'tìm sản phẩm → so sánh → yêu cầu báo giá' cho sàn B2B ngành CNTT","Xây design system nhỏ trên Figma kèm tokens xuất ra biến CSS","Rà soát giao diện hiện có theo 10 heuristic và đề xuất cải tiến có thứ tự ưu tiên","Kiểm thử khả dụng với 5 người dùng và báo cáo phát hiện"],"tools":["Figma (components, variables)","FigJam hoặc Miro","Maze hoặc Lookback để kiểm thử","Stark hoặc công cụ kiểm tra tương phản","Storybook để bàn giao component"],"refs":["Nielsen Norman Group (nngroup.com)","Material Design và Apple Human Interface Guidelines","WCAG (w3.org/WAI)","Laws of UX (lawsofux.com)"],"check":["Rà soát được giao diện theo heuristic và ghi nhận mức độ nghiêm trọng","Có bộ tokens và component dùng lại được","Thiết kế đủ các trạng thái cho mỗi màn hình","Có chỉ số đo lường gắn với mục tiêu kinh doanh"],"cur":[{"n":"Nghiên cứu người dùng","ch":[{"t":"Chương 1: Nền tảng UX và định hướng sản phẩm","ls":[{"t":"Bài 1.1 – UX, UI, quy trình thiết kế và vai trò","m":"60 phút","g":"Phân biệt UX/UI và nắm quy trình Double Diamond.","k":["UX, UI, IxD, thiết kế dịch vụ; vai trò designer trong đội sản phẩm","Double Diamond: khám phá → xác định → phát triển → bàn giao","Thiết kế lấy người dùng làm trung tâm và ràng buộc kinh doanh","Chỉ số UX: tỷ lệ hoàn thành, thời gian, SUS, NPS","Cộng tác với dev và PM: ngôn ngữ chung"],"e":"","h":[["BT 1.1.1 – Phân tích sản phẩm","Chọn 1 trang thương mại điện tử và phân tích mục tiêu người dùng, mục tiêu kinh doanh, 5 vấn đề UX. Đạt khi: mỗi vấn đề có bằng chứng (ảnh chụp)."],["BT 1.1.2 – Bản đồ quy trình","Vẽ quy trình thiết kế cho dự án của bạn với đầu ra từng bước. Đạt khi: có mốc thời gian."]]},{"t":"Bài 1.2 – Xác định vấn đề và mục tiêu nghiên cứu","m":"60 phút","g":"Đặt câu hỏi nghiên cứu đúng.","k":["Vấn đề thật vs giải pháp mong muốn; Jobs To Be Done","Giả thuyết và cách kiểm chứng","Chọn phương pháp: định tính vs định lượng","Kế hoạch nghiên cứu: mục tiêu, đối tượng, câu hỏi, thời gian","Đạo đức: đồng ý tham gia, bảo mật dữ liệu"],"e":"","h":[["BT 1.2.1 – Kế hoạch nghiên cứu","Viết kế hoạch 1 trang cho VITEC. Đạt khi: có 3 câu hỏi nghiên cứu đo được."],["BT 1.2.2 – Viết lại giả thuyết","Chuyển 5 ý kiến chủ quan thành giả thuyết kiểm chứng được. Đạt khi: mỗi giả thuyết có tiêu chí đúng/sai."]]}]},{"t":"Chương 2: Phương pháp nghiên cứu","ls":[{"t":"Bài 2.1 – Phỏng vấn và khảo sát","m":"90 phút","g":"Thực hiện phỏng vấn chuyên sâu và khảo sát chất lượng.","k":["Kịch bản phỏng vấn, câu hỏi mở, tránh dẫn dắt","Kỹ thuật 5 Why, ghi chép và ghi âm","Khảo sát: thiết kế câu hỏi, cỡ mẫu, thiên lệch","Tuyển chọn người tham gia phù hợp","Tổng hợp: affinity mapping"],"e":"","h":[["BT 2.1.1 – 5 buổi phỏng vấn","Phỏng vấn 5 người dùng mục tiêu, ghi chép và trích dẫn. Đạt khi: không câu hỏi nào dẫn dắt."],["BT 2.1.2 – Khảo sát 10 câu","Thiết kế và gửi khảo sát cho ≥ 20 người. Đạt khi: phân tích kết quả với biểu đồ."]]},{"t":"Bài 2.2 – Persona, hành trình người dùng và đối thủ","m":"75 phút","g":"Tổng hợp nghiên cứu thành sản phẩm thiết kế.","k":["Persona dựa dữ liệu, không hư cấu","Customer journey map: giai đoạn, hành động, cảm xúc, điểm đau","Phân tích đối thủ và benchmarking","How Might We và ưu tiên cơ hội","Trình bày insight cho stakeholder"],"e":"","h":[["BT 2.2.1 – Bộ tài liệu insight","Làm 2 persona, 1 journey map, 1 bảng đối thủ cho VITEC. Đạt khi: mỗi insight có nguồn từ nghiên cứu."],["BT 2.2.2 – Danh sách HMW","Sinh 10 HMW và chọn 3 ưu tiên. Đạt khi: nêu tiêu chí ưu tiên."]]}]}],"pj":["Bài kiểm tra cuối vùng 1: Hoàn thành gói nghiên cứu cho một tính năng của VITEC (kế hoạch, 5 phỏng vấn, persona, journey, 3 insight ưu tiên) và trình bày 10 phút. Thời lượng: 8 giờ."]},{"n":"Heuristic và nguyên tắc thiết kế giao diện","ch":[{"t":"Chương 3: Heuristic và tâm lý người dùng","ls":[{"t":"Bài 3.1 – 10 heuristic của Nielsen","m":"75 phút","g":"Đánh giá giao diện theo 10 heuristic.","k":["Khả năng nhìn thấy trạng thái hệ thống, khớp với thế giới thực","Kiểm soát của người dùng, nhất quán, phòng ngừa lỗi","Nhận biết hơn ghi nhớ, linh hoạt, tối giản, giúp xử lý lỗi, trợ giúp","Mức độ nghiêm trọng: tần suất, tác động, khả năng phát hiện","Cách thực hiện heuristic evaluation với nhiều người đánh giá"],"e":"","h":[["BT 3.1.1 – Heuristic evaluation","Đánh giá 1 website theo 10 heuristic, 15 vấn đề có mức độ nghiêm trọng. Đạt khi: mỗi vấn đề gắn heuristic và đề xuất sửa."],["BT 3.1.2 – Phòng ngừa lỗi","Tìm 5 ví dụ tốt/xấu về phòng ngừa lỗi trong form thanh toán. Đạt khi: có ảnh chụp."]]},{"t":"Bài 3.2 – Luật UX: Fitts, Hick, Miller, Gestalt","m":"75 phút","g":"Áp dụng các quy luật tâm lý vào bố cục.","k":["Fitts: kích thước và khoảng cách vùng chạm","Hick: giảm lựa chọn; Miller: chia nhóm thông tin","Gestalt: gần, tương đồng, đóng kín, liên tục","Tải nhận thức, mô hình tinh thần, mẫu F/Z","Mặc định tốt và tiết lộ dần (progressive disclosure)"],"e":"","h":[["BT 3.2.1 – Sửa giao diện","Chọn 1 màn hình phức tạp và đơn giản hóa bằng 4 luật. Đạt khi: nêu luật đã dùng cho từng thay đổi."],["BT 3.2.2 – Kiểm tra vùng chạm","Kiểm tra vùng chạm trên mobile đạt ≥ 44px. Đạt khi: báo cáo các điểm vi phạm."]]}]},{"t":"Chương 4: Thị giác và bố cục","ls":[{"t":"Bài 4.1 – Typography, màu sắc và khoảng trắng","m":"75 phút","g":"Thiết kế thị giác rõ ràng và đẹp.","k":["Thang chữ, độ dài dòng, line-height; chữ Việt có dấu","Màu: thương hiệu, ngữ nghĩa (thành công, lỗi), tương phản AA","Khoảng cách theo lưới 8px; căn lề","Phân cấp thị giác: kích cỡ, đậm nhạt, màu","Chế độ tối và an toàn cho người mù màu"],"e":"","h":[["BT 4.1.1 – Style guide mini","Tạo bảng chữ, màu, khoảng cách cho VITEC. Đạt khi: mọi cặp màu chữ–nền đạt AA."],["BT 4.1.2 – Phân cấp","Vẽ lại một trang có phân cấp rõ trong 5 giây nhìn. Đạt khi: người thử nêu đúng mục chính."]]},{"t":"Bài 4.2 – Lưới, bố cục responsive và khả năng truy cập","m":"60 phút","g":"Thiết kế bố cục thích ứng nhiều màn hình.","k":["Lưới 12 cột, điểm ngắt, mobile-first","Mẫu bố cục: danh sách–chi tiết, dashboard, form dài","Khả năng truy cập: tương phản, focus, nhãn, thứ tự đọc","Văn bản thay thế và nội dung phi văn bản","Kiểm tra bằng Stark/axe và trình đọc màn hình"],"e":"","h":[["BT 4.2.1 – 3 độ rộng","Thiết kế 1 trang ở 360, 768, 1280 px. Đạt khi: nội dung ưu tiên giữ nhất quán."],["BT 4.2.2 – Kiểm tra a11y","Rà soát thiết kế theo 10 mục WCAG. Đạt khi: nêu sửa cho mục không đạt."]]}]}],"pj":["Bài kiểm tra cuối vùng 2: Đánh giá heuristic một trang thương mại điện tử B2B, đề xuất 10 cải tiến với bản vẽ trước/sau và lý do theo luật UX. Thời lượng: 5 giờ."]},{"n":"Wireframe và mẫu thử trên Figma","ch":[{"t":"Chương 5: Từ ý tưởng đến wireframe","ls":[{"t":"Bài 5.1 – Luồng người dùng, sơ đồ thông tin và phác thảo","m":"75 phút","g":"Chuyển insight thành cấu trúc sản phẩm.","k":["Sơ đồ kiến trúc thông tin, card sorting","User flow và task flow","Phác thảo nhanh (crazy 8s)","Wireframe độ trung thực thấp: tập trung cấu trúc","Ghi chú hành vi và trạng thái (rỗng, tải, lỗi)"],"e":"","h":[["BT 5.1.1 – Luồng mua hàng","Vẽ flow tìm kiếm → so sánh → mua cho VITEC. Đạt khi: có nhánh lỗi và nhánh hủy."],["BT 5.1.2 – 8 phác thảo","Vẽ 8 phác thảo trong 8 phút cho trang chi tiết sản phẩm. Đạt khi: chọn 1 và giải thích."]]},{"t":"Bài 5.2 – Figma: khung, Auto Layout, component","m":"90 phút","g":"Dùng Figma thành thạo cho wireframe.","k":["Frame, constraint, layout grid","Auto Layout, spacing, padding; resizing","Component, variant, property","Style và biến (variable) cho màu, khoảng cách","Phím tắt và cách tổ chức trang/lớp"],"e":"","h":[["BT 5.2.1 – Wireframe 5 màn","Làm wireframe 5 màn hình (danh sách, chi tiết, giỏ, thanh toán, xác nhận) bằng Auto Layout. Đạt khi: đổi kích thước không vỡ."],["BT 5.2.2 – Component nút","Tạo component Button với 4 variant và 3 trạng thái. Đạt khi: dùng lại ở ≥ 10 nơi."]]}]},{"t":"Chương 6: Mẫu thử và kiểm tra thiết kế","ls":[{"t":"Bài 6.1 – Prototype tương tác và micro-interaction","m":"75 phút","g":"Tạo mẫu thử cho người dùng thử.","k":["Prototype: liên kết, overlay, smart animate","Trạng thái hover, focus, loading, lỗi","Mẫu thử độ trung thực cao và khi nào đủ","Micro-interaction có mục đích","Chia sẻ, bình luận, ghi chú cho dev"],"e":"","h":[["BT 6.1.1 – Prototype luồng chính","Làm prototype luồng thanh toán click được. Đạt khi: người thử hoàn thành không cần giải thích."],["BT 6.1.2 – Trạng thái","Thiết kế đủ trạng thái rỗng/tải/lỗi cho 3 màn. Đạt khi: danh sách trạng thái đầy đủ."]]},{"t":"Bài 6.2 – Phản hồi, vòng lặp và bàn giao cho developer","m":"75 phút","g":"Lặp thiết kế và bàn giao rõ ràng.","k":["Thu thập phản hồi: 5 người thử, cuộc họp review","Tổng hợp và ưu tiên chỉnh sửa","Dev Mode: thông số, tài nguyên, ghi chú","Đặt tên lớp và component thống nhất với mã","Quản lý phiên bản thiết kế"],"e":"","h":[["BT 6.2.1 – Vòng lặp 2 lần","Thực hiện 2 vòng thử và sửa, ghi thay đổi. Đạt khi: chỉ số hoàn thành tăng."],["BT 6.2.2 – Gói bàn giao","Chuẩn bị gói bàn giao 1 tính năng cho dev. Đạt khi: dev dựng được không cần hỏi thêm quá 3 câu."]]}]}],"pj":["Bài kiểm tra cuối vùng 3: Hoàn thành wireframe + prototype click được cho luồng \"Tìm và mua sản phẩm CNTT\" 8 màn hình, thử với 5 người, báo cáo kết quả. Thời lượng: 10 giờ."]},{"n":"Hệ thống thiết kế (design system)","ch":[{"t":"Chương 7: Xây dựng nền tảng hệ thống thiết kế","ls":[{"t":"Bài 7.1 – Token, thành phần và nguyên tắc","m":"75 phút","g":"Xây nền tảng nhất quán cho sản phẩm.","k":["Atomic design: nguyên tử, phân tử, sinh vật, mẫu, trang","Design token: màu, chữ, khoảng cách, bán kính, bóng","Tên token theo vai trò (color.text.primary) thay vì giá trị","Nguyên tắc thiết kế và giọng điệu nội dung","Hiện trạng: kiểm kê UI (UI audit)"],"e":"","h":[["BT 7.1.1 – UI audit","Chụp và phân loại mọi nút, form, màu hiện có trong dự án. Đạt khi: chỉ ra ≥ 10 sự không nhất quán."],["BT 7.1.2 – Bộ token","Xây bộ token 3 tầng (gốc, ngữ nghĩa, thành phần). Đạt khi: đổi chủ đề chỉ sửa tầng ngữ nghĩa."]]},{"t":"Bài 7.2 – Thư viện thành phần trên Figma","m":"90 phút","g":"Dựng thư viện thành phần dùng lại.","k":["Button, Input, Select, Checkbox, Modal, Toast, Table","Variant và property; trạng thái và kích cỡ","Tài liệu cho từng thành phần: khi dùng, không dùng, truy cập","Đặt tên và tổ chức thư viện","Phát hành thư viện, theo dõi cập nhật"],"e":"","h":[["BT 7.2.1 – 12 thành phần","Hoàn thành 12 thành phần có đủ trạng thái. Đạt khi: trang tài liệu mỗi thành phần có hướng dẫn."],["BT 7.2.2 – Chế độ tối","Thêm chủ đề tối bằng biến. Đạt khi: mọi cặp màu đạt AA."]]}]},{"t":"Chương 8: Đưa design system vào mã và vận hành","ls":[{"t":"Bài 8.1 – Đồng bộ thiết kế–mã và Storybook","m":"75 phút","g":"Kết nối design system với codebase.","k":["Xuất token sang CSS/Tailwind (Style Dictionary)","Thư viện React + Storybook","Kiểm thử hình ảnh (visual regression)","Phiên bản và changelog; chính sách thay đổi","Đo mức độ sử dụng"],"e":"","h":[["BT 8.1.1 – Token sang CSS","Xuất token thành biến CSS và dùng trong 1 trang. Đạt khi: khớp 100% Figma."],["BT 8.1.2 – Storybook","Dựng Storybook cho 5 thành phần. Đạt khi: có story trạng thái lỗi và vô hiệu."]]},{"t":"Bài 8.2 – Quản trị design system","m":"60 phút","g":"Giữ hệ thống sống và được dùng.","k":["Mô hình quản trị: tập trung, liên bang","Quy trình đề xuất thành phần mới","Đào tạo và tài liệu cho đội ngũ","Chỉ số: độ phủ, thời gian dựng màn hình","Rủi ro: bỏ rơi, quá cứng nhắc"],"e":"","h":[["BT 8.2.1 – Quy trình đóng góp","Viết quy trình 1 trang để thêm thành phần. Đạt khi: có checklist chất lượng."],["BT 8.2.2 – Số liệu","Đo thời gian dựng màn hình trước và sau design system. Đạt khi: nêu mức tiết kiệm."]]}]}],"pj":["Bài kiểm tra cuối vùng 4: Xây design system rút gọn cho VITEC: token, 12 thành phần, tài liệu, Storybook cho 5 thành phần. Thời lượng: 12 giờ."]},{"n":"Pattern thương mại điện tử B2B và kiểm thử khả dụng","ch":[{"t":"Chương 9: Pattern thương mại điện tử B2B","ls":[{"t":"Bài 9.1 – Tìm kiếm, lọc, so sánh và trang sản phẩm","m":"90 phút","g":"Thiết kế trải nghiệm tìm và chọn sản phẩm CNTT phức tạp.","k":["Tìm kiếm: gợi ý, lỗi chính tả, không có kết quả","Bộ lọc theo thông số kỹ thuật, trạng thái đã chọn, xóa nhanh","So sánh sản phẩm bảng thông số","Trang chi tiết: ảnh, thông số, tồn kho, giá theo bậc, tài liệu","Tin cậy: bảo hành, chứng nhận, đánh giá"],"e":"","h":[["BT 9.1.1 – Thiết kế bộ lọc","Thiết kế bộ lọc cho laptop (12 thuộc tính). Đạt khi: người thử tìm đúng sản phẩm dưới 60 giây."],["BT 9.1.2 – Trang chi tiết","Thiết kế trang chi tiết với giá bậc thang. Đạt khi: người thử hiểu giá cho số lượng 50."]]},{"t":"Bài 9.2 – Báo giá, đặt hàng, thanh toán công nợ và quản trị","m":"90 phút","g":"Thiết kế luồng đặc thù B2B.","k":["Giỏ hàng/danh sách báo giá, yêu cầu báo giá (RFQ)","Đặt hàng lặp lại, nhập hàng loạt CSV","Thanh toán: hóa đơn VAT, công nợ, phê duyệt nhiều cấp","Quản lý tài khoản doanh nghiệp, phân quyền người dùng","Theo dõi đơn, giao nhận, trả hàng"],"e":"","h":[["BT 9.2.1 – Luồng RFQ","Thiết kế luồng yêu cầu báo giá có phê duyệt. Đạt khi: có đủ trạng thái và thông báo."],["BT 9.2.2 – Nhập hàng loạt","Thiết kế nhập CSV với xem trước và báo lỗi từng dòng. Đạt khi: người thử sửa được dòng lỗi."]]}]},{"t":"Chương 10: Kiểm thử khả dụng và đo lường","ls":[{"t":"Bài 10.1 – Tổ chức kiểm thử khả dụng","m":"90 phút","g":"Chạy buổi kiểm thử khả dụng chuyên nghiệp.","k":["Chọn nhiệm vụ, kịch bản, tiêu chí thành công","Tuyển 5–8 người; moderated và unmoderated","Think-aloud, ghi chép, không giải thích giúp","Chỉ số: tỷ lệ hoàn thành, thời gian, số lỗi, SEQ, SUS","Báo cáo: phát hiện, mức độ nghiêm trọng, đề xuất"],"e":"","h":[["BT 10.1.1 – Buổi kiểm thử","Chạy 5 buổi cho prototype của bạn. Đạt khi: nộp video/ghi chép và bảng chỉ số."],["BT 10.1.2 – Báo cáo","Viết báo cáo 2 trang với 8 phát hiện xếp hạng. Đạt khi: mỗi phát hiện có đề xuất sửa."]]},{"t":"Bài 10.2 – Đo lường sau ra mắt và đồ án tổng kết","m":"4 giờ","g":"Đo hiệu quả thiết kế bằng dữ liệu và hoàn thành đồ án.","k":["Analytics: phễu chuyển đổi, bản đồ nhiệt, ghi phiên","A/B test: giả thuyết, cỡ mẫu, thời gian, ý nghĩa thống kê","Khảo sát in-product và phản hồi người dùng","Kể chuyện bằng dữ liệu cho stakeholder","Đồ án: bộ hồ sơ UX hoàn chỉnh cho một luồng VITEC"],"e":"","h":[["BT 10.2.1 – Kế hoạch A/B","Thiết kế 1 A/B test cho nút \"Yêu cầu báo giá\". Đạt khi: có giả thuyết, chỉ số chính, thời lượng."],["BT 10.2.2 – Hồ sơ cuối khóa","Hoàn thành hồ sơ: nghiên cứu, flow, wireframe, prototype, design system, kiểm thử. Đạt khi: trình bày 15 phút và nhận phản hồi."]]}]}],"pj":["Bài kiểm tra cuối vùng 5: Trình bày hồ sơ UX đầy đủ cho luồng \"Đặt hàng B2B\" của VITEC (flow, prototype, kết quả kiểm thử 5 người, 5 cải tiến ưu tiên) trước hội đồng 3 người. Thời lượng: 12 giờ."]}]},{"id":"vibe","name":"Vibe Coding & AI-assisted dev","tag":"Workflow, prompt, context, rủi ro, quản lý team","level":"Trung cấp","time":"3–4 tuần, thực hành liên tục","code":"code-vibe","who":"Lập trình viên, trưởng nhóm và người sáng lập muốn dùng AI để tăng tốc phát triển mà vẫn giữ chất lượng và an toàn.","pre":["Nền tảng lập trình đủ để đọc hiểu và đánh giá mã được sinh ra","Biết Git và quy trình pull request","Có tài khoản công cụ AI lập trình mà tổ chức cho phép sử dụng"],"map":[{"t":"Giai đoạn 1 – Nguyên tắc và quy trình","w":"Tuần 1","g":"Hiểu AI sinh mã làm được gì, không làm được gì và ai chịu trách nhiệm.","i":["Gợi ý mã, chat hỗ trợ, tác tử nhiều bước","Vòng lặp: mô tả, sinh, đọc, chạy, kiểm thử, sửa","Chia nhỏ nhiệm vụ và commit thường xuyên"],"o":"Hoàn thành một tính năng nhỏ bằng quy trình có kế hoạch, kiểm thử và commit từng bước."},{"t":"Giai đoạn 2 – Prompt, ngữ cảnh và chất lượng","w":"Tuần 2","g":"Viết prompt rõ ràng, quản lý ngữ cảnh và kiểm soát chất lượng mã do AI sinh.","i":["Khung prompt: vai trò, bối cảnh, mục tiêu, ràng buộc, nghiệm thu","Tệp quy ước dự án và tóm tắt kiến trúc","Review mã, viết kiểm thử, refactor có AI"],"o":"Tệp quy ước dự án và bộ 5 prompt mẫu đã thử, có đánh giá chất lượng đầu ra."},{"t":"Giai đoạn 3 – Bảo mật và vận hành trong nhóm","w":"Tuần 3–4","g":"Dùng AI an toàn trong nhóm, có chính sách, cổng chất lượng và chỉ số đo hiệu quả.","i":["Rủi ro bảo mật, bí mật, giấy phép","CI làm cổng chất lượng","Chính sách dùng AI, đào tạo thực tập sinh, đo hiệu quả"],"o":"Chính sách dùng AI cho nhóm, pipeline CI có lint, test, quét bảo mật và bảng chỉ số theo dõi."}],"areas":[{"n":"Nguyên tắc và quy trình làm việc với AI","d":"Nền tảng để tăng tốc mà không mất kiểm soát: AI sinh mã, con người chịu trách nhiệm.","p":["Ba mức công cụ: gợi ý mã, chat hỗ trợ, tác tử làm việc nhiều bước","Nguyên tắc: kế hoạch trước, mã sau, kiểm thử ngay","Chia nhiệm vụ đủ nhỏ để kiểm chứng được (mỗi bước chạy được)","Dùng Git: nhánh riêng, commit nhỏ, dễ hoàn tác","Khi nào không nên dùng AI: mã bảo mật lõi, logic tài chính chưa hiểu rõ"],"x":[["Bài 1 – Cơ bản: Tính năng nhỏ có kế hoạch","Chọn một tính năng nhỏ (ví dụ lọc sản phẩm theo danh mục), yêu cầu AI nêu kế hoạch, duyệt kế hoạch rồi mới cho viết mã. Đạt khi: có 3–5 commit nhỏ, mỗi commit chạy được."],["Bài 2 – Nâng cao: So sánh hai cách làm","Làm cùng một tính năng theo hai cách: yêu cầu cả tính năng một lần và chia nhỏ từng bước. Đạt khi: báo cáo so sánh số lỗi, thời gian sửa và độ dễ hiểu của mã."]]},{"n":"Prompt và quản lý ngữ cảnh","d":"Chất lượng đầu ra phụ thuộc trực tiếp vào chất lượng đầu vào và ngữ cảnh bạn cung cấp.","p":["Khung prompt: vai trò, bối cảnh, mục tiêu, ràng buộc, đầu vào/ra, tiêu chí nghiệm thu, định dạng","Cung cấp mã liên quan thay vì mô tả mơ hồ","Nêu rõ điều không được làm (không đổi schema, không thêm thư viện)","Tệp quy ước dự án: kiến trúc, phong cách mã, lệnh build và test","Lặp lại: phản hồi cụ thể, không chỉ nói 'sai rồi'"],"x":[["Bài 1 – Cơ bản: Viết lại prompt tệ","Cho 3 prompt mơ hồ, viết lại theo khung 7 phần và so sánh kết quả. Đạt khi: kết quả mới đúng yêu cầu ngay lần đầu ở ít nhất 2/3 trường hợp."],["Bài 2 – Nâng cao: Tệp quy ước dự án","Viết tệp quy ước (kiến trúc, quy tắc đặt tên, điều cấm) cho một dự án thật và đo chất lượng đầu ra trước và sau. Đạt khi: số lần phải sửa lại giảm rõ rệt, có số liệu."]]},{"n":"Review, kiểm thử và chất lượng","d":"Không có mã nào được hợp nhất nếu chưa được con người hiểu và kiểm thử.","p":["Cách đọc diff: logic, trường hợp biên, xử lý lỗi, hiệu năng","Yêu cầu AI viết kiểm thử và tự kiểm tra kiểm thử có khẳng định đúng hành vi","Phát hiện hàm và thư viện không tồn tại (ảo giác)","Lint, định dạng, kiểm tra kiểu trong CI","Refactor có AI nhưng giữ nguyên hành vi (có test bảo vệ)"],"x":[["Bài 1 – Cơ bản: Review mã AI","Nhận một đoạn mã do AI sinh có 5 lỗi cài sẵn (logic, biên, bảo mật). Tìm và ghi lại hết. Đạt khi: tìm đúng ít nhất 4/5 lỗi và giải thích."],["Bài 2 – Nâng cao: Cổng chất lượng CI","Thiết lập CI chạy lint, kiểm thử và chặn hợp nhất khi thất bại. Đạt khi: một pull request cố tình hỏng bị chặn thành công."]]},{"n":"Bảo mật và rủi ro khi dùng AI lập trình","d":"Mã sinh bởi AI có thể trông đúng nhưng chứa lỗ hổng hoặc làm lộ dữ liệu nhạy cảm.","p":["Không đưa khóa bí mật, mật khẩu, dữ liệu khách hàng vào công cụ AI không được phê duyệt","Các lỗ hổng thường gặp: SQL injection, thiếu kiểm tra quyền, XSS, lộ secret trong mã","Quét phụ thuộc và giấy phép nguồn mở","Biến môi trường và quản lý bí mật đúng cách","Quy trình xử lý khi lỡ lộ khóa: thu hồi và đổi ngay"],"x":[["Bài 1 – Cơ bản: Quét bí mật","Cài công cụ quét bí mật vào kho mã, thử commit một khóa giả và kiểm tra bị chặn. Đạt khi: commit chứa khóa giả bị từ chối."],["Bài 2 – Nâng cao: Rà soát bảo mật mã AI","Nhờ AI sinh API đăng nhập, sau đó rà soát bảo mật theo danh sách kiểm tra (băm mật khẩu, giới hạn thử, kiểm tra quyền). Đạt khi: ghi nhận và sửa tối thiểu 3 điểm yếu."]]},{"n":"Quản lý đội ngũ và đo lường hiệu quả","d":"Đưa AI vào quy trình của nhóm một cách có kiểm soát để năng suất tăng mà chất lượng không giảm.","p":["Chính sách: việc nào được dùng AI, bắt buộc review ra sao, ghi nhận trong PR","Đào tạo thực tập sinh: giải thích được mã mình nộp, có bài rèn không dùng AI","Chỉ số: thời gian giao tính năng, lỗi sau phát hành, thời gian review, mức hài lòng","Quản lý chi phí công cụ AI và quyền truy cập","Rà soát và cập nhật chính sách định kỳ"],"x":[["Bài 1 – Cơ bản: Soạn chính sách dùng AI","Soạn chính sách một trang cho nhóm 5 người: phạm vi, quy tắc review, dữ liệu cấm đưa vào, cách ghi nhận. Đạt khi: một người ngoài đọc xong trả lời đúng 5 câu hỏi kiểm tra."],["Bài 2 – Nâng cao: Bảng chỉ số","Thiết kế bảng theo dõi 5 chỉ số trước và sau khi áp dụng AI trong 4 tuần. Đạt khi: có số liệu thật và kết luận có dẫn chứng."]]}],"pit":["Chấp nhận mã mà không đọc hay chạy thử","Giao nhiệm vụ quá lớn khiến mã rối và khó sửa","Dán dữ liệu nhạy cảm hoặc khóa bí mật vào công cụ AI","Để AI tự thêm phụ thuộc mới không kiểm soát","Không có kiểm thử nên không biết AI vừa làm hỏng gì"],"proj":["Xây tính năng tìm kiếm có lọc cho một ứng dụng thật bằng quy trình 'kế hoạch → mã → test → review'","Viết tệp quy ước dự án (kiến trúc, phong cách mã, điều không được làm) và so sánh chất lượng đầu ra trước/sau","Thiết lập CI có lint, test, quét bảo mật như cổng bắt buộc","Soạn chính sách sử dụng AI cho nhóm và quy trình onboarding thực tập sinh"],"tools":["Trợ lý và tác tử lập trình trong IDE hoặc terminal (ví dụ Claude Code)","Git, GitHub Actions","Công cụ quét bảo mật (Dependabot, CodeQL hoặc tương đương)","Pre-commit hooks, linter, trình kiểm thử"],"refs":["Tài liệu chính thức của công cụ AI đang dùng (docs.claude.com cho Claude)","Hướng dẫn kỹ thuật viết prompt (docs.claude.com)","OWASP (owasp.org) về bảo mật ứng dụng"],"check":["Có quy trình chia nhỏ và kiểm chứng từng bước","Mọi thay đổi do AI sinh ra đều qua review và test","Không có bí mật hoặc dữ liệu khách hàng trong prompt","Nhóm có chính sách và chỉ số đo hiệu quả rõ ràng"],"cur":[{"n":"Nguyên tắc và quy trình làm việc với AI","ch":[{"t":"Chương 1: Hiểu công cụ và giới hạn","ls":[{"t":"Bài 1.1 – Vibe coding là gì và bức tranh công cụ","m":"60 phút","g":"Phân biệt vibe coding, AI-assisted, agentic coding; chọn công cụ phù hợp.","k":["Định nghĩa: vibe coding (chấp nhận mã mà không đọc) so với AI-assisted có kiểm soát","Nhóm công cụ: chat, editor tích hợp, agent dòng lệnh, nền tảng tạo ứng dụng","LLM hoạt động thế nào ở mức đủ dùng: ngữ cảnh, token, ảo giác","Khi nào phù hợp (prototype, script) và khi nào nguy hiểm (thanh toán, bảo mật)","Chi phí, quyền riêng tư và chính sách dữ liệu"],"e":"","h":[["BT 1.1.1 – Bảng quyết định","Lập bảng 10 loại tác vụ và mức độ phù hợp với AI (cao/trung bình/thấp) kèm lý do. Đạt khi: có ít nhất 3 tác vụ không nên giao AI."],["BT 1.1.2 – So sánh công cụ","Thử 2 công cụ trên cùng 1 yêu cầu nhỏ. Đạt khi: nộp bảng so sánh chất lượng, thời gian, chi phí."]]},{"t":"Bài 1.2 – Vòng lặp làm việc: Hiểu – Lập kế hoạch – Làm – Kiểm chứng","m":"75 phút","g":"Áp dụng quy trình có kiểm soát thay vì thử và sai ngẫu nhiên.","k":["Bốn bước: làm rõ yêu cầu, kế hoạch nhỏ, thực hiện từng bước, kiểm chứng","Chia việc thành lát cắt dọc nhỏ có thể kiểm tra","Dùng AI để lập kế hoạch và phản biện trước khi viết mã","Điểm dừng: lúc nào con người phải xem xét","Ghi lại quyết định thiết kế (ADR) ngắn"],"e":"","h":[["BT 1.2.1 – Một tính năng đầy đủ","Làm tính năng \"đăng ký tài khoản\" theo 4 bước, ghi nhật ký prompt. Đạt khi: mỗi bước có bằng chứng kiểm chứng."],["BT 1.2.2 – Chia lát cắt","Chia 1 epic thành 6 lát cắt ≤ 2 giờ. Đạt khi: mỗi lát có tiêu chí hoàn thành."]]}]},{"t":"Chương 2: Thiết lập dự án thân thiện với AI","ls":[{"t":"Bài 2.1 – Cấu trúc repo, quy ước và tệp hướng dẫn","m":"60 phút","g":"Chuẩn bị repo để AI làm đúng chuẩn của đội.","k":["Tệp hướng dẫn cho agent (ví dụ CLAUDE.md/AGENTS.md): lệnh build, test, quy ước, vùng cấm","Cấu trúc thư mục rõ ràng, tên gọi nhất quán","Linter, formatter, type-check làm rào chắn tự động","Kiểm thử là hợp đồng: viết kiểm thử trước hoặc cùng lúc","Quản lý bí mật: .env không đưa cho AI"],"e":"# AGENTS.md (mẫu)\n## Lệnh\n- Build: pnpm build\n- Test: pnpm test\n## Quy ước\n- TypeScript strict, không dùng any\n- Không sửa thư mục /migrations\n- Mọi thay đổi phải có test","h":[["BT 2.1.1 – Tệp hướng dẫn","Viết tệp hướng dẫn cho repo của bạn và thử với 3 tác vụ. Đạt khi: AI chạy đúng lệnh test và tuân thủ quy ước."],["BT 2.1.2 – Rào chắn","Thiết lập pre-commit chạy lint, type-check, test. Đạt khi: commit lỗi bị chặn."]]},{"t":"Bài 2.2 – Git an toàn khi dùng AI","m":"60 phút","g":"Dùng Git để kiểm soát rủi ro khi AI thay đổi mã.","k":["Nhánh riêng cho mỗi tác vụ AI; commit nhỏ, thường xuyên","Xem diff trước khi chấp nhận; chia nhỏ PR","Hoàn tác nhanh: reset, revert, stash","Worktree để chạy nhiều tác vụ song song","Quy tắc: không bao giờ để AI force-push hoặc sửa nhánh chính"],"e":"","h":[["BT 2.2.1 – Quy trình nhánh","Thực hiện 3 tác vụ AI trên 3 nhánh và hợp nhất. Đạt khi: lịch sử commit rõ ràng, có 1 lần revert thành công."],["BT 2.2.2 – Bộ quy tắc","Viết 10 quy tắc Git cho đội khi dùng AI. Đạt khi: đội đồng ý áp dụng."]]}]}],"pj":["Bài kiểm tra cuối vùng 1: Dùng AI làm một ứng dụng nhỏ (todo + API) theo quy trình 4 bước có tệp hướng dẫn, rào chắn tự động, nhật ký quyết định; nộp repo và nhật ký. Thời lượng: 5 giờ."]},{"n":"Prompt và quản lý ngữ cảnh","ch":[{"t":"Chương 3: Kỹ thuật prompt","ls":[{"t":"Bài 3.1 – Viết yêu cầu rõ ràng, có ràng buộc và tiêu chí nghiệm thu","m":"75 phút","g":"Viết prompt đủ ngữ cảnh để AI làm đúng lần đầu.","k":["Cấu trúc: mục tiêu, ngữ cảnh, ràng buộc, định dạng đầu ra, tiêu chí nghiệm thu","Đưa ví dụ vào/ra; chỉ rõ điều KHÔNG làm","Yêu cầu AI hỏi lại khi thiếu thông tin","Yêu cầu giải thích kế hoạch trước khi viết mã","Prompt tái sử dụng (template) cho tác vụ lặp lại"],"e":"Mục tiêu: thêm API POST /api/orders.\nNgữ cảnh: Spring Boot 3, tầng controller/service/repo, đã có Order entity.\nRàng buộc: không đổi schema; dùng record DTO; validation @Valid.\nĐầu ra: danh sách tệp sửa + test JUnit.\nNghiệm thu: mvn test xanh; đặt hàng thiếu tồn kho trả 409.\nHỏi lại tôi nếu thiếu thông tin trước khi viết.","h":[["BT 3.1.1 – Viết lại prompt tệ","Cho 5 prompt mơ hồ, viết lại theo cấu trúc. Đạt khi: chạy cả hai và so sánh kết quả."],["BT 3.1.2 – Thư viện prompt","Tạo 8 template prompt cho tác vụ thường làm (CRUD, refactor, viết test, giải thích lỗi...). Đạt khi: mỗi template có ví dụ dùng."]]},{"t":"Bài 3.2 – Gỡ lỗi và lặp với AI","m":"60 phút","g":"Dùng AI để gỡ lỗi mà không mất kiểm soát.","k":["Cung cấp lỗi đầy đủ: thông báo, stack trace, bước tái hiện","Yêu cầu giả thuyết và cách kiểm chứng, không đoán rồi sửa bừa","Tránh vòng lặp \"sửa – hỏng – sửa\": quay lại kế hoạch","Khi AI bí: đổi cách hỏi, rút gọn ví dụ tối thiểu, tự đọc mã","Ghi bài học vào tệp hướng dẫn"],"e":"","h":[["BT 3.2.1 – Bốn lỗi","Gỡ 4 lỗi cho sẵn bằng AI, mỗi lỗi nộp giả thuyết và cách kiểm chứng. Đạt khi: không lần nào sửa theo kiểu đoán."],["BT 3.2.2 – Ví dụ tối thiểu","Rút gọn 1 lỗi phức tạp thành ví dụ 20 dòng. Đạt khi: người khác tái hiện được."]]}]},{"t":"Chương 4: Quản lý ngữ cảnh và agent","ls":[{"t":"Bài 4.1 – Cửa sổ ngữ cảnh, tóm tắt và tách phiên","m":"60 phút","g":"Giữ ngữ cảnh gọn để chất lượng không giảm.","k":["Ngữ cảnh có giới hạn; thông tin cũ/nhiễu làm giảm chất lượng","Đưa đúng tệp, đúng đoạn: mô tả cấu trúc thay vì dán tất cả","Tóm tắt phiên và bắt đầu phiên mới với bản tóm tắt","Bộ nhớ lâu dài qua tệp hướng dẫn thay vì lặp lại","Tách phiên theo tác vụ: nghiên cứu, thực hiện, review"],"e":"","h":[["BT 4.1.1 – Bản tóm tắt chuyển giao","Viết tóm tắt cho phiên dài và bắt đầu phiên mới. Đạt khi: AI tiếp tục đúng mà không hỏi lại điều đã quyết."],["BT 4.1.2 – Ngữ cảnh tối thiểu","Giải 1 tác vụ với ngữ cảnh tối thiểu và đầy đủ, so sánh. Đạt khi: nêu kết luận."]]},{"t":"Bài 4.2 – Agent, công cụ và quy trình tự động","m":"75 phút","g":"Dùng agent có giới hạn quyền hạn.","k":["Agent làm gì: đọc mã, chạy lệnh, sửa tệp; rủi ro đi kèm","Quyền hạn tối thiểu: chỉ cho phép lệnh cần thiết, sandbox","Hook, lệnh tùy chỉnh, MCP để kết nối công cụ (giới thiệu)","Tự động hóa lặp lại: viết test, đổi tên, nâng cấp phụ thuộc","Quan sát: xem nhật ký hành động của agent"],"e":"","h":[["BT 4.2.1 – Quyền tối thiểu","Cấu hình agent chỉ chạy lệnh test/lint và đọc thư mục dự án. Đạt khi: lệnh ngoài danh sách bị chặn."],["BT 4.2.2 – Tự động nâng cấp","Dùng agent nâng cấp 1 phụ thuộc và sửa mã gãy. Đạt khi: test xanh và diff được review."]]}]}],"pj":["Bài kiểm tra cuối vùng 2: Thực hiện 3 tác vụ (tính năng mới, sửa lỗi, refactor) trên repo cho sẵn chỉ bằng prompt có cấu trúc; nộp nhật ký prompt, số vòng lặp và tỷ lệ mã giữ lại. Thời lượng: 5 giờ."]},{"n":"Review, kiểm thử và chất lượng","ch":[{"t":"Chương 5: Review mã do AI sinh ra","ls":[{"t":"Bài 5.1 – Danh sách kiểm tra review mã AI","m":"75 phút","g":"Phát hiện lỗi đặc trưng của mã AI.","k":["Lỗi đặc trưng: API không tồn tại, thư viện lỗi thời, xử lý lỗi nuốt chửng","Mã đúng nhưng thừa: trùng lặp, sao chép–dán, trừu tượng không cần","Kiểm tra: biên, null, đồng thời, hiệu năng, bảo mật","Đọc diff theo thứ tự: kiểm thử → giao diện công khai → logic","Quy tắc: không merge mã không hiểu"],"e":"","h":[["BT 5.1.1 – Săn lỗi","Cho 3 PR do AI sinh có 10 lỗi cố ý, tìm càng nhiều càng tốt. Đạt khi: tìm ≥ 8/10 và phân loại."],["BT 5.1.2 – Checklist riêng","Viết checklist review 15 mục của đội. Đạt khi: áp dụng cho 2 PR thật."]]},{"t":"Bài 5.2 – Bẫy ảo giác và xác minh sự thật","m":"60 phút","g":"Xác minh thông tin kỹ thuật từ AI.","k":["Ảo giác: hàm, tham số, phiên bản không có thật","Xác minh bằng tài liệu chính thức, chạy thử, kiểm tra nguồn","Dấu hiệu: tự tin quá mức, chi tiết quá đẹp","Yêu cầu AI trích nguồn và tự kiểm tra lại","Giữ danh sách phiên bản/phụ thuộc làm chuẩn"],"e":"","h":[["BT 5.2.1 – 10 khẳng định","Cho AI 10 khẳng định kỹ thuật, xác minh từng cái. Đạt khi: nêu số sai và nguồn xác minh."],["BT 5.2.2 – Bẫy phiên bản","Tìm 3 trường hợp AI dùng API cũ. Đạt khi: nộp bản sửa theo tài liệu hiện hành."]]}]},{"t":"Chương 6: Kiểm thử và chất lượng tự động","ls":[{"t":"Bài 6.1 – Kiểm thử đi trước và AI sinh kiểm thử","m":"75 phút","g":"Dùng kiểm thử để điều khiển AI và kiểm tra nó.","k":["TDD với AI: viết kiểm thử thất bại, AI làm cho xanh","Nhờ AI sinh kiểm thử biên và đột biến (mutation) rồi tự đọc lại","Kiểm thử thuộc tính (property-based) cho logic phức tạp","Đừng để AI sửa kiểm thử để mã qua","Độ phủ không phải chất lượng"],"e":"","h":[["BT 6.1.1 – TDD với agent","Làm 1 module bằng TDD với AI. Đạt khi: kiểm thử có trước và không bị sửa để qua."],["BT 6.1.2 – Kiểm tra bằng đột biến","Chạy công cụ mutation trên module. Đạt khi: điểm đột biến ≥ 70%."]]},{"t":"Bài 6.2 – CI, chặn chất lượng và đo lường mã AI","m":"60 phút","g":"Đưa kiểm tra tự động làm cổng chặn.","k":["CI: lint, type-check, test, quét bảo mật là bắt buộc","Phân tích tĩnh (SonarQube, CodeQL)","Chỉ số: tỷ lệ lỗi, thời gian review, độ ổn định build","Đánh dấu PR có AI hỗ trợ để theo dõi chất lượng","Quy tắc nợ kỹ thuật cho mã AI"],"e":"","h":[["BT 6.2.1 – Cổng chất lượng","Thiết lập CI chặn merge khi test/lint/bảo mật lỗi. Đạt khi: thử PR lỗi bị chặn."],["BT 6.2.2 – Bảng chỉ số","Theo dõi 4 chỉ số trong 2 tuần. Đạt khi: nêu xu hướng và hành động."]]}]}],"pj":["Bài kiểm tra cuối vùng 3: Review và cải thiện một ứng dụng 2000 dòng do AI sinh ra: tìm lỗi, thêm kiểm thử, thiết lập CI, giảm trùng lặp; báo cáo trước/sau. Thời lượng: 6 giờ."]},{"n":"Bảo mật và rủi ro khi dùng AI lập trình","ch":[{"t":"Chương 7: Bảo mật mã và dữ liệu","ls":[{"t":"Bài 7.1 – Rò rỉ dữ liệu, bí mật và quyền riêng tư","m":"60 phút","g":"Không làm lộ dữ liệu khi dùng công cụ AI.","k":["Không dán khóa, mật khẩu, dữ liệu khách hàng vào công cụ không được phê duyệt","Chính sách dữ liệu của nhà cung cấp, chế độ doanh nghiệp","Dùng dữ liệu giả hoặc ẩn danh khi minh họa","Quét bí mật trong repo (gitleaks) và xoay khóa khi lộ","Tuân thủ quy định bảo vệ dữ liệu cá nhân"],"e":"","h":[["BT 7.1.1 – Chính sách dùng AI","Viết chính sách dùng AI 1 trang cho công ty. Đạt khi: phân loại dữ liệu được/không được đưa vào AI."],["BT 7.1.2 – Quét bí mật","Cài gitleaks vào pre-commit và thử khóa giả. Đạt khi: commit bị chặn."]]},{"t":"Bài 7.2 – Lỗ hổng trong mã AI và tấn công chuỗi cung ứng","m":"75 phút","g":"Nhận diện lỗ hổng thường gặp và rủi ro phụ thuộc.","k":["Lỗ hổng hay gặp: injection, XSS, xác thực yếu, CORS mở, mật khẩu cứng","Gói giả mạo/gợi ý gói không tồn tại (slopsquatting)","Kiểm tra phụ thuộc: npm audit, Dependabot, SCA","Prompt injection: dữ liệu ngoài điều khiển agent","Nguyên tắc: coi đầu ra AI là đầu vào không tin cậy"],"e":"","h":[["BT 7.2.1 – Săn lỗ hổng","Cho đoạn mã AI sinh có 6 lỗ hổng, tìm và vá. Đạt khi: ≥ 5/6 có bản vá và kiểm thử."],["BT 7.2.2 – Kiểm tra phụ thuộc","Rà soát phụ thuộc của 1 dự án và loại bỏ gói nghi ngờ. Đạt khi: nêu lý do từng gói."]]}]},{"t":"Chương 8: Pháp lý, đạo đức và quản trị rủi ro","ls":[{"t":"Bài 8.1 – Bản quyền, giấy phép và trách nhiệm","m":"60 phút","g":"Hiểu rủi ro pháp lý khi dùng mã do AI sinh.","k":["Bản quyền mã AI: còn nhiều điểm chưa rõ, theo dõi quy định","Giấy phép mã nguồn mở và rủi ro sao chép","Hợp đồng với khách hàng: điều khoản về AI","Trách nhiệm cuối cùng thuộc về người commit","Ghi chép nguồn gốc mã (provenance)"],"e":"","h":[["BT 8.1.1 – Điều khoản hợp đồng","Soạn điều khoản AI cho hợp đồng outsourcing mẫu. Đạt khi: có tham vấn pháp lý trước khi dùng thật."],["BT 8.1.2 – Quét giấy phép","Chạy công cụ quét giấy phép trên dự án. Đạt khi: báo cáo xung đột."]]},{"t":"Bài 8.2 – Ma trận rủi ro và kế hoạch ứng phó","m":"60 phút","g":"Đánh giá rủi ro AI cho dự án thực tế.","k":["Ma trận khả năng × tác động cho mối nguy AI","Biện pháp giảm thiểu theo lớp: quy trình, công cụ, đào tạo","Kế hoạch ứng phó sự cố khi lộ khóa hoặc mã lỗi vào sản xuất","Đào tạo định kỳ cho đội","Kiểm toán nội bộ"],"e":"","h":[["BT 8.2.1 – Ma trận rủi ro","Lập ma trận 12 rủi ro AI cho VITEC. Đạt khi: mỗi rủi ro có người chịu trách nhiệm và biện pháp."],["BT 8.2.2 – Diễn tập sự cố","Diễn tập tình huống lộ khóa API. Đạt khi: thời gian xoay khóa < 30 phút."]]}]}],"pj":["Bài kiểm tra cuối vùng 4: Thực hiện kiểm toán bảo mật cho một repo do AI sinh (bí mật, lỗ hổng, phụ thuộc, giấy phép) và nộp báo cáo kèm bản vá. Thời lượng: 5 giờ."]},{"n":"Quản lý đội ngũ và đo lường hiệu quả","ch":[{"t":"Chương 9: Đưa AI vào đội phát triển","ls":[{"t":"Bài 9.1 – Quy trình đội, vai trò và chuẩn mực","m":"75 phút","g":"Triển khai AI cho cả đội có kỷ luật.","k":["Vai trò: người dùng AI, người review, chủ sở hữu công cụ","Quy ước đội: dùng AI cho gì, review thế nào, ghi nhận ra sao","Onboarding cho thực tập sinh: học nền tảng trước, dùng AI có giám sát","Rủi ro kỹ năng [["BT 10.2.1 – Kế hoạch triển khai","Lập kế hoạch 90 ngày áp dụng AI cho đội thật (hoặc giả định). Đạt khi: có mục tiêu, KPI, hạn, rủi ro."],["BT 10.2.2 – Báo cáo kết quả","Viết báo cáo kết quả thử nghiệm với số liệu. Đạt khi: nêu bài học và quyết định tiếp theo."]]}]}],"pj":["Bài kiểm tra cuối vùng 5: Trình bày đề án \"Chiến lược dùng AI cho công ty\" gồm quy trình, chính sách bảo mật, chỉ số, chi phí, kế hoạch 90 ngày; bảo vệ trước 3 người phản biện. Thời lượng: 6 giờ."]}]}];

function el(tag, cls, text){var e=document.createElement(tag);if(cls)e.className=cls;if(text!=null)e.textContent=text;return e;}
function ul(items){var u=el('ul');items.forEach(function(i){u.appendChild(el('li',null,i));});return u;}
function sec(title){var s=el('section');s.appendChild(el('h3',null,title));return s;}
function codeOf(id){var n=document.getElementById(id);return n?n.textContent.replace(/^\n/,'').replace(/\s+$/,''):'';}

function note(){var n=el('div','note-red');n.appendChild(document.createTextNode('Lưu ý: các bạn muốn học qua video bài bản vui lòng liên hệ ad: '));var a=el('a',null,'0335 111783');a.href='tel:0335111783';n.appendChild(a);return n;}
function topbar(){var t=el('div','topbar');var a=el('a','home','← Document Course');a.href='#';a.setAttribute('data-go','');t.appendChild(a);t.appendChild(el('span',null,'📖 Kho tài liệu tự học miễn phí'));return t;}
function home(){
  var f=document.createDocumentFragment();
  var tb=el('div','topbar');tb.appendChild(el('span',null,'📖 Kho tài liệu tự học miễn phí'));f.appendChild(tb);
  f.appendChild(el('h1',null,'Document Course'));
  f.appendChild(note());
  f.appendChild(el('p','lead','Bộ tài liệu tổng hợp tự học cho Fullstack Developer. Mở từng chủ đề bên dưới.'));
  var g=el('div','grid');
  T.forEach(function(t){
    var a=el('a','card');a.href='#'+t.id;a.setAttribute('data-go',t.id);
    a.appendChild(el('h2',null,t.name));
    a.appendChild(el('p',null,t.tag));
    a.appendChild(el('div','meta',t.level+' · '+t.time));
    g.appendChild(a);
  });
  f.appendChild(g);
  return f;
}

function withToc(d,i){
  var wrap=el('div','layout'),nav=el('nav','toc');
  var back=el('a','back','← Tất cả chủ đề');back.href='#';back.setAttribute('data-go','');nav.appendChild(back);
  nav.appendChild(el('h2',null,'Mục lục'));
  var secs=d.querySelectorAll('section');
  Array.prototype.forEach.call(secs,function(s,k){var id='sec-'+k;s.id=id;var a=el('a',null,s.querySelector('h3').textContent);a.setAttribute('data-scroll',id);nav.appendChild(a);});
  nav.appendChild(el('h2',null,'Chủ đề khác'));
  T.forEach(function(t,k){if(k===i)return;var a=el('a',null,t.name);a.href='#'+t.id;a.setAttribute('data-go',t.id);nav.appendChild(a);});
  var oldBack=d.querySelector('.back');if(oldBack)oldBack.remove();
  wrap.appendChild(nav);wrap.appendChild(d);return wrap;
}
function topic(i){
  var t=T[i],d=el('article','topic');
  var back=el('a','back','← Tất cả chủ đề');back.href='#';back.setAttribute('data-go','');d.appendChild(back);
  d.appendChild(el('h1',null,t.name));
  var b=el('div','badges');[t.level,'Thời lượng: '+t.time].forEach(function(x){b.appendChild(el('span','badge',x));});d.appendChild(b);

  var s=sec('Tổng quan');s.appendChild(el('p',null,t.tag+'.'));s.appendChild(el('h4',null,'Phù hợp với'));s.appendChild(el('p',null,t.who));
  s.appendChild(el('h4',null,'Kiến thức tiên quyết'));s.appendChild(ul(t.pre));d.appendChild(s);

  d.appendChild(note());
  s=sec('Lộ trình học');t.map.forEach(function(p){var box=el('div','phase');var h4=el('h4',null,p.t);h4.appendChild(el('span','wk',p.w));box.appendChild(h4);box.appendChild(el('p',null,'Mục tiêu: '+p.g));box.appendChild(el('div','lb','Nội dung'));box.appendChild(ul(p.i));var o=el('p','out');var ob=el('b',null,'Đầu ra: ');o.appendChild(ob);o.appendChild(document.createTextNode(p.o));box.appendChild(o);s.appendChild(box);});d.appendChild(s);

  if(!t.cur){  s=sec('Vùng kiến thức & bài tập');t.areas.forEach(function(ar,k){var box=el('div','area');box.appendChild(el('h4',null,'Vùng kiến thức '+(k+1)+': '+ar.n));box.appendChild(el('p',null,ar.d));box.appendChild(el('div','lb','Nội dung cần nắm'));box.appendChild(ul(ar.p));box.appendChild(el('div','lb','Bài tập'));ar.x.forEach(function(q,j){var w=el('div','ex');var bb=el('b',null,'Bài '+(k+1)+'.'+(j+1)+' – '+q[0]);w.appendChild(bb);w.appendChild(el('p',null,q[1]));box.appendChild(w);});s.appendChild(box);});d.appendChild(s);}


  if(t.cur){s=sec('Giáo trình chi tiết (chương, bài học, bài tập về nhà)');
    var tl=el('div','cur-tools');var b1=el('button',null,'Mở tất cả'),b2=el('button',null,'Thu gọn tất cả');
    b1.type='button';b2.type='button';
    b1.addEventListener('click',function(){s.querySelectorAll('details').forEach(function(x){x.open=true;});});
    b2.addEventListener('click',function(){s.querySelectorAll('details').forEach(function(x){x.open=false;});});
    tl.appendChild(b1);tl.appendChild(b2);s.appendChild(tl);
    var cnt=0,hw=0;t.cur.forEach(function(a){a.ch.forEach(function(c){c.ls.forEach(function(l){cnt++;hw+=l.h.length;});});});
    s.appendChild(el('p',null,'Tổng cộng '+t.cur.length+' vùng kiến thức, '+cnt+' bài học, '+hw+' bài tập về nhà. Bấm vào từng mục để mở.'));
    t.cur.forEach(function(a,k){var da=el('details','cur-area');da.appendChild(el('summary',null,'Vùng '+(k+1)+': '+a.n));
      a.ch.forEach(function(c){var dc=el('details','cur-ch');dc.appendChild(el('summary',null,c.t));
        c.ls.forEach(function(l){var dl=el('details','cur-ls');var sm=el('summary',null,l.t);sm.appendChild(el('span','dur','· '+l.m));dl.appendChild(sm);
          var g=el('p');g.appendChild(el('b',null,'Mục tiêu: '));g.appendChild(document.createTextNode(l.g));dl.appendChild(g);
          dl.appendChild(el('div','lb','Nội dung giảng dạy'));dl.appendChild(ul(l.k));
          if(l.e){dl.appendChild(el('div','lb','Ví dụ mẫu'));var pr=el('pre');pr.appendChild(el('code',null,l.e));dl.appendChild(pr);}
          dl.appendChild(el('div','lb','Bài tập về nhà'));
          l.h.forEach(function(q){var w=el('div','cur-hw');w.appendChild(el('b',null,q[0]));w.appendChild(el('p',null,q[1]));dl.appendChild(w);});
          dc.appendChild(dl);});
        da.appendChild(dc);});
      var fz=el('div','cur-final');fz.appendChild(el('b',null,'Kiểm tra cuối vùng: '));fz.appendChild(document.createTextNode(a.pj.join?a.pj.join(' '):a.pj));da.appendChild(fz);
      s.appendChild(da);});
    d.appendChild(s);}
  s=sec('Ví dụ minh họa');var pre=el('pre');pre.appendChild(el('code',null,codeOf(t.code)));s.appendChild(pre);d.appendChild(s);

  s=sec('Lỗi thường gặp');s.appendChild(ul(t.pit));d.appendChild(s);
  s=sec('Dự án thực hành đề xuất');s.appendChild(ul(t.proj));d.appendChild(s);
  s=sec('Công cụ');s.appendChild(ul(t.tools));d.appendChild(s);
  s=sec('Danh mục tự kiểm tra');s.appendChild(ul(t.check));d.appendChild(s);
  s=sec('Tài liệu tham khảo chính thống');s.appendChild(ul(t.refs));d.appendChild(s);

  d.appendChild(note());
  var nav=el('div','nav2');
  if(i>0){var p=el('a',null,'← '+T[i-1].name);p.href='#'+T[i-1].id;p.setAttribute('data-go',T[i-1].id);nav.appendChild(p);}else nav.appendChild(el('span'));
  if(i<T.length-1){var n=el('a',null,T[i+1].name+' →');n.href='#'+T[i+1].id;n.setAttribute('data-go',T[i+1].id);nav.appendChild(n);}
  d.appendChild(nav);
  return withToc(d,i);
}

function render(){
  var app=document.getElementById('app');app.textContent='';
  var id=cur;
  var idx=T.findIndex(function(t){return t.id===id;});
  if(idx<0){document.title='Document Course – Bộ tài liệu Fullstack Developer';app.appendChild(home());}
  else{document.title=T[idx].name+' – Document Course';app.appendChild(topic(idx));}
  window.scrollTo(0,0);
}
var cur='';
try{cur=location.hash.replace('#','');}catch(e){}
function go(id){cur=id;render();try{history.replaceState(null,'',id?'#'+id:location.pathname+location.search);}catch(e){}}
document.addEventListener('click',function(e){var sc=e.target.closest?e.target.closest('[data-scroll]'):null;if(sc){e.preventDefault();var t=document.getElementById(sc.getAttribute('data-scroll'));if(t)t.scrollIntoView({behavior:'smooth',block:'start'});return;}var a=e.target.closest?e.target.closest('[data-go]'):null;if(!a)return;e.preventDefault();go(a.getAttribute('data-go'));});
window.addEventListener('hashchange',function(){try{cur=location.hash.replace('#','');}catch(e){}render();});
render();
</script>
