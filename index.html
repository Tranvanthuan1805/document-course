o ngữ cảnh.","p":["container-type, @container, đơn vị cqw/cqi","@layer: reset, base, components, utilities","Selector :has(), :is(), :where()","CSS nesting với &","@supports và dự phòng cho trình duyệt cũ"],"x":[["Bài 1 – Cơ bản: Thẻ phản ứng theo vùng chứa","Làm một thẻ sản phẩm đổi từ bố cục dọc sang ngang khi vùng chứa rộng hơn 480 px. Đạt khi: đặt cùng thẻ vào sidebar hẹp và vùng nội dung rộng đều đúng."],["Bài 2 – Nâng cao: Tổ chức bằng layer","Tổ chức lại một tệp CSS 200 dòng thành các layer và bỏ toàn bộ !important. Đạt khi: giao diện giữ nguyên và không còn !important."]]},{"n":"Biến CSS, màu sắc và chuyển động","d":"Tạo hệ thống thiết kế nhất quán, hỗ trợ chế độ sáng tối và chuyển động có trách nhiệm.","p":["Biến CSS (custom properties) và design tokens","oklch(), color-mix(), tương phản AA","prefers-color-scheme và chuyển chế độ sáng tối","transition, animation, transform, will-change dùng có chọn lọc","prefers-reduced-motion và view transitions"],"x":[["Bài 1 – Cơ bản: Chế độ sáng tối","Định nghĩa bộ biến màu và chuyển sáng/tối theo hệ thống, thêm nút đổi thủ công. Đạt khi: cả hai chế độ đều đạt tương phản AA."],["Bài 2 – Nâng cao: Hoạt ảnh có trách nhiệm","Làm hiệu ứng xuất hiện cho danh sách thẻ, tắt hoặc giảm khi người dùng bật giảm chuyển động. Đạt khi: kiểm thử được cả hai trạng thái trong DevTools."]]}],"pit":["Dùng px cố định cho cỡ chữ, bỏ qua cài đặt của người dùng","Lạm dụng !important thay vì dùng @layer","Quên outline/focus cho phần tử tương tác","Dùng :has() nặng trên DOM lớn mà không đo hiệu năng","Giả định mọi tính năng mới đều chạy ở mọi trình duyệt: kiểm tra caniuse và dùng @supports"],"proj":["Hệ thống lưới sản phẩm dùng Grid và container query","Bộ design tokens hỗ trợ chế độ sáng và tối","Trang landing responsive không dùng framework CSS","Thành phần thẻ có hiệu ứng tôn trọng giảm chuyển động"],"tools":["Chrome/Firefox DevTools (Grid, Flexbox inspector)","Stylelint","PostCSS hoặc Lightning CSS","caniuse.com","Utopia hoặc công cụ tạo thang cỡ chữ fluid"],"refs":["MDN Web Docs – CSS (developer.mozilla.org)","web.dev – Learn CSS","Đặc tả CSS (w3.org/Style/CSS)"],"check":["Giải thích được vì sao một quy tắc thắng quy tắc khác","Dựng được layout responsive không dùng thư viện","Dùng được container query và @layer đúng chỗ","Đạt tương phản AA ở cả hai chế độ sáng và tối"],"cur":[{"n":"Cascade, đặc hiệu và mô hình hộp","ch":[{"t":"Chương 1: Cú pháp và cascade","ls":[{"t":"Bài 1.1 – Cú pháp, bộ chọn và cách gắn CSS","m":"60 phút","g":"Viết quy tắc CSS và chọn đúng phần tử.","k":["Ba cách gắn CSS: link, style, inline; vì sao ưu tiên tệp ngoài","Bộ chọn: phần tử, lớp, id, thuộc tính, tổ hợp (con, kề, anh em)","Pseudo-class (:hover, :focus-visible, :nth-child) và pseudo-element (::before, ::after)","Kế thừa và giá trị initial, inherit, unset","Đơn vị: px, rem, em, %, vw, vh, dvh, ch"],"e":":root { font-size: 100%; }\nbody { font-family: system-ui, sans-serif; line-height: 1.6; }\na:hover, a:focus-visible { text-decoration: underline; }\nli:nth-child(odd) { background: #f6f8fb; }","h":[["BT 1.1.1 – Định kiểu bài viết","Cho một trang HTML bài viết, định kiểu chỉ bằng CSS tệp ngoài. Đạt khi: không dùng id để định kiểu, không !important."],["BT 1.1.2 – CSS Diner","Hoàn thành 20 màn đầu của trò chơi CSS Diner. Đạt khi: nộp ảnh chụp màn hình kết quả."]]},{"t":"Bài 1.2 – Cascade, đặc hiệu và thứ tự ưu tiên","m":"75 phút","g":"Dự đoán được quy tắc nào thắng và tránh chiến tranh đặc hiệu.","k":["Thứ tự cascade: nguồn gốc, !important, đặc hiệu, thứ tự xuất hiện","Tính đặc hiệu (a,b,c): id, lớp/thuộc tính/pseudo-class, phần tử",":where() giảm đặc hiệu về 0, :is() lấy đặc hiệu lớn nhất","Quy ước đặt tên: BEM, tiện ích; tránh chọn lồng sâu","Gỡ lỗi bằng tab Styles và Computed trong DevTools"],"e":"/* (0,1,0) */ .btn { color: blue; }\n/* (0,0,1) */ button { color: red; }\n/* :where có đặc hiệu 0 */ :where(.card) a { color: inherit; }","h":[["BT 1.2.1 – Câu đố đặc hiệu","Cho 10 quy tắc xung đột, dự đoán màu cuối. Đạt khi: đúng ≥ 9/10 và ghi cách tính."],["BT 1.2.2 – Gỡ !important","Nhận stylesheet có 8 !important, viết lại không dùng. Đạt khi: giao diện không đổi."]]}]},{"t":"Chương 2: Mô hình hộp và dòng văn bản","ls":[{"t":"Bài 2.1 – Box model, display và dòng chảy","m":"75 phút","g":"Hiểu kích thước, lề, viền, và hiển thị block/inline.","k":["content, padding, border, margin; box-sizing: border-box","Gộp lề (margin collapse) và cách tránh","display: block, inline, inline-block, none; visibility","overflow, position: static/relative/absolute/fixed/sticky, z-index và ngữ cảnh xếp chồng","Kích thước nội tại: min-content, max-content, fit-content"],"e":"*, *::before, *::after { box-sizing: border-box; }\n.card { padding: 1rem; border: 1px solid #ddd; margin-block: 1rem; }\n.sticky { position: sticky; top: 0; }","h":[["BT 2.1.1 – Thanh điều hướng dính","Làm header dính, không che nội dung khi nhảy anchor (scroll-margin-top). Đạt khi: hoạt động trên mobile."],["BT 2.1.2 – Tìm lỗi z-index","Cho 3 trường hợp z-index không có tác dụng, giải thích bằng stacking context. Đạt khi: sửa cả 3."]]},{"t":"Bài 2.2 – Chữ, màu, nền và logical properties","m":"60 phút","g":"Định kiểu typography và dùng thuộc tính logic để hỗ trợ nhiều hướng viết.","k":["font-family, font-size, line-height, font-weight, font-display","Chữ tương thích: clamp() cho typography co giãn","Màu: hex, rgb, hsl, oklch; nền gradient và nhiều lớp nền","Thuộc tính logic: margin-inline, padding-block, inset","text-wrap: balance và pretty; hyphens"],"e":"h1 { font-size: clamp(1.75rem, 1.2rem + 2.5vw, 3rem); text-wrap: balance; }\n.hero { background: linear-gradient(135deg, oklch(0.6 0.2 260), oklch(0.5 0.2 300)); }","h":[["BT 2.2.1 – Thang chữ","Xây thang typography 6 cấp bằng clamp(). Đạt khi: đọc tốt từ 320px đến 1440px."],["BT 2.2.2 – Chủ đề màu","Tạo bảng màu bằng oklch có chế độ sáng/tối. Đạt khi: mọi cặp chữ–nền đạt AA."]]}]}],"pj":["Bài kiểm tra cuối vùng 1: Dựng trang bài viết dài với typography co giãn, header dính, chế độ sáng/tối, không !important và đặc hiệu thấp. Thời lượng: 3 giờ."]},{"n":"Flexbox","ch":[{"t":"Chương 3: Flexbox từ cơ bản đến nâng cao","ls":[{"t":"Bài 3.1 – Trục chính, trục phụ và căn chỉnh","m":"75 phút","g":"Dàn một chiều bằng flexbox.","k":["display: flex; flex-direction; trục chính và trục phụ","justify-content, align-items, align-content, gap","flex-wrap và dòng xuống hàng","order và ảnh hưởng đến truy cập (thứ tự đọc)","Căn giữa tuyệt đối: place-items: center"],"e":".nav { display: flex; gap: 1rem; align-items: center; justify-content: space-between; flex-wrap: wrap; }","h":[["BT 3.1.1 – Thanh điều hướng","Dựng navbar có logo trái, menu giữa, nút phải, tự xuống hàng trên mobile. Đạt khi: không dùng float hay position."],["BT 3.1.2 – Flexbox Froggy","Hoàn thành toàn bộ Flexbox Froggy. Đạt khi: nộp ảnh hoàn thành."]]},{"t":"Bài 3.2 – flex-grow, shrink, basis và mẫu thực tế","m":"75 phút","g":"Kiểm soát co giãn phần tử con.","k":["flex: 1, flex: 0 0 200px; ý nghĩa của grow, shrink, basis","min-width: 0 để chữ dài không tràn","Mẫu: sticky footer, sidebar cố định + nội dung co giãn, thanh công cụ","Card đều chiều cao trong hàng","Khi nào chọn flex và khi nào chọn grid"],"e":".layout { display: flex; min-height: 100dvh; flex-direction: column; }\n.layout > main { flex: 1; }\n.row > .grow { flex: 1 1 0; min-width: 0; }","h":[["BT 3.2.1 – Sticky footer","Dựng trang có footer luôn dưới đáy dù nội dung ngắn. Đạt khi: đúng ở màn hình thấp và cao."],["BT 3.2.2 – Thanh tìm kiếm","Ô tìm kiếm chiếm hết chỗ còn lại cạnh nút. Đạt khi: chữ dài không phá layout."]]}]},{"t":"Chương 4: Thực hành dàn trang với flexbox","ls":[{"t":"Bài 4.1 – Các thành phần giao diện thường gặp","m":"60 phút","g":"Dựng bằng flex: card, form hàng, danh sách tin nhắn.","k":["Card ngang và dọc, avatar + nội dung","Form hàng: nhãn trái, trường phải","Thanh tab, pagination, breadcrumb","Danh sách có phần tử cuối đẩy sang phải bằng margin-left: auto","Khoảng cách nhất quán bằng gap"],"e":"","h":[["BT 4.1.1 – Bộ 5 thành phần","Dựng card, tab, pagination, breadcrumb, form hàng. Đạt khi: dùng chung biến khoảng cách."],["BT 4.1.2 – Chuyển từ float","Viết lại một layout cũ dùng float bằng flexbox. Đạt khi: giao diện giống 100%."]]},{"t":"Bài 4.2 – Gỡ lỗi flexbox","m":"45 phút","g":"Tìm nhanh nguyên nhân lỗi flex phổ biến.","k":["Công cụ Flexbox trong DevTools","Lỗi tràn: thiếu min-width: 0","Lỗi ảnh co dãn: align-items mặc định stretch","Lỗi margin auto và chiều cao","Danh sách lỗi hay gặp và cách kiểm tra"],"e":"","h":[["BT 4.2.1 – 6 lỗi flex","Sửa 6 trang lỗi flex được giao. Đạt khi: ghi nguyên nhân từng lỗi."],["BT 4.2.2 – Viết hướng dẫn","Viết 1 trang A4 \"checklist gỡ lỗi flex\". Đạt khi: đồng đội dùng được."]]}]}],"pj":["Bài kiểm tra cuối vùng 2: Dựng giao diện trang quản trị (header, sidebar thu gọn, thẻ thống kê, bảng, footer) chỉ bằng flexbox. Thời lượng: 4 giờ."]},{"n":"Grid và thiết kế responsive","ch":[{"t":"Chương 5: CSS Grid","ls":[{"t":"Bài 5.1 – Lưới hai chiều: track, area, gap","m":"90 phút","g":"Dàn trang hai chiều bằng grid.","k":["grid-template-columns/rows; đơn vị fr; repeat(), minmax()","auto-fit và auto-fill: lưới responsive không cần media query","grid-template-areas để đặt tên vùng","Đặt phần tử: grid-column, grid-row, span","Căn chỉnh: justify-items, align-items, place-content"],"e":".gallery { display: grid; gap: 1rem; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); }\n.page { display: grid; grid-template-areas: \"h h\" \"s m\" \"f f\"; grid-template-columns: 240px 1fr; }","h":[["BT 5.1.1 – Thư viện ảnh","Dựng lưới ảnh tự điều chỉnh số cột. Đạt khi: không có media query."],["BT 5.1.2 – Grid Garden","Hoàn thành Grid Garden. Đạt khi: nộp ảnh hoàn thành."]]},{"t":"Bài 5.2 – Subgrid, lưới ẩn và mẫu nâng cao","m":"75 phút","g":"Dùng subgrid để căn chỉnh nội dung bên trong card.","k":["subgrid: kế thừa track từ lưới cha","Lưới ẩn (implicit) và grid-auto-flow: dense","Aspect-ratio và object-fit","Masonry: giải pháp hiện tại và hạn chế","Lưới + flex kết hợp"],"e":".cards { display: grid; grid-template-columns: repeat(3, 1fr); }\n.card { display: grid; grid-row: span 3; grid-template-rows: subgrid; }","h":[["BT 5.2.1 – Card căn hàng","Các card có tiêu đề, mô tả, nút căn đều dù độ dài khác nhau. Đạt khi: nút luôn thẳng hàng."],["BT 5.2.2 – Trang tạp chí","Dựng bố cục tạp chí có ô lớn nhỏ xen kẽ. Đạt khi: đọc tốt khi thu nhỏ."]]}]},{"t":"Chương 6: Responsive và mobile-first","ls":[{"t":"Bài 6.1 – Mobile-first, media query và điểm ngắt","m":"75 phút","g":"Thiết kế từ mobile lên desktop.","k":["Viewport meta; mobile-first với min-width","Điểm ngắt theo nội dung, không theo thiết bị","Media features: prefers-color-scheme, prefers-reduced-motion, hover, pointer","Ảnh và video responsive: max-width, picture","Kiểm thử bằng chế độ thiết bị của DevTools và thiết bị thật"],"e":".layout { display: grid; gap: 1rem; }\n@media (min-width: 48rem) { .layout { grid-template-columns: 240px 1fr; } }\n@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }","h":[["BT 6.1.1 – Landing page","Dựng landing page 5 phần responsive từ 320 đến 1920px. Đạt khi: không cuộn ngang ở mọi độ rộng."],["BT 6.1.2 – Bảng responsive","Làm bảng dữ liệu hiển thị tốt trên mobile (cuộn hoặc xếp chồng). Đạt khi: đọc được không phóng to."]]},{"t":"Bài 6.2 – Đơn vị linh hoạt và kiểm tra thực tế","m":"60 phút","g":"Dùng clamp, dvh, ch, và test đa thiết bị.","k":["clamp(), min(), max() cho khoảng cách và chữ","dvh/svh/lvh trên mobile","Vùng chạm tối thiểu 44px; hover không có trên cảm ứng","Zoom 200% và thay đổi cỡ chữ hệ thống","Kiểm thử đa trình duyệt: Chrome, Safari, Firefox"],"e":"","h":[["BT 6.2.1 – Kiểm tra zoom","Phóng to 200% trang đã làm và sửa lỗi vỡ. Đạt khi: không mất nội dung."],["BT 6.2.2 – Báo cáo tương thích","Kiểm tra trên 3 trình duyệt, ghi 5 khác biệt. Đạt khi: có cách khắc phục."]]}]}],"pj":["Bài kiểm tra cuối vùng 3: Dựng trang thương mại điện tử (lưới sản phẩm, bộ lọc, chi tiết sản phẩm) mobile-first, đạt Lighthouse a11y ≥ 95. Thời lượng: 6 giờ."]},{"n":"Container query, @layer, :has() và nesting","ch":[{"t":"Chương 7: Công cụ CSS hiện đại","ls":[{"t":"Bài 7.1 – Container queries và đơn vị container","m":"75 phút","g":"Làm thành phần tự thích ứng theo vùng chứa.","k":["container-type, container-name; @container","Đơn vị cqw, cqi","So sánh với media query: khi nào dùng cái nào","Thiết kế card thích ứng trong sidebar và vùng chính","Giới hạn và hỗ trợ trình duyệt"],"e":".card-wrap { container-type: inline-size; }\n.card { display: grid; }\n@container (min-width: 480px) { .card { grid-template-columns: 160px 1fr; } }","h":[["BT 7.1.1 – Card thích ứng","Một card hiển thị dọc khi hẹp, ngang khi rộng bất kể viewport. Đạt khi: đặt vào 3 vùng khác nhau đều đúng."],["BT 7.1.2 – Widget thời tiết","Widget đổi bố cục theo chiều rộng vùng chứa. Đạt khi: không dùng media query."]]},{"t":"Bài 7.2 – @layer, nesting và :has()","m":"75 phút","g":"Tổ chức CSS bằng layer và viết selector quan hệ.","k":["@layer reset, base, components, utilities: kiểm soát thứ tự ưu tiên","CSS nesting gốc với &",":has() như bộ chọn cha: card có ảnh, form có lỗi","@scope và @property (giới thiệu)","Chiến lược di chuyển từ Sass/BEM"],"e":"@layer reset, base, components, utilities;\n@layer components { .btn { padding: .5rem 1rem; &:hover { filter: brightness(1.1); } } }\n.field:has(input:user-invalid) { border-color: crimson; }","h":[["BT 7.2.1 – Cấu trúc layer","Tổ chức CSS của một dự án vào 4 layer. Đạt khi: utilities luôn thắng mà không cần !important."],["BT 7.2.2 – Form thông minh","Dùng :has() tô viền trường lỗi và hiện thông báo. Đạt khi: không dùng JavaScript."]]}]},{"t":"Chương 8: Kiến trúc CSS cho dự án thật","ls":[{"t":"Bài 8.1 – Quy ước, design token và tái sử dụng","m":"60 phút","g":"Xây hệ thống CSS có thể mở rộng.","k":["Design token bằng biến CSS: màu, khoảng cách, bán kính, bóng","Thang khoảng cách và typography nhất quán","Tiện ích (utility) so với thành phần","Tailwind: khi nào dùng, đánh đổi","Linting: stylelint và định dạng"],"e":"","h":[["BT 8.1.1 – Token","Tạo tệp tokens.css dùng cho 3 trang. Đạt khi: đổi chủ đề chỉ sửa một nơi."],["BT 8.1.2 – Stylelint","Cấu hình stylelint cho dự án. Đạt khi: CI fail khi vi phạm."]]},{"t":"Bài 8.2 – Hiệu năng và gỡ lỗi CSS","m":"60 phút","g":"Viết CSS nhanh, dễ bảo trì.","k":["Critical CSS, giảm CSS không dùng (coverage trong DevTools)","Tránh bố cục thay đổi: CLS, aspect-ratio","content-visibility: auto","Gỡ lỗi: outline tạm thời, tab Layers, Rendering","Compat: @supports và dự phòng lũy tiến"],"e":"","h":[["BT 8.2.1 – Giảm CSS","Dùng Coverage tìm CSS không dùng và cắt giảm. Đạt khi: giảm ≥ 30% dung lượng."],["BT 8.2.2 – Dự phòng","Dùng @supports cho 2 tính năng mới. Đạt khi: trình duyệt cũ vẫn dùng được."]]}]}],"pj":["Bài kiểm tra cuối vùng 4: Tái cấu trúc một CSS 1000 dòng thành layer + nesting + container query, giảm ≥ 30% mã và giữ nguyên giao diện. Thời lượng: 5 giờ."]},{"n":"Biến CSS, màu sắc và chuyển động","ch":[{"t":"Chương 9: Biến, chủ đề và màu","ls":[{"t":"Bài 9.1 – Custom properties và chủ đề sáng/tối","m":"75 phút","g":"Xây hệ chủ đề bằng biến CSS.","k":["--ten: giá trị; var() và giá trị dự phòng","Phạm vi và kế thừa của biến; ghi đè theo ngữ cảnh","Chủ đề sáng/tối: prefers-color-scheme và color-scheme","light-dark() và color-mix()","Lưu lựa chọn người dùng (data-theme + localStorage)"],"e":":root { color-scheme: light dark; --bg: #fff; --fg: #1f2430; --acc: #2563eb; }\n@media (prefers-color-scheme: dark) { :root { --bg: #0e1117; --fg: #e6e8ee; } }\n.btn { background: color-mix(in oklch, var(--acc) 90%, black); }","h":[["BT 9.1.1 – Nút chuyển chủ đề","Làm nút đổi sáng/tối nhớ lựa chọn. Đạt khi: không nhấp nháy khi tải lại."],["BT 9.1.2 – Thương hiệu động","Cho người dùng chọn màu nhấn và áp dụng toàn trang. Đạt khi: mọi cặp màu giữ tương phản AA."]]},{"t":"Bài 9.2 – Hệ màu oklch, gradient và bóng","m":"60 phút","g":"Thiết kế bảng màu nhất quán.","k":["Vì sao oklch: độ sáng cảm nhận đồng đều","Sinh thang màu 50–900 từ một màu gốc","Gradient tuyến tính, tròn, conic; nội suy trong không gian màu","Bóng nhiều lớp, filter, backdrop-filter","Tương phản và màu cho người mù màu"],"e":"","h":[["BT 9.2.1 – Bảng màu","Sinh thang 10 bậc cho 3 màu. Đạt khi: nêu cặp đạt AA."],["BT 9.2.2 – Thẻ kính mờ","Làm card kính mờ có phương án dự phòng. Đạt khi: chữ vẫn đọc được khi backdrop-filter bị tắt."]]}]},{"t":"Chương 10: Chuyển động và tương tác","ls":[{"t":"Bài 10.1 – Transition, animation và hiệu năng","m":"75 phút","g":"Tạo chuyển động mượt, tiết kiệm tài nguyên.","k":["transition: thuộc tính, thời lượng, easing","@keyframes, animation-fill-mode, iteration","Chỉ animate transform và opacity để mượt (compositor)","prefers-reduced-motion: tôn trọng người dùng","will-change: dùng tiết kiệm"],"e":".toast { transition: transform .25s ease, opacity .25s ease; }\n.toast[hidden] { transform: translateY(8px); opacity: 0; display: block; }\n@media (prefers-reduced-motion: reduce) { .toast { transition: none; } }","h":[["BT 10.1.1 – Menu trượt","Làm menu trượt mượt, tắt khi reduced-motion. Đạt khi: 60fps trong Performance."],["BT 10.1.2 – Skeleton loading","Làm khung chờ nhấp nháy. Đạt khi: không gây tăng CLS."]]},{"t":"Bài 10.2 – Chuyển động cuộn, view transitions và đồ án","m":"4 giờ","g":"Dùng tính năng chuyển động mới và hoàn thành đồ án.","k":["Scroll-driven animations: animation-timeline","View Transitions API cho chuyển trang mượt","scroll-snap, scroll-behavior, scroll-margin","Hover/focus đồng bộ, vùng chạm","Đồ án: trang giới thiệu sản phẩm VITEC có chủ đề, chuyển động, responsive"],"e":"","h":[["BT 10.2.1 – Đồ án landing","Hoàn thành trang giới thiệu với chủ đề sáng/tối, chuyển động tinh tế, responsive. Đạt khi: Lighthouse performance ≥ 90 và a11y ≥ 95."],["BT 10.2.2 – Báo cáo","Viết README giải thích lựa chọn token, layer, chuyển động. Đạt khi: người khác chạy và hiểu được."]]}]}],"pj":["Bài kiểm tra cuối vùng 5: Dựng hệ chủ đề + 5 hiệu ứng chuyển động có phương án reduced-motion; đạt kiểm thử tương phản AA tự động. Thời lượng: 4 giờ."]}]},{"id":"jsts","name":"JavaScript + TypeScript","tag":"Event loop, async, ESM, Node.js, tooling","level":"Cơ bản → Nâng cao","time":"10–12 tuần","code":"code-ts","who":"Người định hướng Fullstack: cùng một ngôn ngữ cho giao diện (React/Next.js) và máy chủ (Node.js).","pre":["Nắm HTML và CSS cơ bản","Biết lập trình ở mức biến, hàm, vòng lặp","Cài Node.js bản LTS"],"map":[{"t":"Giai đoạn 1 – JavaScript cốt lõi","w":"Tuần 1–4","g":"Nắm chắc ngôn ngữ: kiểu, phạm vi, hàm, mảng, đối tượng, DOM.","i":["Kiểu dữ liệu, scope, closure, this","Mảng và đối tượng: map, filter, reduce, destructuring","DOM, sự kiện, Fetch API, Web Storage"],"o":"Ứng dụng danh sách công việc tương tác, lưu cục bộ và gọi API công khai."},{"t":"Giai đoạn 2 – Bất đồng bộ và nền tảng","w":"Tuần 5–8","g":"Hiểu event loop và viết mã bất đồng bộ đúng, tổ chức mã bằng module.","i":["Event loop, microtask, macrotask","Promise, async/await, xử lý lỗi, hủy yêu cầu","Module ESM, tổ chức dự án, kiểm thử"],"o":"Ứng dụng dùng nhiều API, có xử lý lỗi, tải và hủy, kèm bộ kiểm thử Vitest."},{"t":"Giai đoạn 3 – TypeScript và Node.js","w":"Tuần 9–12","g":"Viết mã có kiểu chặt chẽ và xây API Node.js hoàn chỉnh.","i":["Hệ thống kiểu: union, generics, utility types, narrowing","Node.js, Express hoặc Fastify, biến môi trường","Kiểm tra dữ liệu bằng schema, kiểm thử, CI"],"o":"Dự án cuối khóa: API REST bằng Node.js + TypeScript có kiểm tra đầu vào, test và tài liệu."}],"areas":[{"n":"Ngôn ngữ cốt lõi: kiểu, phạm vi và closure","d":"Hiểu cách JavaScript thực sự hoạt động để tránh những lỗi 'kỳ lạ' kinh điển.","p":["Kiểu nguyên thủy và đối tượng, truthy/falsy, == và ===","let, const, var, hoisting, phạm vi khối và hàm","Closure và ứng dụng: bộ đếm, đóng gói dữ liệu, hàm tạo sẵn đối số","this, arrow function, bind/call/apply","Prototype và class ở mức hiểu cách hoạt động"],"x":[["Bài 1 – Cơ bản: Bộ đếm bằng closure","Viết createCounter() trả về các hàm tăng, giảm, đặt lại mà biến đếm không truy cập được từ ngoài. Đạt khi: hai bộ đếm độc lập không ảnh hưởng nhau."],["Bài 2 – Nâng cao: Memoize và debounce","Tự cài hàm memoize (bộ nhớ đệm kết quả) và debounce. Đạt khi: có test đo số lần gọi hàm gốc và hành vi thời gian."]]},{"n":"Mảng, đối tượng và lập trình hàm","d":"Xử lý dữ liệu gọn, dễ đọc và ít lỗi bằng các phương thức bậc cao.","p":["map, filter, reduce, find, some, every, flatMap, sort (và ổn định của sort)","Destructuring, spread, rest, optional chaining, nullish coalescing","Bất biến dữ liệu và sao chép nông, sâu (structuredClone)","Map, Set, Object.entries/fromEntries","JSON.parse và JSON.stringify, các bẫy thường gặp"],"x":[["Bài 1 – Cơ bản: Thống kê đơn hàng","Cho mảng 50 đơn hàng, tính tổng theo khách, top 3 khách chi nhiều nhất, đơn trung bình. Đạt khi: chỉ dùng map, filter, reduce, không dùng vòng for."],["Bài 2 – Nâng cao: Chuẩn hóa dữ liệu lồng nhau","Nhận JSON danh mục lồng nhiều cấp, chuyển thành bảng phẳng và ngược lại. Đạt khi: hai chiều chuyển đổi cho kết quả giống dữ liệu gốc."]]},{"n":"Bất đồng bộ và event loop","d":"Chìa khóa để viết ứng dụng không bị đơ và để hiểu vì sao thứ tự chạy đôi khi không như mong đợi.","p":["Call stack, hàng đợi microtask và macrotask","Promise: then, catch, finally, all, allSettled, race, any","async/await và try/catch, chạy tuần tự so với song song","AbortController, timeout và thử lại có chờ lũy tiến","Fetch API: kiểm tra response.ok, tiêu đề, gửi JSON"],"x":[["Bài 1 – Cơ bản: Dự đoán thứ tự log","Cho 6 đoạn mã trộn setTimeout, Promise, async/await. Dự đoán thứ tự in rồi chạy kiểm chứng. Đạt khi: đúng ít nhất 5/6 và giải thích bằng microtask/macrotask."],["Bài 2 – Nâng cao: Bộ tải dữ liệu bền bỉ","Viết fetchWithRetry có timeout, thử lại tối đa 3 lần với thời gian chờ tăng dần, hỗ trợ hủy. Đạt khi: kiểm thử bằng máy chủ giả trả lỗi ngẫu nhiên."]]},{"n":"Hệ thống kiểu TypeScript","d":"Biến lỗi lúc chạy thành lỗi lúc biên dịch và dùng kiểu để mô tả thiết kế.","p":["Bật strict, kiểu cơ bản, type và interface","Union, intersection, literal types, discriminated union","Narrowing: typeof, instanceof, in, kiểm tra tùy chỉnh (type guard)","Generics và ràng buộc, utility types: Partial, Pick, Omit, Record, ReturnType","unknown thay cho any, as const, satisfies"],"x":[["Bài 1 – Cơ bản: Mô hình trạng thái tải","Dùng discriminated union để mô tả trạng thái loading, success, error của một yêu cầu. Đạt khi: trình biên dịch buộc xử lý đủ cả ba trạng thái."],["Bài 2 – Nâng cao: Hàm get an toàn kiểu","Viết hàm get(obj, path) tổng quát trả về đúng kiểu giá trị theo khóa đầu vào. Đạt khi: truy cập khóa không tồn tại báo lỗi biên dịch."]]},{"n":"Node.js, kiểm thử và công cụ","d":"Đưa JavaScript ra khỏi trình duyệt và xây dựng, kiểm thử, giao sản phẩm một cách chuyên nghiệp.","p":["Module, npm hoặc pnpm, package.json và khóa phiên bản","Máy chủ HTTP với Express hoặc Fastify, middleware, xử lý lỗi tập trung","Biến môi trường, cấu hình, ghi log có cấu trúc","Kiểm tra đầu vào bằng Zod hoặc tương đương","Vitest hoặc Jest, ESLint, Prettier, chạy kiểm tra trong CI"],"x":[["Bài 1 – Cơ bản: API quản lý ghi chú","Làm API CRUD ghi chú lưu trong bộ nhớ, trả mã trạng thái HTTP đúng. Đạt khi: kiểm tra đủ 5 endpoint bằng Postman hoặc Bruno."],["Bài 2 – Nâng cao: API có kiểm thử","Thêm kiểm tra đầu vào bằng schema và viết ít nhất 10 test tích hợp. Đạt khi: độ phủ từ 80% và CI chạy xanh."]]}],"pit":["So sánh bằng == gây ép kiểu bất ngờ","Quên await khiến lỗi bị nuốt hoặc chạy sai thứ tự","Dùng any khắp nơi làm TypeScript mất tác dụng","Tin rằng kiểu TypeScript bảo vệ dữ liệu lúc chạy","Đưa bí mật (API key) vào mã phía trình duyệt"],"proj":["Ứng dụng quản lý công việc có lưu trữ cục bộ và gọi API","API REST bằng Node.js + TypeScript có kiểm tra dữ liệu đầu vào và kiểm thử","Thư viện tiện ích nhỏ có kiểu chặt chẽ và phát hành npm (riêng tư)","Công cụ CLI tự động hóa việc lặp lại"],"tools":["Node.js LTS","TypeScript (strict)","Vite","ESLint, Prettier","Vitest hoặc Jest","Zod hoặc Valibot","Postman hoặc Bruno"],"refs":["MDN Web Docs – JavaScript (developer.mozilla.org)","Tài liệu TypeScript (typescriptlang.org/docs)","Tài liệu Node.js (nodejs.org)","javascript.info"],"check":["Giải thích được thứ tự microtask và macrotask","Bật được strict mà không dùng any bừa bãi","Viết được API Node.js có test","Biết kiểm tra dữ liệu từ ngoài vào bằng schema"],"cur":[{"n":"Ngôn ngữ cốt lõi: kiểu, phạm vi và closure","ch":[{"t":"Chương 1: Nhập môn JavaScript hiện đại","ls":[{"t":"Bài 1.1 – Môi trường, biến và kiểu dữ liệu","m":"60 phút","g":"Chạy được JS ở trình duyệt và Node; dùng đúng let/const và hiểu kiểu dữ liệu.","k":["Chạy JS: console trình duyệt, Node.js, module ES (type=\"module\")","let, const, var: phạm vi khối và vùng chết tạm thời (TDZ)","Kiểu nguyên thủy: number, string, boolean, null, undefined, bigint, symbol; kiểu đối tượng","typeof, ép kiểu ngầm và ba dấu bằng ===; truthy/falsy","Template literal, chuỗi nhiều dòng, ký tự Unicode"],"e":"const ten = \"An\";\nlet tuoi = 20;\nconsole.log(typeof ten, typeof tuoi, typeof null, typeof undefined);\nconsole.log(0.1 + 0.2 === 0.3, Number.EPSILON > Math.abs(0.1 + 0.2 - 0.3));\nconsole.log(\"5\" + 1, \"5\" - 1, [] + {}, null ?? \"mặc định\");","h":[["BT 1.1.1 – Câu đố ép kiểu","Dự đoán kết quả 12 biểu thức ép kiểu rồi chạy kiểm chứng. Đạt khi: đúng ≥ 10/12 và giải thích các câu sai."],["BT 1.1.2 – Máy tính tiền","Tính tổng tiền, thuế, làm tròn 2 chữ số, tránh lỗi số thực. Đạt khi: 10 ca thử đúng."]]},{"t":"Bài 1.2 – Hàm, phạm vi và closure","m":"75 phút","g":"Hiểu closure và this, dùng hàm như giá trị.","k":["Khai báo hàm, hàm biểu thức, arrow function; khác biệt về this","Phạm vi từ vựng và chuỗi phạm vi; hoisting","Closure: hàm nhớ môi trường nơi nó được tạo","Tham số mặc định, rest, spread, destructuring","IIFE, module pattern, và vì sao closure rò rỉ bộ nhớ nếu giữ tham chiếu lớn"],"e":"function taoBoDem() {\n  let n = 0;\n  return { tang: () => ++n, hienTai: () => n };\n}\nconst a = taoBoDem();\na.tang(); a.tang();\nconsole.log(a.hienTai()); // 2","h":[["BT 1.2.1 – Bộ nhớ đệm","Viết memoize(fn) dùng closure để lưu kết quả. Đạt khi: gọi lần 2 không chạy lại fn (đếm)."],["BT 1.2.2 – Bẫy vòng lặp","Giải thích vì sao var trong vòng for với setTimeout in cùng một số và sửa bằng 2 cách. Đạt khi: nộp giải thích và code."]]}]},{"t":"Chương 2: Đối tượng, prototype và lớp","ls":[{"t":"Bài 2.1 – Đối tượng, prototype và this","m":"75 phút","g":"Hiểu prototype chain và quy tắc xác định this.","k":["Đối tượng literal, thuộc tính tính toán, shorthand, optional chaining ?.","Prototype chain và Object.create","Bốn quy tắc this: mặc định, ngầm, tường minh (call/apply/bind), new","this trong arrow function","Object.freeze, getter/setter, Object.entries/fromEntries"],"e":"const nguoi = { ten: \"An\", chao() { return \"Xin chào \" + this.ten; } };\nconst f = nguoi.chao;\nconsole.log(nguoi.chao());       // đúng\n// console.log(f());             // this bị mất\nconsole.log(f.call({ ten: \"Bình\" }));","h":[["BT 2.1.1 – Mất this","Tái hiện lỗi mất this trong callback và sửa bằng 3 cách. Đạt khi: giải thích từng cách."],["BT 2.1.2 – Kế thừa prototype","Cài Animal → Dog bằng Object.create, không dùng class. Đạt khi: instanceof trả đúng."]]},{"t":"Bài 2.2 – Class, module ES và xử lý lỗi","m":"75 phút","g":"Dùng class, module và try/catch đúng cách.","k":["class, constructor, extends, super, static, trường private (#)","Module ES: import/export, default so với named; import động","Lỗi: try/catch/finally, Error tùy biến, cause","Truy cập bảo mật: không dùng eval, tránh prototype pollution","Quy ước mã: ESLint, Prettier"],"e":"export class AppError extends Error {\n  constructor(msg, code, options) { super(msg, options); this.code = code; }\n}\nclass Wallet {\n  #balance = 0;\n  nap(x) { if (x <= 0) throw new AppError(\"Số tiền không hợp lệ\", \"BAD_AMOUNT\"); this.#balance += x; }\n  get so_du() { return this.#balance; }\n}","h":[["BT 2.2.1 – Lớp Wallet","Hoàn thiện Wallet có rút tiền, không cho âm, trường private. Đạt khi: truy cập #balance từ ngoài bị lỗi cú pháp."],["BT 2.2.2 – Tách module","Tách ứng dụng todo thành 3 module ES. Đạt khi: chạy được qua máy chủ tĩnh, không biến toàn cục."]]}]}],"pj":["Bài kiểm tra cuối vùng 1: Viết thư viện nhỏ \"mini-lodash\" (debounce, throttle, memoize, groupBy, pick, omit) bằng module ES với 25 ca thử bằng node:test. Thời lượng: 4 giờ."]},{"n":"Mảng, đối tượng và lập trình hàm","ch":[{"t":"Chương 3: Mảng và phương thức bậc cao","ls":[{"t":"Bài 3.1 – map, filter, reduce và phương thức mảng hiện đại","m":"75 phút","g":"Xử lý dữ liệu bằng phong cách khai báo.","k":["map, filter, reduce, find, some, every, flatMap","Phương thức bất biến: toSorted, toReversed, with, toSpliced, at","Sắp xếp với comparator đúng (không dùng sort mặc định cho số)","Map, Set, WeakMap; Object.groupBy","Sao chép nông và sâu: spread, structuredClone"],"e":"const sv = [{ten:\"An\",diem:8},{ten:\"Bình\",diem:6},{ten:\"Chi\",diem:9}];\nconst tb = sv.reduce((s, x) => s + x.diem, 0) / sv.length;\nconst top = sv.filter(x => x.diem >= 8).toSorted((a, b) => b.diem - a.diem).map(x => x.ten);","h":[["BT 3.1.1 – Thống kê đơn hàng","Từ mảng 20 đơn, tính doanh thu theo tháng, top 3 khách, đơn trung bình. Đạt khi: không dùng vòng for."],["BT 3.1.2 – Khử trùng lặp","Viết hàm unique theo khóa bằng Set/Map. Đạt khi: O(n) và giữ thứ tự."]]},{"t":"Bài 3.2 – Lập trình hàm: thuần khiết, bất biến, compose","m":"75 phút","g":"Viết hàm thuần và kết hợp hàm.","k":["Hàm thuần, tác dụng phụ, tính bất biến","Hàm bậc cao, currying, compose/pipe","Đệ quy và giới hạn stack; tail call không đảm bảo","Iterator, generator và vòng lặp lười","Khi nào tránh over-engineering: dễ đọc quan trọng hơn thanh lịch"],"e":"const pipe = (...fs) => x => fs.reduce((v, f) => f(v), x);\nconst slug = pipe(s => s.trim(), s => s.toLowerCase(), s => s.replace(/\\s+/g, \"-\"));\nfunction* so_nguyen_to() { for (let n = 2; ; n++) if (la_nt(n)) yield n; }","h":[["BT 3.2.1 – Pipeline làm sạch dữ liệu","Dựng pipe làm sạch danh sách email (trim, lowercase, lọc hợp lệ, bỏ trùng). Đạt khi: mỗi bước là hàm thuần có kiểm thử."],["BT 3.2.2 – Generator","Viết generator phân trang dữ liệu lớn theo trang. Đạt khi: không tải toàn bộ vào bộ nhớ."]]}]},{"t":"Chương 4: DOM và sự kiện","ls":[{"t":"Bài 4.1 – DOM, sự kiện và ủy quyền sự kiện","m":"75 phút","g":"Thao tác DOM an toàn và hiệu quả.","k":["querySelector, classList, dataset, createElement, textContent so với innerHTML (XSS)","Sự kiện: bubbling, capturing, preventDefault, stopPropagation","Event delegation cho danh sách động","Debounce và throttle cho input và scroll","IntersectionObserver, ResizeObserver, MutationObserver"],"e":"list.addEventListener(\"click\", e => {\n  const btn = e.target.closest(\"[data-del]\");\n  if (!btn) return;\n  btn.closest(\"li\").remove();\n});","h":[["BT 4.1.1 – Todo app","Dựng todo thêm, xóa, đánh dấu, lưu localStorage dùng event delegation. Đạt khi: tải lại trang vẫn còn dữ liệu và không dùng innerHTML với dữ liệu người dùng."],["BT 4.1.2 – Tải lười ảnh","Dùng IntersectionObserver tải ảnh khi cuộn tới. Đạt khi: Network chỉ tải ảnh trong khung nhìn."]]},{"t":"Bài 4.2 – Xây ứng dụng nhỏ không framework","m":"90 phút","g":"Tổ chức ứng dụng DOM thành module có trạng thái rõ.","k":["Mô hình trạng thái → render; tách dữ liệu khỏi giao diện","Pub/sub đơn giản và hàm render thuần","Định tuyến bằng hash hoặc History API","Fetch API, xử lý lỗi, hủy bằng AbortController","So sánh với React: vì sao framework tồn tại"],"e":"","h":[["BT 4.2.1 – Tìm kiếm GitHub","Dựng ô tìm kiếm user GitHub có debounce, hủy request cũ, hiển thị lỗi. Đạt khi: gõ nhanh không gây hiển thị sai thứ tự."],["BT 4.2.2 – Mini router","Cài router hash 3 trang. Đạt khi: nút Back hoạt động đúng."]]}]}],"pj":["Bài kiểm tra cuối vùng 2: Dựng ứng dụng \"Quản lý chi tiêu\" không framework: thêm/sửa/xóa, lọc theo tháng, biểu đồ đơn giản, lưu cục bộ; có 15 ca thử cho logic. Thời lượng: 6 giờ."]},{"n":"Bất đồng bộ và event loop","ch":[{"t":"Chương 5: Event loop và Promise","ls":[{"t":"Bài 5.1 – Call stack, event loop, microtask","m":"75 phút","g":"Dự đoán đúng thứ tự thực thi mã bất đồng bộ.","k":["Call stack, Web API/libuv, hàng đợi macrotask và microtask","Thứ tự: đồng bộ → microtask (Promise) → macrotask (setTimeout)","Vì sao setTimeout 0 không chạy ngay","Chặn event loop: tác vụ CPU nặng làm giao diện đứng","Worker để chuyển tính toán nặng ra luồng khác"],"e":"console.log(1);\nsetTimeout(() => console.log(2), 0);\nPromise.resolve().then(() => console.log(3));\nqueueMicrotask(() => console.log(4));\nconsole.log(5); // 1 5 3 4 2","h":[["BT 5.1.1 – Dự đoán thứ tự","Cho 8 đoạn mã trộn timeout/promise/async, dự đoán thứ tự in. Đạt khi: đúng ≥ 7/8."],["BT 5.1.2 – Chặn UI","Tạo vòng lặp nặng làm trang đứng, sau đó chuyển sang Web Worker. Đạt khi: giao diện mượt sau khi sửa."]]},{"t":"Bài 5.2 – Promise và async/await","m":"90 phút","g":"Dùng Promise và async/await đúng, xử lý lỗi và song song.","k":["Trạng thái Promise: pending, fulfilled, rejected; then/catch/finally","async/await và try/catch","Song song: Promise.all, allSettled, race, any","Lỗi hay gặp: quên await, await tuần tự không cần thiết, unhandled rejection","Retry, timeout và hủy với AbortSignal"],"e":"async function layTatCa(urls, signal) {\n  const kq = await Promise.allSettled(urls.map(u => fetch(u, { signal }).then(r => {\n    if (!r.ok) throw new Error(\"HTTP \" + r.status);\n    return r.json();\n  })));\n  return kq.filter(k => k.status === \"fulfilled\").map(k => k.value);\n}","h":[["BT 5.2.1 – Tải song song","Tải 10 URL song song, giới hạn 3 yêu cầu cùng lúc. Đạt khi: tổng thời gian ≈ 4 lượt, không vượt 3 đồng thời."],["BT 5.2.2 – Retry với backoff","Viết fetchRetry thử lại 3 lần với độ trễ tăng dần. Đạt khi: không retry với lỗi 4xx."]]}]},{"t":"Chương 6: Mẫu bất đồng bộ nâng cao","ls":[{"t":"Bài 6.1 – Stream, đồng thời và hàng đợi","m":"75 phút","g":"Xử lý dữ liệu lớn và kiểm soát đồng thời.","k":["ReadableStream, async iterator (for await)","Xử lý tệp lớn theo dòng trong Node","Hàng đợi tác vụ với giới hạn đồng thời","Debounce bất đồng bộ và hủy yêu cầu cũ","Server-Sent Events và WebSocket (khái niệm)"],"e":"","h":[["BT 6.1.1 – Đọc log lớn","Đếm dòng lỗi trong tệp 500 MB bằng stream. Đạt khi: bộ nhớ dưới 100 MB."],["BT 6.1.2 – Pool tác vụ","Cài runPool(tasks, limit). Đạt khi: kết quả đúng thứ tự và xử lý lỗi từng tác vụ."]]},{"t":"Bài 6.2 – Gỡ lỗi và kiểm thử mã bất đồng bộ","m":"60 phút","g":"Viết kiểm thử ổn định cho mã bất đồng bộ.","k":["Giả lập thời gian: fake timers","Mock fetch và kiểm thử lỗi mạng","Race condition trong UI: yêu cầu cũ về sau yêu cầu mới","Gỡ lỗi bằng async stack trace và Performance tab","Quy tắc: kiểm thử không phụ thuộc thời gian thực"],"e":"","h":[["BT 6.2.1 – Kiểm thử retry","Viết 5 kiểm thử cho fetchRetry bằng fake timers. Đạt khi: chạy < 1 giây."],["BT 6.2.2 – Sửa race","Tái hiện và sửa race trong ô tìm kiếm. Đạt khi: kết quả luôn khớp từ khóa cuối."]]}]}],"pj":["Bài kiểm tra cuối vùng 3: Viết client API có retry, timeout, hủy, giới hạn đồng thời và bộ nhớ đệm; 20 ca thử với fake timers. Thời lượng: 5 giờ."]},{"n":"Hệ thống kiểu TypeScript","ch":[{"t":"Chương 7: TypeScript nền tảng","ls":[{"t":"Bài 7.1 – Cài đặt, kiểu cơ bản và tsconfig","m":"60 phút","g":"Thiết lập TS chặt chẽ và dùng kiểu cơ bản.","k":["Cài tsc/tsx, tsconfig: strict, noUncheckedIndexedAccess, target, module","Kiểu: string, number, boolean, array, tuple, enum (và lựa chọn thay thế), unknown, never","Suy luận kiểu và khi nào cần chú thích","Interface so với type; readonly; optional","any là rác: dùng unknown và thu hẹp kiểu"],"e":"interface User { readonly id: number; name: string; email?: string }\nfunction chao(u: User): string { return \"Xin chào \" + u.name; }\nfunction an_toan(x: unknown): string {\n  if (typeof x === \"string\") return x;\n  throw new TypeError(\"không phải chuỗi\");\n}","h":[["BT 7.1.1 – Chuyển JS sang TS","Chuyển module mini-lodash sang TS với strict. Đạt khi: 0 lỗi, không dùng any."],["BT 7.1.2 – Mô hình dữ liệu","Mô tả kiểu cho đơn hàng VITEC (Order, Item, Customer). Đạt khi: trường tùy chọn được xử lý đúng."]]},{"t":"Bài 7.2 – Union, narrowing và kiểu phân biệt","m":"75 phút","g":"Thiết kế kiểu để trạng thái không hợp lệ không thể biểu diễn.","k":["Union, intersection, literal types","Thu hẹp kiểu: typeof, in, instanceof, kiểu phân biệt (discriminated union)","Kiểm tra vét cạn bằng never","Type guard tự định nghĩa (x is T)","as const và satisfies"],"e":"type Ket<T> = { ok: true; value: T } | { ok: false; error: string };\nfunction xuLy(k: Ket<number>) {\n  if (k.ok) return k.value * 2;\n  return k.error.length;\n}","h":[["BT 7.2.1 – Trạng thái tải","Mô hình Loading | Success | Error bằng discriminated union và hàm render vét cạn. Đạt khi: thêm trạng thái mới thì biên dịch báo lỗi."],["BT 7.2.2 – Parser an toàn","Viết parseUser(unknown): Ket<User>. Đạt khi: kiểm tra đủ trường mà không dùng as."]]}]},{"t":"Chương 8: Kiểu nâng cao","ls":[{"t":"Bài 8.1 – Generics và ràng buộc","m":"75 phút","g":"Viết hàm và kiểu tổng quát an toàn.","k":["Tham số kiểu, ràng buộc extends, mặc định","keyof, indexed access, typeof","Hàm generic với nhiều tham số kiểu","Generic class và interface","Tránh generic dư thừa"],"e":"function pick<T, K extends keyof T>(o: T, ...ks: K[]): Pick<T, K> {\n  const r = {} as Pick<T, K>;\n  for (const k of ks) r[k] = o[k];\n  return r;\n}","h":[["BT 8.1.1 – groupBy kiểu chặt","Viết groupBy<T, K extends PropertyKey>. Đạt khi: kiểu trả về suy luận đúng."],["BT 8.1.2 – Kho dữ liệu","Cài Repository<T extends {id:number}>. Đạt khi: tìm theo id trả T | undefined."]]},{"t":"Bài 8.2 – Utility types, mapped, conditional và Zod","m":"90 phút","g":"Biến đổi kiểu và kiểm tra dữ liệu thời chạy.","k":["Partial, Required, Pick, Omit, Record, ReturnType, Awaited","Mapped types và template literal types","Conditional types và infer","Kiểm tra dữ liệu thời chạy bằng Zod; suy ra kiểu từ schema","Declaration files, @types, kiểu cho thư viện JS"],"e":"import { z } from \"zod\";\nconst User = z.object({ id: z.number(), email: z.string().email() });\ntype User = z.infer<typeof User>;\nconst u = User.parse(JSON.parse(raw)); // ném lỗi nếu sai","h":[["BT 8.2.1 – DeepReadonly","Cài DeepReadonly<T> bằng mapped type đệ quy. Đạt khi: gán vào thuộc tính lồng nhau báo lỗi."],["BT 8.2.2 – Kiểm tra API","Dùng Zod kiểm tra phản hồi API và suy ra kiểu. Đạt khi: dữ liệu sai bị chặn tại biên hệ thống."]]}]}],"pj":["Bài kiểm tra cuối vùng 4: Xây thư viện \"typed-store\" (kho trạng thái) với kiểu chặt, discriminated union cho hành động, kiểm thử kiểu bằng tsd/expectTypeOf. Thời lượng: 5 giờ."]},{"n":"Node.js, kiểm thử và công cụ","ch":[{"t":"Chương 9: Node.js và hệ sinh thái","ls":[{"t":"Bài 9.1 – Node.js, npm và HTTP server","m":"75 phút","g":"Xây server HTTP cơ bản và quản lý gói.","k":["Node: module ESM/CJS, fs/promises, path, process, biến môi trường","npm/pnpm: package.json, lockfile, scripts, semver","http và Express/Fastify: route, middleware, xử lý lỗi","Cấu hình bằng .env, không commit bí mật","An toàn cơ bản: kiểm tra đầu vào, helmet, giới hạn tốc độ"],"e":"import { createServer } from \"node:http\";\ncreateServer((req, res) => {\n  if (req.url === \"/health\") { res.writeHead(200, {\"content-type\":\"application/json\"}); res.end('{\"ok\":true}'); return; }\n  res.writeHead(404).end();\n}).listen(process.env.PORT ?? 3000);","h":[["BT 9.1.1 – API tin ghi chú","Dựng REST API CRUD ghi chú bằng Fastify/Express với kiểm tra Zod. Đạt khi: trả mã trạng thái đúng cho mọi trường hợp lỗi."],["BT 9.1.2 – Kiểm toán gói","Chạy npm audit và ghi 3 cách xử lý lỗ hổng. Đạt khi: nêu rõ rủi ro còn lại."]]},{"t":"Bài 9.2 – Kết nối cơ sở dữ liệu và xác thực","m":"90 phút","g":"Tích hợp DB và xác thực cơ bản an toàn.","k":["Prisma/Drizzle với PostgreSQL: schema, migration, truy vấn","Băm mật khẩu (argon2/bcrypt), JWT hoặc session cookie HttpOnly","Phân quyền theo vai trò","Xử lý giao dịch và lỗi ràng buộc","Logging có cấu trúc (pino) và id yêu cầu"],"e":"","h":[["BT 9.2.1 – Đăng ký/đăng nhập","Dựng đăng ký, đăng nhập, route cần xác thực. Đạt khi: mật khẩu không bao giờ lưu rõ và cookie HttpOnly."],["BT 9.2.2 – Phân quyền","Thêm vai trò admin/user cho 3 route. Đạt khi: user thường gọi route admin nhận 403."]]}]},{"t":"Chương 10: Kiểm thử, công cụ và đồ án","ls":[{"t":"Bài 10.1 – Kiểm thử với Vitest/Jest và Playwright","m":"75 phút","g":"Viết kiểm thử đơn vị, tích hợp và đầu-cuối.","k":["Kim tự tháp kiểm thử; AAA (Arrange, Act, Assert)","Vitest: test, expect, mock, snapshot (dùng tiết kiệm)","Kiểm thử API với supertest","Kiểm thử đầu-cuối với Playwright","Độ phủ: dùng như chỉ dẫn, không như mục tiêu"],"e":"import { test, expect } from \"vitest\";\ntest(\"slug hóa chuỗi\", () => {\n  expect(slug(\"  Xin Chào  \")).toBe(\"xin-chao\");\n});","h":[["BT 10.1.1 – Bộ kiểm thử API","Viết 20 kiểm thử cho API ghi chú gồm cả đường lỗi. Đạt khi: độ phủ nhánh ≥ 80% cho logic nghiệp vụ."],["BT 10.1.2 – E2E","Viết 3 kịch bản Playwright cho luồng đăng nhập. Đạt khi: chạy ổn định 10 lần liên tiếp."]]},{"t":"Bài 10.2 – Công cụ, CI/CD và đồ án","m":"4 giờ","g":"Hoàn thiện dự án với chuỗi công cụ chuyên nghiệp.","k":["ESLint, Prettier, husky + lint-staged","GitHub Actions: lint, type-check, test, build","Docker hóa ứng dụng Node","Triển khai: biến môi trường, health check, log","Đồ án: API + giao diện nhỏ, có CI, tài liệu"],"e":"","h":[["BT 10.2.1 – Đồ án fullstack nhỏ","Hoàn thành ứng dụng (Node + TS + DB + giao diện đơn giản) có CI chạy lint, type-check, test. Đạt khi: pipeline xanh và có README."],["BT 10.2.2 – Triển khai","Triển khai lên một dịch vụ (Render/Fly/VPS) với biến môi trường. Đạt khi: người khác truy cập được /health."]]}]}],"pj":["Bài kiểm tra cuối vùng 5: Nhận một repo Node/TS có 8 vấn đề cố ý (lỗi kiểu, lỗ hổng, kiểm thử thiếu, CI hỏng) và sửa hết trong 4 giờ với nhật ký. Thời lượng: 4 giờ."]}]},{"id":"java","name":"Java","tag":"OOP, Collections, Stream, concurrency, Spring Boot","level":"Cơ bản → Nâng cao","time":"12–14 tuần","code":"code-java","who":"Người hướng tới backend doanh nghiệp, hệ thống thương mại điện tử, đồng thời phù hợp phỏng vấn thực tập tại các công ty phần mềm lớn.","pre":["Biết logic lập trình cơ bản","Cài JDK 21 LTS, IntelliJ IDEA hoặc Eclipse","Cơ bản về SQL sẽ giúp ích khi học JPA"],"map":[{"t":"Giai đoạn 1 – Ngôn ngữ và hướng đối tượng","w":"Tuần 1–4","g":"Thiết kế được các lớp theo nguyên tắc OOP và xử lý lỗi đúng cách.","i":["Cú pháp, kiểu dữ liệu, String, mảng","Lớp, đóng gói, kế thừa, đa hình, interface, record, enum","Ngoại lệ, try-with-resources, nguyên tắc SOLID"],"o":"Ứng dụng console quản lý thư viện hoặc kho hàng theo thiết kế hướng đối tượng, có JUnit."},{"t":"Giai đoạn 2 – Thư viện chuẩn và đồng thời","w":"Tuần 5–8","g":"Dùng thành thạo Collections, Stream và viết mã đồng thời an toàn.","i":["List, Set, Map, Queue, equals/hashCode, Comparator","Generics, lambda, Stream API, Optional","ExecutorService, CompletableFuture, virtual threads"],"o":"Chương trình xử lý tệp log lớn bằng Stream và đa luồng, có kiểm thử hiệu năng đơn giản."},{"t":"Giai đoạn 3 – Spring Boot và sản phẩm thật","w":"Tuần 9–14","g":"Xây dịch vụ REST hoàn chỉnh có cơ sở dữ liệu, bảo mật và kiểm thử.","i":["Spring Boot, REST, validation, xử lý lỗi toàn cục","Spring Data JPA, giao dịch, migration","Spring Security (JWT), kiểm thử, Docker"],"o":"Dự án cuối khóa: API quản lý sản phẩm và đơn hàng có JWT, phân trang, kiểm thử và Dockerfile."}],"areas":[{"n":"Lập trình hướng đối tượng và SOLID","d":"Cách tổ chức mã để dễ mở rộng, dễ kiểm thử, dễ đọc, nền tảng cho mọi framework Java.","p":["Lớp, đối tượng, constructor, static, final","Đóng gói, kế thừa, đa hình, trừu tượng (abstract class và interface)","record, enum có phương thức, sealed class","Composition ưu tiên hơn kế thừa, lập trình theo interface","SOLID: đơn nhiệm, đóng-mở, thay thế Liskov, tách interface, đảo ngược phụ thuộc"],"x":[["Bài 1 – Cơ bản: Hệ thống hình học","Thiết kế Shape, Circle, Rectangle, Triangle với diện tích và chu vi, tính tổng diện tích danh sách. Đạt khi: thêm hình mới không phải sửa mã hiện có."],["Bài 2 – Nâng cao: Giảm giá theo chiến lược","Thiết kế hệ thống tính giá đơn hàng với nhiều quy tắc giảm giá có thể kết hợp (chiến lược). Đạt khi: thêm quy tắc mới chỉ cần thêm một lớp và có test."]]},{"n":"Collections, Generics và Stream","d":"Chọn đúng cấu trúc dữ liệu và biến đổi dữ liệu gọn gàng.","p":["ArrayList, LinkedList, HashMap, TreeMap, HashSet, ArrayDeque và độ phức tạp thao tác","Hợp đồng equals/hashCode và ảnh hưởng đến HashMap","Comparable, Comparator, sắp xếp nhiều khóa","Generics: kiểu tổng quát, wildcard, giới hạn kiểu","Stream: filter, map, collect, groupingBy, reduce; Optional dùng đúng cách"],"x":[["Bài 1 – Cơ bản: Thống kê học viên","Từ danh sách học viên, tính điểm trung bình theo lớp, top 5 và danh sách trùng email bằng Stream. Đạt khi: kết quả khớp với bản dùng vòng for."],["Bài 2 – Nâng cao: Bộ nhớ đệm LRU","Cài bộ nhớ đệm LRU có kích thước tối đa bằng LinkedHashMap hoặc tự cài. Đạt khi: truy xuất O(1) và test đúng thứ tự loại bỏ."]]},{"n":"Ngoại lệ, I/O và đồng thời","d":"Xử lý lỗi, làm việc với tệp và chạy nhiều tác vụ cùng lúc mà không hỏng dữ liệu.","p":["Checked và unchecked exception, ngoại lệ tùy chỉnh, không nuốt lỗi","try-with-resources, NIO.2 (Path, Files)","Thread, ExecutorService, CompletableFuture","synchronized, Lock, concurrent collections, atomic","Virtual threads (Java 21) và khi nào nên dùng"],"x":[["Bài 1 – Cơ bản: Đọc tệp an toàn","Đọc tệp CSV lớn, bỏ qua dòng lỗi và ghi báo cáo lỗi ra tệp riêng. Đạt khi: tệp lỗi liệt kê đúng số dòng và lý do."],["Bài 2 – Nâng cao: Tải song song","Tải nội dung từ 20 địa chỉ giả lập bằng CompletableFuture, gộp kết quả, có timeout. Đạt khi: tổng thời gian gần bằng tác vụ chậm nhất, không phải tổng cộng."]]},{"n":"Spring Boot và REST API","d":"Xây dịch vụ web theo kiến trúc phân tầng chuẩn công nghiệp.","p":["IoC, DI, constructor injection, cấu hình và profile","Controller, @RestController, @RequestMapping, DTO và record","Bean Validation và @ControllerAdvice xử lý lỗi toàn cục","Phân trang, sắp xếp, lọc; thiết kế URL và mã trạng thái HTTP","OpenAPI/Swagger và Actuator"],"x":[["Bài 1 – Cơ bản: CRUD sản phẩm","Làm API CRUD sản phẩm với validation, trả 400 khi dữ liệu sai và 404 khi không có. Đạt khi: có bộ yêu cầu mẫu chạy đủ mọi trường hợp."],["Bài 2 – Nâng cao: Tìm kiếm có lọc","Thêm endpoint tìm kiếm theo từ khóa, danh mục, khoảng giá, phân trang và sắp xếp. Đạt khi: không có N+1 query (kiểm tra log SQL)."]]},{"n":"JPA, kiểm thử và bảo mật cơ bản","d":"Lưu trữ dữ liệu đúng cách, bảo vệ API và chứng minh mã chạy đúng bằng kiểm thử.","p":["Entity, quan hệ, lazy/eager, N+1 và cách khắc phục (fetch join, entity graph)","Giao dịch @Transactional, migration bằng Flyway hoặc Liquibase","JUnit 5, Mockito, Testcontainers","Spring Security: đăng nhập, JWT, phân quyền theo vai trò","Băm mật khẩu bằng BCrypt, cấu hình CORS, không ghi log dữ liệu nhạy cảm"],"x":[["Bài 1 – Cơ bản: Kiểm thử service","Viết test đơn vị cho tầng service bằng Mockito, phủ trường hợp thành công và lỗi. Đạt khi: độ phủ tầng service từ 80%."],["Bài 2 – Nâng cao: Đăng nhập JWT","Thêm đăng ký, đăng nhập, JWT, vai trò ADMIN và USER cho API. Đạt khi: USER gọi endpoint của ADMIN nhận 403 và có test chứng minh."]]}],"pit":["Trả entity JPA trực tiếp ra API (lộ dữ liệu, lỗi lazy loading)","Quên override equals/hashCode cho khóa của Map","Bắt Exception chung chung rồi bỏ qua","@Transactional đặt sai chỗ hoặc gọi nội bộ trong cùng bean nên không có tác dụng","Để Hibernate ddl-auto=update trên môi trường production"],"proj":["REST API quản lý sản phẩm, đơn hàng có JWT, phân trang, kiểm thử","Hệ thống giỏ hàng với giao dịch và kiểm soát tồn kho","Ứng dụng console cài đặt cấu trúc dữ liệu và thuật toán","Dịch vụ tích hợp cổng thanh toán ở chế độ sandbox"],"tools":["JDK 21 LTS","IntelliJ IDEA hoặc Eclipse","Maven hoặc Gradle","Spring Boot","JUnit 5, Mockito, Testcontainers","PostgreSQL, Docker","Postman"],"refs":["Tài liệu Java SE (docs.oracle.com và dev.java)","Hướng dẫn Spring (spring.io/guides)","Tài liệu Spring Boot và Spring Data (docs.spring.io)","Sách 'Effective Java' (Joshua Bloch)"],"check":["Giải thích được equals/hashCode và ảnh hưởng tới HashMap","Viết được REST API có validation, xử lý lỗi, test","Phát hiện và sửa được N+1 query","Hiểu khi nào dùng virtual threads"],"cur":[{"n":"Lập trình hướng đối tượng và SOLID","ch":[{"t":"Chương 1: Nền tảng Java","ls":[{"t":"Bài 1.1 – JDK, cú pháp và công cụ build","m":"60 phút","g":"Cài JDK 21, chạy chương trình, dùng Maven/Gradle cơ bản.","k":["JDK, JRE, JVM; biên dịch javac và chạy java; bytecode","Kiểu nguyên thủy, String bất biến, var, text block","Điều khiển luồng, switch expression, pattern matching","Maven: pom.xml, vòng đời, dependency, lệnh mvn test","IDE: IntelliJ/Eclipse, debug, refactor"],"e":"public class Main {\n    public static void main(String[] args) {\n        var ten = \"An\";\n        String msg = switch (ten.length()) { case 2 -> \"ngắn\"; default -> \"dài\"; };\n        System.out.println(\"Xin chào \" + ten + \" – \" + msg);\n    }\n}","h":[["BT 1.1.1 – Máy tính dòng lệnh","Viết chương trình nhập hai số và phép toán, in kết quả, xử lý chia 0. Đạt khi: build bằng Maven và có 8 ca thử JUnit."],["BT 1.1.2 – Bộ nhớ Java","Giải thích stack, heap, GC và minh họa bằng sơ đồ cho 1 chương trình. Đạt khi: xác định đúng nơi lưu từng biến."]]},{"t":"Bài 1.2 – Lớp, đối tượng, encapsulation","m":"75 phút","g":"Thiết kế lớp bất biến và có invariant.","k":["Lớp, constructor, this, static, final","Encapsulation: private, getter, bất biến (immutability)","equals, hashCode, toString đúng hợp đồng","record, enum và sealed class","Package, access modifier"],"e":"public record Money(long amount, String currency) {\n    public Money {\n        if (amount < 0) throw new IllegalArgumentException(\"amount < 0\");\n        currency = java.util.Objects.requireNonNull(currency);\n    }\n    public Money plus(Money o) { return new Money(amount + o.amount, currency); }\n}","h":[["BT 1.2.1 – Lớp Money","Cài Money bất biến, kiểm tra cùng đơn vị khi cộng. Đạt khi: kiểm thử equals/hashCode đạt."],["BT 1.2.2 – Mô hình đơn hàng","Cài Order, OrderLine với invariant tổng tiền. Đạt khi: không thể tạo đơn âm."]]}]},{"t":"Chương 2: OOP và nguyên lý thiết kế","ls":[{"t":"Bài 2.1 – Kế thừa, đa hình, interface","m":"75 phút","g":"Dùng đa hình đúng; ưu tiên composition.","k":["extends, override, abstract class, interface, default method","Đa hình và dispatch động","Composition thay vì kế thừa; nguyên lý Liskov","Sealed interface + pattern matching switch","Nguyên tắc đặt tên và gói"],"e":"sealed interface Shape permits Circle, Rect {}\nrecord Circle(double r) implements Shape {}\nrecord Rect(double w, double h) implements Shape {}\nstatic double area(Shape s) {\n    return switch (s) { case Circle c -> Math.PI * c.r() * c.r(); case Rect r -> r.w() * r.h(); };\n}","h":[["BT 2.1.1 – Hệ thống thanh toán","Cài PaymentMethod với Card, Momo, Cash qua interface. Đạt khi: thêm phương thức mới không sửa mã cũ."],["BT 2.1.2 – Thay kế thừa","Viết lại một cây kế thừa 3 tầng bằng composition. Đạt khi: nêu lợi ích cụ thể."]]},{"t":"Bài 2.2 – SOLID và mẫu thiết kế thường dùng","m":"90 phút","g":"Áp dụng SOLID và 5 mẫu thiết kế phổ biến.","k":["S, O, L, I, D: định nghĩa và ví dụ vi phạm","Dependency Injection thủ công","Strategy, Factory, Builder, Observer, Decorator","Mã xấu thường gặp (code smell) và refactor","Clean Code: hàm nhỏ, tên có ý nghĩa, ít tham số"],"e":"interface PricingStrategy { long price(long base); }\nclass Vip implements PricingStrategy { public long price(long b) { return b * 90 / 100; } }\nclass Checkout {\n    private final PricingStrategy s;\n    Checkout(PricingStrategy s) { this.s = s; }\n    long total(long base) { return s.price(base); }\n}","h":[["BT 2.2.1 – Refactor theo SOLID","Cho lớp OrderService 300 dòng làm mọi việc, tách theo SOLID. Đạt khi: mỗi lớp một trách nhiệm và kiểm thử cũ vẫn xanh."],["BT 2.2.2 – Mẫu thiết kế","Cài 3 mẫu cho bài toán giảm giá. Đạt khi: mỗi mẫu có sơ đồ UML ngắn."]]}]}],"pj":["Bài kiểm tra cuối vùng 1: Mô hình hóa hệ thống \"Quản lý thư viện\" (sách, thành viên, mượn trả) theo SOLID, 30 ca thử JUnit, không dùng static trạng thái. Thời lượng: 5 giờ."]},{"n":"Collections, Generics và Stream","ch":[{"t":"Chương 3: Collections và Generics","ls":[{"t":"Bài 3.1 – List, Set, Map và độ phức tạp","m":"75 phút","g":"Chọn đúng cấu trúc dữ liệu của Java.","k":["ArrayList, LinkedList, ArrayDeque; HashMap, LinkedHashMap, TreeMap; HashSet, TreeSet","Hợp đồng equals/hashCode và hậu quả khi sai","Comparable và Comparator","Danh sách bất biến: List.of, Collections.unmodifiable","ConcurrentHashMap và khi nào cần"],"e":"Map<String, Integer> dem = new HashMap<>();\nfor (String w : words) dem.merge(w, 1, Integer::sum);\nList<Map.Entry<String,Integer>> top = dem.entrySet().stream()\n    .sorted(Map.Entry.<String,Integer>comparingByValue().reversed()).limit(10).toList();","h":[["BT 3.1.1 – Đếm từ","Đếm tần suất từ trong tệp 10 MB, in top 10. Đạt khi: chạy dưới 1 giây."],["BT 3.1.2 – equals/hashCode","Cố ý cài sai hashCode và quan sát lỗi trong HashSet. Đạt khi: giải thích và sửa."]]},{"t":"Bài 3.2 – Generics: kiểu tham số, wildcard","m":"75 phút","g":"Viết lớp và phương thức generic an toàn.","k":["Lớp, interface, phương thức generic; bounded type","Type erasure và hệ quả","Wildcard ? extends / ? super; quy tắc PECS","Không tạo mảng generic; raw type là điều cấm","Generic với record và sealed"],"e":"static <T extends Comparable<T>> T max(Collection<? extends T> c) {\n    Iterator<? extends T> it = c.iterator();\n    T best = it.next();\n    while (it.hasNext()) { T x = it.next(); if (x.compareTo(best) > 0) best = x; }\n    return best;\n}","h":[["BT 3.2.1 – Cache generic","Cài Cache<K,V> có giới hạn dung lượng LRU. Đạt khi: 10 ca thử với loại bỏ đúng phần tử."],["BT 3.2.2 – PECS","Viết copy(List<? super T> dst, List<? extends T> src). Đạt khi: biên dịch với nhiều kiểu khác nhau."]]}]},{"t":"Chương 4: Stream API và Optional","ls":[{"t":"Bài 4.1 – Stream: biến đổi, lọc, gom nhóm","m":"90 phút","g":"Xử lý dữ liệu bằng Stream rõ ràng, dễ đọc.","k":["filter, map, flatMap, sorted, distinct, limit; toList","Collectors: groupingBy, partitioningBy, joining, toMap, summarizingInt","Stream lười và thao tác cuối; không tái sử dụng","Stream nguyên thủy: IntStream, LongStream","Khi nào dùng vòng for thay Stream"],"e":"Map<String, Double> tbTheoLop = students.stream()\n    .collect(Collectors.groupingBy(Student::lop, Collectors.averagingDouble(Student::diem)));","h":[["BT 4.1.1 – Thống kê bán hàng","Từ 1000 đơn, tính doanh thu theo tháng, top 5 sản phẩm, khách mua nhiều nhất. Đạt khi: mỗi câu là một pipeline ≤ 6 dòng."],["BT 4.1.2 – Stream hay for","Viết 3 bài toán bằng cả hai cách và so sánh. Đạt khi: nêu tiêu chí chọn."]]},{"t":"Bài 4.2 – Optional, hàm bậc cao và xử lý null","m":"60 phút","g":"Hạn chế null và viết API rõ ràng.","k":["Optional: of, ofNullable, map, flatMap, orElseThrow; không dùng cho trường","Functional interface: Function, Predicate, Supplier, Consumer","Method reference","Quy ước trả về: Optional, rỗng thay vì null cho collection","@Nullable và công cụ phân tích"],"e":"Optional<User> u = repo.findById(id);\nString ten = u.map(User::name).orElseThrow(() -> new NotFoundException(\"user \" + id));","h":[["BT 4.2.1 – Tra cứu an toàn","Viết chuỗi tra cứu địa chỉ → thành phố → mã bưu điện bằng Optional. Đạt khi: không còn kiểm tra null thủ công."],["BT 4.2.2 – Validator","Dựng bộ kiểm tra từ Predicate ghép được. Đạt khi: 10 ca thử."]]}]}],"pj":["Bài kiểm tra cuối vùng 2: Dựng chương trình phân tích tệp CSV 100.000 dòng bằng Collections + Stream, 15 báo cáo khác nhau, kiểm thử bằng JUnit. Thời lượng: 5 giờ."]},{"n":"Ngoại lệ, I/O và đồng thời","ch":[{"t":"Chương 5: Ngoại lệ và I/O","ls":[{"t":"Bài 5.1 – Ngoại lệ và logging","m":"60 phút","g":"Thiết kế xử lý lỗi nhất quán.","k":["Checked, unchecked, Error; khi nào dùng loại nào","try-with-resources và AutoCloseable","Ngoại lệ tùy biến có ngữ cảnh; không nuốt ngoại lệ","Logging: SLF4J + Logback, mức log, log có cấu trúc","Không log dữ liệu nhạy cảm"],"e":"try (var in = Files.newBufferedReader(Path.of(\"a.txt\"))) {\n    String line;\n    while ((line = in.readLine()) != null) process(line);\n} catch (IOException e) {\n    log.error(\"Không đọc được tệp\", e);\n    throw new UncheckedIOException(e);\n}","h":[["BT 5.1.1 – Phân loại lỗi","Với 8 tình huống, chọn loại ngoại lệ và giải thích. Đạt khi: nhất quán với nguyên tắc nêu trong bài."],["BT 5.1.2 – Ngoại lệ miền","Cài hệ ngoại lệ cho đơn hàng và bộ xử lý lỗi tập trung. Đạt khi: không có catch rỗng."]]},{"t":"Bài 5.2 – Tệp, NIO.2, JSON và HTTP client","m":"75 phút","g":"Đọc ghi tệp, JSON và gọi API.","k":["java.nio.file: Path, Files, walk, watch","Jackson: serialize/deserialize, record, @JsonProperty","java.net.http.HttpClient đồng bộ và bất đồng bộ","Charset UTF-8 tường minh","Xử lý tệp lớn bằng stream"],"e":"HttpClient c = HttpClient.newHttpClient();\nHttpResponse<String> r = c.send(HttpRequest.newBuilder(URI.create(\"https://api.example.com/x\")).build(),\n    HttpResponse.BodyHandlers.ofString());\nData d = new ObjectMapper().readValue(r.body(), Data.class);","h":[["BT 5.2.1 – Sao lưu thư mục","Duyệt thư mục, tính SHA-256, ghi manifest JSON. Đạt khi: phát hiện tệp thay đổi giữa hai lần chạy."],["BT 5.2.2 – Client API thời tiết","Gọi API công khai, phân tích JSON, xử lý timeout. Đạt khi: lỗi mạng cho thông báo rõ."]]}]},{"t":"Chương 6: Đồng thời","ls":[{"t":"Bài 6.1 – Thread, ExecutorService và đồng bộ hóa","m":"90 phút","g":"Chạy tác vụ song song đúng và an toàn.","k":["Thread, Runnable; vì sao dùng ExecutorService","synchronized, volatile, mô hình bộ nhớ Java (happens-before)","Lock, ReentrantLock, ReadWriteLock; Atomic*","Deadlock và cách tránh (thứ tự khóa)","Công cụ: jstack, VisualVM, jcstress (giới thiệu)"],"e":"try (var ex = Executors.newFixedThreadPool(4)) {\n    var fs = urls.stream().map(u -> ex.submit(() -> fetch(u))).toList();\n    for (var f : fs) results.add(f.get());\n}","h":[["BT 6.1.1 – Race condition","Tái hiện race trên bộ đếm, sửa bằng 3 cách (synchronized, Atomic, Lock). Đạt khi: so sánh hiệu năng."],["BT 6.1.2 – Producer–Consumer","Cài bằng BlockingQueue. Đạt khi: không mất phần tử, tắt êm."]]},{"t":"Bài 6.2 – CompletableFuture và Virtual Threads","m":"75 phút","g":"Dùng bất đồng bộ hiện đại và luồng ảo.","k":["CompletableFuture: thenApply, thenCompose, allOf, xử lý lỗi","Virtual threads (Java 21): khi nào có lợi, khi nào không","Structured concurrency (giới thiệu)","Thread-safety của collection","Quyết định: luồng nền, bất đồng bộ, hay đơn giản là đồng bộ"],"e":"try (var ex = Executors.newVirtualThreadPerTaskExecutor()) {\n    var f1 = ex.submit(() -> callServiceA());\n    var f2 = ex.submit(() -> callServiceB());\n    return combine(f1.get(), f2.get());\n}","h":[["BT 6.2.1 – Gọi song song","Gọi 3 dịch vụ giả lập song song, gộp kết quả, xử lý một dịch vụ lỗi. Đạt khi: tổng thời gian ≈ dịch vụ chậm nhất."],["BT 6.2.2 – So sánh luồng","Chạy 10.000 tác vụ I/O bằng luồng nền và luồng ảo. Đạt khi: nộp số đo và kết luận."]]}]}],"pj":["Bài kiểm tra cuối vùng 3: Dựng trình thu thập dữ liệu (crawler) đa luồng gọi 100 URL giả lập, có timeout, retry, giới hạn đồng thời; kiểm thử không phụ thuộc mạng. Thời lượng: 5 giờ."]},{"n":"Spring Boot và REST API","ch":[{"t":"Chương 7: Spring Boot nền tảng","ls":[{"t":"Bài 7.1 – IoC, DI và cấu trúc dự án","m":"75 phút","g":"Hiểu container Spring và tổ chức mã theo tầng.","k":["Spring Initializr; cấu trúc controller/service/repository","Bean, @Component, @Service, @Configuration, constructor injection","Cấu hình: application.yml, profile, @ConfigurationProperties","Vòng đời bean; AOP ở mức khái niệm","Actuator: health, metrics"],"e":"@Service\npublic class OrderService {\n    private final OrderRepository repo;\n    public OrderService(OrderRepository repo) { this.repo = repo; }\n    public Order get(long id) { return repo.findById(id).orElseThrow(() -> new NotFoundException(\"order \" + id)); }\n}","h":[["BT 7.1.1 – Khởi tạo dự án","Dựng dự án với 3 tầng và profile dev/prod. Đạt khi: đổi cấu hình bằng biến môi trường."],["BT 7.1.2 – Sơ đồ bean","Vẽ sơ đồ phụ thuộc của dự án. Đạt khi: không có phụ thuộc vòng."]]},{"t":"Bài 7.2 – REST controller, DTO và validation","m":"90 phút","g":"Xây REST API chuẩn.","k":["@RestController, @GetMapping, @PostMapping, @PathVariable, @RequestBody","DTO (record) tách khỏi entity; mapper (MapStruct)","Bean Validation: @NotBlank, @Email, @Valid","Xử lý lỗi tập trung: @RestControllerAdvice, ProblemDetail","Phân trang, sắp xếp, mã trạng thái HTTP đúng"],"e":"@RestController @RequestMapping(\"/api/products\")\nclass ProductController {\n    @PostMapping @ResponseStatus(HttpStatus.CREATED)\n    ProductDto create(@Valid @RequestBody CreateProduct req) { return service.create(req); }\n}\nrecord CreateProduct(@NotBlank String name, @Positive long price) {}","h":[["BT 7.2.1 – API sản phẩm","Dựng CRUD sản phẩm có phân trang và validation. Đạt khi: đủ 6 mã lỗi đúng (400, 404, 409...)."],["BT 7.2.2 – Tài liệu API","Thêm OpenAPI/Swagger. Đạt khi: gọi thử được từ giao diện."]]}]},{"t":"Chương 8: Thiết kế API và triển khai","ls":[{"t":"Bài 8.1 – Thiết kế REST, phiên bản hóa và idempotency","m":"60 phút","g":"Thiết kế API bền vững.","k":["Tài nguyên, động từ HTTP, URL","Phiên bản API; tương thích ngược","Idempotency key cho thanh toán","Tối ưu: caching HTTP (ETag), nén","Bảo mật: CORS đúng cách"],"e":"","h":[["BT 8.1.1 – Rà soát API","Rà soát một API cho 10 vi phạm REST/an toàn. Đạt khi: đề xuất sửa từng điểm."],["BT 8.1.2 – Idempotency","Thêm Idempotency-Key cho POST đơn hàng. Đạt khi: gửi lặp không tạo đơn thứ hai."]]},{"t":"Bài 8.2 – Docker hóa và triển khai","m":"60 phút","g":"Đóng gói và chạy ứng dụng Spring Boot.","k":["Build jar, Dockerfile nhiều giai đoạn","docker-compose với PostgreSQL","Biến môi trường và bí mật","Health check, graceful shutdown","Quan sát: log, metrics Prometheus (giới thiệu)"],"e":"","h":[["BT 8.2.1 – Compose","Chạy API + DB bằng một lệnh docker compose up. Đạt khi: dữ liệu giữ khi khởi động lại."],["BT 8.2.2 – Triển khai","Triển khai lên VPS/Render. Đạt khi: /actuator/health trả UP."]]}]}],"pj":["Bài kiểm tra cuối vùng 4: Dựng API \"Catalog sản phẩm VITEC\" có CRUD, validation, phân trang, lỗi chuẩn, OpenAPI, Docker. Thời lượng: 6 giờ."]},{"n":"JPA, kiểm thử và bảo mật cơ bản","ch":[{"t":"Chương 9: Persistence với JPA và SQL","ls":[{"t":"Bài 9.1 – JPA/Hibernate, quan hệ và truy vấn","m":"90 phút","g":"Ánh xạ thực thể và tránh các bẫy hiệu năng.","k":["@Entity, @Id, @Column; quan hệ OneToMany/ManyToOne/ManyToMany","Lazy/Eager; vấn đề N+1 và cách khắc phục (fetch join, @EntityGraph)","Spring Data JPA: derived query, @Query, Specification","Giao dịch @Transactional: phạm vi, rollback","Migration với Flyway; chỉ mục và EXPLAIN"],"e":"@Entity class Order {\n    @Id @GeneratedValue Long id;\n    @ManyToOne(fetch = FetchType.LAZY) Customer customer;\n    @OneToMany(mappedBy = \"order\", cascade = CascadeType.ALL) List<Line> lines = new ArrayList<>();\n}\n@Query(\"select o from Order o join fetch o.lines where o.id = :id\")\nOptional<Order> findWithLines(Long id);","h":[["BT 9.1.1 – Phát hiện N+1","Bật log SQL, tái hiện N+1 và sửa. Đạt khi: số truy vấn giảm từ N+1 xuống 1–2."],["BT 9.1.2 – Migration","Viết 3 migration Flyway thêm bảng, cột, chỉ mục. Đạt khi: chạy lại trên DB trống thành công."]]},{"t":"Bài 9.2 – Giao dịch, khóa và thiết kế dữ liệu","m":"75 phút","g":"Bảo đảm toàn vẹn dữ liệu khi đồng thời.","k":["ACID, mức cô lập giao dịch","Khóa lạc quan (@Version) và bi quan","Trừ kho an toàn khi đặt hàng đồng thời","Chuẩn hóa và phi chuẩn hóa hợp lý","Truy vấn báo cáo: native query, projection"],"e":"","h":[["BT 9.2.1 – Bán quá số lượng","Tái hiện 2 người mua món hàng cuối cùng và sửa bằng @Version. Đạt khi: một giao dịch bị từ chối đúng."],["BT 9.2.2 – Báo cáo doanh thu","Viết truy vấn doanh thu theo tháng có chỉ mục phù hợp. Đạt khi: EXPLAIN không quét toàn bảng."]]}]},{"t":"Chương 10: Kiểm thử và bảo mật","ls":[{"t":"Bài 10.1 – Kiểm thử: JUnit, Mockito, Testcontainers","m":"90 phút","g":"Kiểm thử từ đơn vị đến tích hợp.","k":["JUnit 5, AssertJ, tham số hóa","Mockito: mock, verify; tránh mock quá mức","@WebMvcTest, @DataJpaTest, @SpringBootTest","Testcontainers với PostgreSQL thật","Độ phủ với JaCoCo; kiểm thử hợp đồng (giới thiệu)"],"e":"@Test\nvoid tao_don_khong_du_hang_thi_loi() {\n    when(stock.available(\"A\")).thenReturn(0);\n    assertThatThrownBy(() -> service.create(new CreateOrder(\"A\", 1)))\n        .isInstanceOf(OutOfStockException.class);\n}","h":[["BT 10.1.1 – Bộ kiểm thử dịch vụ","Viết 15 kiểm thử đơn vị cho OrderService. Đạt khi: độ phủ nhánh ≥ 80%."],["BT 10.1.2 – Kiểm thử tích hợp","Viết 5 kiểm thử với Testcontainers. Đạt khi: chạy trong CI."]]},{"t":"Bài 10.2 – Spring Security, JWT và OWASP","m":"90 phút","g":"Bảo vệ API theo thực hành tốt.","k":["Xác thực và phân quyền; SecurityFilterChain","Băm mật khẩu BCrypt; JWT: access/refresh, thời hạn, thu hồi","OWASP Top 10: injection, broken access control, lộ dữ liệu","Phân quyền theo phương thức và theo dữ liệu (không chỉ vai trò)","Rate limiting, CORS, CSRF với API; quản lý bí mật"],"e":"@Bean SecurityFilterChain chain(HttpSecurity http) throws Exception {\n    return http.csrf(c -> c.disable())\n        .authorizeHttpRequests(a -> a.requestMatchers(\"/api/auth/**\").permitAll()\n            .requestMatchers(\"/api/admin/**\").hasRole(\"ADMIN\").anyRequest().authenticated())\n        .oauth2ResourceServer(o -> o.jwt(Customizer.withDefaults())).build();\n}","h":[["BT 10.2.1 – Bảo vệ API","Thêm đăng nhập JWT và phân quyền 2 vai trò cho API Catalog. Đạt khi: truy cập thiếu quyền trả 401/403 đúng."],["BT 10.2.2 – Kiểm tra OWASP","Thử 5 lỗ hổng (IDOR, SQLi, XSS...) trên API của mình. Đạt khi: nộp bằng chứng và cách vá."]]}]}],"pj":["Bài kiểm tra cuối vùng 5: Hoàn thiện đồ án \"Backend e-commerce VITEC\" gồm catalog, giỏ hàng, đặt hàng có khóa lạc quan, JWT, ≥ 40 kiểm thử, Docker, CI. Thời lượng: 10 giờ."]}]},{"id":"swt","name":"SWT (Eclipse)","tag":"Widget, layout, JFace, UI thread, đóng gói","level":"Trung cấp","time":"4–6 tuần","code":"code-swt","who":"Người cần xây ứng dụng desktop Java dùng giao diện gốc của hệ điều hành, hoặc phát triển plugin/RCP trên nền Eclipse. Lưu ý: SWT ở đây là Standard Widget Toolkit của Eclipse, không phải Software Testing.","pre":["Thành thạo Java cơ bản và OOP","Biết lambda và listener","Cài Eclipse IDE for RCP/RAP developers hoặc thêm thư viện SWT vào dự án Maven/Gradle"],"map":[{"t":"Giai đoạn 1 – Nền tảng SWT","w":"Tuần 1–2","g":"Dựng được cửa sổ SWT có widget và xử lý sự kiện cơ bản.","i":["Display, Shell, vòng lặp sự kiện","Label, Text, Button, Combo, List, Table, Tree","Listener và sự kiện người dùng"],"o":"Ứng dụng nhập thông tin một màn hình có kiểm tra dữ liệu."},{"t":"Giai đoạn 2 – Bố cục và JFace","w":"Tuần 3–4","g":"Tạo giao diện co giãn và tách dữ liệu khỏi hiển thị bằng JFace.","i":["FillLayout, RowLayout, GridLayout, FormLayout","TableViewer, TreeViewer, ContentProvider, LabelProvider","Hộp thoại, wizard"],"o":"Ứng dụng quản lý danh sách có tìm kiếm, sắp xếp và lọc dùng TableViewer."},{"t":"Giai đoạn 3 – Luồng, tài nguyên và đóng gói","w":"Tuần 5–6","g":"Ứng dụng mượt, không rò rỉ tài nguyên và đóng gói được cho người dùng cuối.","i":["asyncExec, syncExec, Job","dispose() và quản lý Color, Font, Image","Đóng gói theo hệ điều hành, jpackage"],"o":"Bản cài đặt chạy được trên ít nhất một hệ điều hành, không treo giao diện khi xử lý nặng."}],"areas":[{"n":"Display, Shell, widget và sự kiện","d":"Hiểu mô hình cơ bản của SWT: một Display, nhiều Shell, mỗi widget thuộc một cha.","p":["Vòng đời Display và Shell, vòng lặp readAndDispatch","Widget cha và con, Style bit (SWT.BORDER, SWT.PUSH, SWT.MULTI...)","Widget thông dụng: Label, Text, Button (push, check, radio), Combo, List, Table, Tree, TabFolder","Listener: Selection, Modify, KeyDown, MouseDown, Dispose","Menu, thanh công cụ, hộp thoại thông báo và chọn tệp"],"x":[["Bài 1 – Cơ bản: Form nhập liệu","Dựng form có họ tên, tuổi, giới tính, nút Lưu; kiểm tra dữ liệu và hiện thông báo lỗi bằng MessageBox. Đạt khi: không cho lưu khi dữ liệu sai."],["Bài 2 – Nâng cao: Trình soạn thảo mini","Dựng cửa sổ có menu Tệp (Mở, Lưu, Thoát), vùng soạn thảo nhiều dòng, đếm từ theo thời gian thực. Đạt khi: hỏi lưu trước khi thoát nếu có thay đổi."]]},{"n":"Bố cục (Layout)","d":"Giao diện phải co giãn đúng khi đổi kích thước cửa sổ và độ phân giải màn hình.","p":["FillLayout và RowLayout cho bố cục đơn giản","GridLayout: số cột, GridData (căn lề, chiếm không gian thừa, span)","FormLayout và FormData để neo theo cạnh","Composite lồng nhau để chia vùng","Tránh kích thước tuyệt đối, kiểm tra trên màn hình độ phân giải cao"],"x":[["Bài 1 – Cơ bản: Form đăng nhập","Dựng form đăng nhập bằng GridLayout, ô nhập giãn theo chiều ngang khi phóng to cửa sổ. Đạt khi: không vỡ khi kéo cửa sổ nhỏ nhất và lớn nhất."],["Bài 2 – Nâng cao: Bố cục 3 vùng","Dựng cửa sổ có thanh công cụ trên, danh sách bên trái, chi tiết bên phải dùng SashForm chia được. Đạt khi: kéo thanh chia hoạt động và nội dung co giãn đúng."]]},{"n":"JFace Viewer và tách dữ liệu khỏi giao diện","d":"Cách làm việc chuẩn với bảng và cây, giúp mã dễ kiểm thử và bảo trì.","p":["TableViewer và TreeViewer","IStructuredContentProvider hoặc ITreeContentProvider","LabelProvider, ColumnLabelProvider cho nhiều cột","ViewerComparator để sắp xếp, ViewerFilter để lọc","Bắt sự kiện chọn dòng (ISelectionChangedListener)"],"x":[["Bài 1 – Cơ bản: Bảng sinh viên","Hiển thị danh sách sinh viên (mã, tên, điểm) bằng TableViewer 3 cột. Đạt khi: dữ liệu lấy từ lớp mô hình riêng, không nhét vào widget."],["Bài 2 – Nâng cao: Tìm kiếm và sắp xếp","Thêm ô tìm kiếm lọc theo thời gian thực và sắp xếp khi bấm tiêu đề cột. Đạt khi: 10.000 dòng vẫn mượt."]]},{"n":"Luồng giao diện và quản lý tài nguyên","d":"Hai nguyên nhân phổ biến nhất khiến ứng dụng SWT treo hoặc lỗi: sai luồng và rò rỉ tài nguyên.","p":["Quy tắc: chỉ UI thread được thao tác widget, lỗi Invalid thread access","Display.asyncExec và syncExec, kiểm tra isDisposed() trước khi cập nhật","Org.eclipse.core.runtime.jobs.Job và thanh tiến độ","Color, Font, Image, GC, Cursor phải dispose(); LocalResourceManager","Phát hiện rò rỉ handle bằng công cụ Sleak hoặc theo dõi bộ đếm"],"x":[["Bài 1 – Cơ bản: Nút tải dữ liệu","Bấm nút chạy tác vụ 5 giây ở luồng nền, hiện thanh tiến độ và cập nhật kết quả an toàn. Đạt khi: giao diện không đơ trong lúc chờ."],["Bài 2 – Nâng cao: Thư viện ảnh","Hiển thị 200 ảnh thu nhỏ, tạo và hủy Image đúng chỗ. Đạt khi: mở và đóng cửa sổ 20 lần không làm tăng số handle."]]},{"n":"Đóng gói và triển khai","d":"Đưa ứng dụng đến tay người dùng cuối.","p":["SWT chứa mã gốc theo hệ điều hành và kiến trúc (Windows, macOS, Linux; x86_64, ARM64)","Chọn đúng artifact theo nền tảng bằng Maven hoặc Gradle","Đóng gói JAR chạy được và bản cài bằng jpackage kèm JRE","Cơ bản về Eclipse RCP và plugin","Ghi nhật ký lỗi và báo lỗi thân thiện"],"x":[["Bài 1 – Cơ bản: JAR chạy được","Đóng gói ứng dụng thành JAR chạy bằng một lệnh trên hệ điều hành của bạn. Đạt khi: chạy được trên máy chưa cài môi trường phát triển (có JRE)."],["Bài 2 – Nâng cao: Bản cài đặt","Tạo bản cài đặt bằng jpackage có biểu tượng và tên ứng dụng. Đạt khi: cài đặt và gỡ cài đặt thành công trên máy sạch."]]}],"pit":["Cập nhật widget từ luồng nền","Không dispose tài nguyên tự tạo, gây rò rỉ handle","Chặn UI thread bằng tác vụ dài làm ứng dụng đứng hình","Dùng sai Style bit khi khởi tạo widget (không đổi được sau khi tạo)","Dùng kích thước pixel cố định, vỡ giao diện trên màn hình DPI cao"],"proj":["Trình quản lý ghi chú desktop với TableViewer, tìm kiếm và lọc","Công cụ quản lý đơn hàng offline đồng bộ khi có mạng","Plugin Eclipse đơn giản thêm view và lệnh vào IDE"],"tools":["Eclipse IDE (RCP/RAP)","Window Builder để dựng giao diện","SWT Spy / Plug-in Spy để kiểm tra widget","Maven hoặc Gradle (hoặc Tycho cho RCP)","jpackage"],"refs":["Tài liệu và ví dụ SWT (eclipse.dev/eclipse/swt)","Wiki JFace (wiki.eclipse.org)","Bộ tài liệu Eclipse (help.eclipse.org)"],"check":["Giải thích được UI thread và dùng asyncExec đúng cách","Không để rò rỉ tài nguyên khi đóng cửa sổ","Dựng được giao diện bằng GridLayout co giãn tốt","Dùng được TableViewer với provider riêng"],"cur":[{"n":"Display, Shell, widget và sự kiện","ch":[{"t":"Chương 1: Khởi động với SWT","ls":[{"t":"Bài 1.1 – Cài môi trường và ứng dụng SWT đầu tiên","m":"60 phút","g":"Dựng dự án SWT chạy được trên Eclipse hoặc Maven.","k":["SWT là gì: bọc widget gốc của hệ điều hành; so sánh với Swing/JavaFX","Cài Eclipse IDE for Java, thư viện SWT theo hệ điều hành (hoặc Maven org.eclipse.platform)","Vòng đời: Display, Shell, vòng lặp sự kiện readAndDispatch, dispose","Chạy ứng dụng, cờ -XstartOnFirstThread trên macOS","Nguyên tắc: widget do cha sở hữu, hủy cha thì hủy con"],"e":"Display display = new Display();\nShell shell = new Shell(display);\nshell.setText(\"Xin chào SWT\");\nshell.setSize(360, 200);\nshell.open();\nwhile (!shell.isDisposed()) {\n    if (!display.readAndDispatch()) display.sleep();\n}\ndisplay.dispose();","h":[["BT 1.1.1 – Cửa sổ chào","Dựng cửa sổ có tiêu đề, kích thước, canh giữa màn hình. Đạt khi: chạy được và đóng cửa sổ thì tiến trình thoát."],["BT 1.1.2 – Giải thích vòng lặp","Viết 1 trang giải thích vì sao cần readAndDispatch và sleep. Đạt khi: nêu được hậu quả nếu bỏ sleep."]]},{"t":"Bài 1.2 – Widget cơ bản và xử lý sự kiện","m":"75 phút","g":"Dùng Label, Text, Button, Combo, Table và gắn listener.","k":["Label, Text, Button (PUSH, CHECK, RADIO), Combo, List","SelectionListener, ModifyListener, KeyListener; adapter","Lambda cho listener; tránh mã lồng sâu","MessageBox, FileDialog, DirectoryDialog","Style bit: SWT.BORDER, SWT.MULTI...; kiểm tra tham số hợp lệ"],"e":"Button ok = new Button(shell, SWT.PUSH);\nok.setText(\"Lưu\");\nok.addSelectionListener(SelectionListener.widgetSelectedAdapter(e -> {\n    MessageBox mb = new MessageBox(shell, SWT.ICON_INFORMATION | SWT.OK);\n    mb.setMessage(\"Đã lưu: \" + text.getText());\n    mb.open();\n}));","h":[["BT 1.2.1 – Form đăng nhập","Dựng form tên, mật khẩu (SWT.PASSWORD), nút đăng nhập, kiểm tra rỗng. Đạt khi: báo lỗi bằng MessageBox đúng."],["BT 1.2.2 – Trình đọc tệp","Cho chọn tệp bằng FileDialog và hiển thị nội dung. Đạt khi: tệp lỗi có thông báo thân thiện."]]}]},{"t":"Chương 2: Menu, hộp thoại và ứng dụng cửa sổ","ls":[{"t":"Bài 2.1 – Menu, toolbar, thanh trạng thái","m":"60 phút","g":"Dựng khung ứng dụng desktop đầy đủ.","k":["Menu bar, menu item, phím tắt (accelerator)","ToolBar, ToolItem với hình ảnh","Thanh trạng thái bằng Label ở dưới","Hộp thoại tùy biến (Dialog) và trả giá trị","Tách logic ra khỏi listener"],"e":"Menu bar = new Menu(shell, SWT.BAR);\nMenuItem file = new MenuItem(bar, SWT.CASCADE); file.setText(\"&Tệp\");\nMenu fm = new Menu(shell, SWT.DROP_DOWN); file.setMenu(fm);\nMenuItem exit = new MenuItem(fm, SWT.PUSH); exit.setText(\"Thoát\\tCtrl+Q\"); exit.setAccelerator(SWT.MOD1 + 'Q');\nexit.addListener(SWT.Selection, e -> shell.close());\nshell.setMenuBar(bar);","h":[["BT 2.1.1 – Trình soạn thảo","Dựng notepad có Mở, Lưu, Thoát và phím tắt. Đạt khi: hỏi lưu khi đóng với nội dung đã sửa."],["BT 2.1.2 – Hộp thoại cài đặt","Dựng hộp thoại tùy chọn trả về đối tượng cấu hình. Đạt khi: Hủy không thay đổi dữ liệu."]]},{"t":"Bài 2.2 – Table, Tree và kiểm tra dữ liệu","m":"75 phút","g":"Hiển thị dữ liệu dạng bảng và cây.","k":["Table, TableColumn, TableItem; sắp xếp theo cột","Tree, TreeItem và mở rộng nhanh","Chọn nhiều dòng, menu ngữ cảnh","Hiệu năng: SWT.VIRTUAL cho dữ liệu lớn","Kiểm tra nhập liệu và phản hồi tại chỗ"],"e":"","h":[["BT 2.2.1 – Danh bạ","Dựng bảng danh bạ có sắp xếp, tìm kiếm, thêm/xóa. Đạt khi: 10.000 dòng vẫn mượt (VIRTUAL)."],["BT 2.2.2 – Trình duyệt thư mục","Dựng cây thư mục tải lười. Đạt khi: mở thư mục lớn không đứng."]]}]}],"pj":["Bài kiểm tra cuối vùng 1: Dựng ứng dụng \"Ghi chú\" có menu, toolbar, bảng danh sách ghi chú, hộp thoại sửa, lưu tệp JSON. Thời lượng: 5 giờ."]},{"n":"Bố cục (Layout)","ch":[{"t":"Chương 3: Layout cơ bản","ls":[{"t":"Bài 3.1 – FillLayout, RowLayout, GridLayout","m":"75 phút","g":"Bố trí widget tự điều chỉnh khi đổi kích thước.","k":["Vì sao dùng layout thay cho tọa độ tuyệt đối","FillLayout, RowLayout: thuộc tính và khi dùng","GridLayout: numColumns, makeColumnsEqualWidth, margin, spacing","GridData: horizontalAlignment, grabExcessHorizontalSpace, horizontalSpan, hint","Composite lồng nhau để chia vùng"],"e":"Composite form = new Composite(shell, SWT.NONE);\nform.setLayout(new GridLayout(2, false));\nnew Label(form, SWT.NONE).setText(\"Họ tên:\");\nText name = new Text(form, SWT.BORDER);\nname.setLayoutData(new GridData(SWT.FILL, SWT.CENTER, true, false));","h":[["BT 3.1.1 – Form hồ sơ","Dựng form 8 trường 2 cột, co giãn đẹp khi phóng to. Đạt khi: nhãn thẳng hàng và ô nhập chiếm hết chỗ."],["BT 3.1.2 – Bố cục trang chủ","Dựng header, sidebar, nội dung, footer chỉ bằng layout. Đạt khi: không dùng setBounds."]]},{"t":"Bài 3.2 – FormLayout, StackLayout, SashForm và ScrolledComposite","m":"75 phút","g":"Làm bố cục phức tạp và có thể thay đổi kích thước.","k":["FormLayout, FormData, FormAttachment: neo theo cạnh","StackLayout cho wizard/trang chuyển","SashForm: chia vùng kéo được","ScrolledComposite cho nội dung dài","SWT Browser widget và nhúng nội dung web"],"e":"","h":[["BT 3.2.1 – Wizard 3 trang","Dựng wizard dùng StackLayout với Trước/Sau. Đạt khi: trạng thái nút đúng ở trang đầu/cuối."],["BT 3.2.2 – Cửa sổ chia đôi","Dùng SashForm chia danh sách và chi tiết. Đạt khi: nhớ tỷ lệ chia khi mở lại."]]}]},{"t":"Chương 4: Giao diện chuyên nghiệp","ls":[{"t":"Bài 4.1 – Hình ảnh, font, màu và quản lý tài nguyên","m":"60 phút","g":"Dùng tài nguyên đồ họa không rò rỉ.","k":["Image, Color, Font là tài nguyên hệ điều hành: phải dispose","LocalResourceManager/ JFace resources","Biểu tượng nhiều độ phân giải, DPI cao","Chủ đề sáng/tối và hạn chế của SWT","Custom drawing với GC trong PaintListener"],"e":"Image img = new Image(display, \"icon.png\");\nbutton.setImage(img);\nbutton.addDisposeListener(e -> img.dispose());","h":[["BT 4.1.1 – Bộ biểu tượng","Tải 10 biểu tượng và dispose đúng. Đạt khi: theo dõi Sleak/handle không tăng sau 100 lần mở đóng."],["BT 4.1.2 – Biểu đồ vẽ tay","Vẽ biểu đồ cột bằng GC. Đạt khi: vẽ lại đúng khi đổi kích thước."]]},{"t":"Bài 4.2 – Kiến trúc giao diện: MVC/MVP và tách logic","m":"75 phút","g":"Tổ chức mã SWT để dễ kiểm thử.","k":["Vấn đề của listener chứa logic nghiệp vụ","MVP: Presenter kiểm thử được không cần UI","Binding dữ liệu: JFace Data Binding (giới thiệu)","Cấu trúc package: model, view, presenter","Kiểm thử logic bằng JUnit không khởi động Display"],"e":"","h":[["BT 4.2.1 – Tách presenter","Tách logic form đăng nhập khỏi View. Đạt khi: kiểm thử Presenter bằng JUnit không cần Display."],["BT 4.2.2 – Quy tắc đặt tên","Viết hướng dẫn kiến trúc 1 trang. Đạt khi: đồng đội áp dụng được."]]}]}],"pj":["Bài kiểm tra cuối vùng 2: Dựng form quản lý nhân sự 20 trường chia nhóm, co giãn mượt, có bố cục sáng/tối cơ bản, tài nguyên không rò rỉ. Thời lượng: 5 giờ."]},{"n":"JFace Viewer và tách dữ liệu khỏi giao diện","ch":[{"t":"Chương 5: JFace Viewer","ls":[{"t":"Bài 5.1 – TableViewer, ContentProvider, LabelProvider","m":"90 phút","g":"Hiển thị mô hình dữ liệu trong bảng qua viewer.","k":["Vì sao Viewer: tách model và widget","IStructuredContentProvider và ILabelProvider/ColumnLabelProvider","TableViewerColumn, đặt input, refresh/update","Selection: IStructuredSelection","Sắp xếp và lọc bằng ViewerComparator, ViewerFilter"],"e":"TableViewer v = new TableViewer(parent, SWT.BORDER | SWT.FULL_SELECTION);\nv.setContentProvider(ArrayContentProvider.getInstance());\nTableViewerColumn c = new TableViewerColumn(v, SWT.N
