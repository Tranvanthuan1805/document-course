// Biên dịch: gcc -std=c17 -Wall -Wextra -g -fsanitize=address,undefined demo.c -o demo
#include <stdio.h>
#include <stdlib.h>
#include <string.h>

char *dup_upper(const char *s) {
    size_t n = strlen(s);
    char *out = malloc(n + 1);          /* +1 cho ký tự '\0' */
    if (!out) return NULL;              /* luôn kiểm tra malloc */
    for (size_t i = 0; i <= n; i++)
        out[i] = (s[i] >= 'a' && s[i] <= 'z') ? (char)(s[i] - 32) : s[i];
    return out;
}

int main(void) {
    char *t = dup_upper("hello");
    if (!t) return 1;
    puts(t);
    free(t);                            /* mỗi malloc cần đúng một free */
    return 0;
}
</script>
<script type="text/plain" id="code-cpp">
// Biên dịch: g++ -std=c++20 -Wall -Wextra -O2 demo.cpp -o demo
#include <algorithm>
#include <iostream>
#include <memory>
#include <vector>

struct Order { int id; double total; };

int main() {
    std::vector<std::unique_ptr<Order>> orders;
    orders.push_back(std::make_unique<Order>(Order{1, 120.5}));
    orders.push_back(std::make_unique<Order>(Order{2, 80.0}));

    // Sắp xếp theo tổng tiền bằng ranges + projection
    std::ranges::sort(orders, {}, [](const std::unique_ptr<Order>& o) { return o->total; });

    for (const auto& o : orders)
        std::cout << o->id << ": " << o->total << '\n';
}   // unique_ptr tự giải phóng bộ nhớ (RAII)
</script>

<script type="text/plain" id="code-ts">
type Result<T> = { ok: true; data: T } | { ok: false; error: string };

async function fetchJson<T>(url: string, signal?: AbortSignal): Promise<Result<T>> {
  try {
    const res = await fetch(url, { signal });
    if (!res.ok) return { ok: false, error: `HTTP ${res.status}` };
    return { ok: true, data: (await res.json()) as T };
  } catch (e) {
    return { ok: false, error: e instanceof Error ? e.message : "Unknown error" };
  }
}

interface Product { id: number; name: string; price: number }

const r = await fetchJson<Product[]>("/api/products");
if (r.ok) {
  r.data.forEach(p => console.log(p.name));   // TypeScript tự thu hẹp kiểu (narrowing)
} else {
  console.error(r.error);
}
</script>
<script type="text/plain" id="code-java">
public record ProductDto(long id, String name, java.math.BigDecimal price) {}

@RestController
@RequestMapping("/api/products")
class ProductController {
    private final ProductService service;

    ProductController(ProductService service) {          // constructor injection
        this.service = service;
    }

    @GetMapping("/{id}")
    ResponseEntity<ProductDto> get(@PathVariable long id) {
        return service.find(id)
                .map(ResponseEntity::ok)
                .orElse(ResponseEntity.notFound().build());
    }

    @PostMapping
    ResponseEntity<ProductDto> create(@Valid @RequestBody CreateProductRequest req) {
        ProductDto created = service.create(req);
        return ResponseEntity.status(HttpStatus.CREATED).body(created);
    }
}
</script>
<script type="text/plain" id="code-swt">
Display display = new Display();
Shell shell = new Shell(display);
shell.setText("Demo SWT");
shell.setLayout(new GridLayout(2, false));

Label status = new Label(shell, SWT.NONE);
status.setText("Sẵn sàng");
Button run = new Button(shell, SWT.PUSH);
run.setText("Chạy tác vụ nền");

run.addListener(SWT.Selection, e -> new Thread(() -> {
    String result = heavyWork();                       // KHÔNG chạm vào widget ở luồng nền
    display.asyncExec(() -> {                          // quay về UI thread để cập nhật
        if (!status.isDisposed()) status.setText(result);
    });
}).start());

shell.pack();
shell.open();
while (!shell.isDisposed()) {                          // vòng lặp sự kiện
    if (!display.readAndDispatch()) display.sleep();
}
display.dispose();
</script>

ạn mã có lỗi (double free, rò rỉ, ghi ngoài biên). Dùng AddressSanitizer hoặc valgrind để tìm, giải thích nguyên nhân và sửa. Đạt khi: báo cáo sạch và có ghi chú từng lỗi."]]},{"n":"Cấu trúc dữ liệu tự cài và làm việc với tệp","d":"Biến kiến thức nền thành các thành phần dùng được trong dự án thật.","p":["struct, union, enum, căn chỉnh và padding","Danh sách liên kết đơn và đôi, ngăn xếp, hàng đợi","Bảng băm với xử lý va chạm bằng chuỗi liên kết","fopen, fread, fwrite, fgets, đóng tệp và xử lý lỗi bằng errno, perror","Đọc và phân tích tệp CSV"],"x":[["Bài 1 – Cơ bản: Danh sách liên kết","Cài push, pop, đảo ngược và xóa theo giá trị. Đạt khi: có chương trình kiểm thử và không rò rỉ bộ nhớ."],["Bài 2 – Nâng cao: Bảng băm lưu CSV","Đọc tệp CSV, lưu vào bảng băm theo khóa chuỗi, tra cứu nhanh, tự tăng kích thước khi hệ số tải vượt 0,75. Đạt khi: tra cứu đúng trên tệp 100.000 dòng."]]},{"n":"Biên dịch, build và gỡ lỗi","d":"Làm chủ công cụ để tìm lỗi nhanh và giao sản phẩm đáng tin cậy.","p":["Các bước: tiền xử lý, biên dịch, assembly, liên kết","Cờ -Wall -Wextra -std=c17 -g -O0/-O2 và -fsanitize=address,undefined","Tách tệp .h/.c, include guard, lỗi undefined reference","Makefile hoặc CMake cơ bản","gdb: break, run, next, step, print, backtrace, watch"],"x":[["Bài 1 – Cơ bản: Makefile","Tách một chương trình thành 3 tệp .c và 2 tệp .h, viết Makefile có target all và clean. Đạt khi: make build sạch, không cảnh báo."],["Bài 2 – Nâng cao: Gỡ lỗi segfault","Nhận chương trình có lỗi segfault, dùng gdb và backtrace để xác định dòng lỗi, ghi lại các bước tìm lỗi và bản sửa. Đạt khi: tái hiện được lỗi, sửa xong chạy ổn định."]]}],"pit":["Quên cấp +1 byte cho ký tự '\\0' khi cấp phát chuỗi","Dùng sizeof trên con trỏ thay vì trên mảng gốc","Trả về con trỏ tới biến cục bộ trên stack","free hai lần (double free) hoặc dùng sau khi free","Không kiểm tra giá trị trả về của malloc, fopen, scanf"],"proj":["Trình đọc/ghi CSV tự viết, không dùng thư viện ngoài","Bảng băm dạng chuỗi với resize tự động và bộ kiểm thử","Shell mini: đọc lệnh, fork/exec, hỗ trợ pipe","Bộ cấp phát bộ nhớ đơn giản (arena allocator)"],"tools":["gcc/clang","make hoặc CMake","gdb hoặc lldb","valgrind","AddressSanitizer / UBSan","clang-tidy, cppcheck"],"refs":["Tài liệu GCC và GDB (gnu.org)","Đặc tả ngôn ngữ và tham chiếu thư viện chuẩn (cppreference.com, mục C)","Sách 'The C Programming Language' (K&R) – đọc kèm bài tập"],"check":["Tự giải thích được stack/heap và vòng đời bộ nhớ","Chạy sạch dưới ASan, UBSan và valgrind","Viết được danh sách liên kết, bảng băm không rò rỉ","Biết đọc backtrace và dùng gdb để tìm lỗi segfault"],"cur":[{"n":"Kiểu dữ liệu, toán tử và luồng điều khiển","ch":[{"t":"Chương 1: Chương trình C đầu tiên và kiểu dữ liệu","ls":[{"t":"Bài 1.1 – Cấu trúc một chương trình C và quy trình biên dịch","m":"45 phút","g":"Viết, biên dịch và chạy được chương trình C đơn giản; hiểu 4 giai đoạn từ mã nguồn đến tệp chạy.","k":["Cấu trúc tối thiểu: #include, hàm main, câu lệnh kết thúc bằng dấu chấm phẩy, giá trị trả về của main","Bốn giai đoạn: tiền xử lý → biên dịch → assembly → liên kết (linker)","Lệnh gcc cơ bản và các cờ nên luôn dùng: -std=c17 -Wall -Wextra","Đọc và phân biệt lỗi biên dịch (error) với cảnh báo (warning); không bỏ qua warning","Hàm printf, các ký tự escape \\n \\t \\\\ và quy ước định dạng cơ bản"],"e":"#include <stdio.h>\n\nint main(void) {\n    printf(\"Xin chao, C!\\n\");\n    return 0;\n}\n/* gcc -std=c17 -Wall -Wextra hello.c -o hello && ./hello */","h":[["BT 1.1.1 – In danh thiếp","Viết chương trình in họ tên, lớp, email của bạn trên 3 dòng, căn lề bằng \\t. Đạt khi: biên dịch với -Wall -Wextra không có cảnh báo và đầu ra đúng 3 dòng."],["BT 1.1.2 – Khám phá các giai đoạn","Dùng gcc -E, -S, -c lần lượt cho hello.c, ghi lại kích thước và nội dung từng tệp sinh ra. Đạt khi: nộp bảng 4 dòng mô tả mỗi giai đoạn tạo ra gì."]]},{"t":"Bài 1.2 – Biến, kiểu số nguyên và số thực","m":"60 phút","g":"Chọn đúng kiểu dữ liệu theo phạm vi giá trị; tránh tràn số và mất độ chính xác.","k":["Kiểu nguyên: char, short, int, long, long long; có dấu và không dấu; kích thước thực tế bằng sizeof","Kiểu số thực: float, double; sai số làm tròn, vì sao không so sánh bằng == ","Giới hạn trong <limits.h> và <float.h>; kiểu có độ rộng cố định trong <stdint.h> (int32_t, uint64_t)","Tràn số nguyên có dấu là hành vi không xác định (UB); tràn số không dấu quay vòng","Khai báo, khởi tạo, hằng số (const, #define), quy tắc đặt tên"],"e":"#include <stdio.h>\n#include <limits.h>\n#include <stdint.h>\n\nint main(void) {\n    printf(\"int: %zu byte, max=%d\\n\", sizeof(int), INT_MAX);\n    uint8_t u = 255; u++;            // quay vong ve 0\n    printf(\"u = %u\\n\", u);\n    double a = 0.1 + 0.2;\n    printf(\"0.1+0.2 == 0.3 ? %s\\n\", a == 0.3 ? \"dung\" : \"sai\");\n    return 0;\n}","h":[["BT 1.2.1 – Bảng kích thước kiểu","In ra sizeof và giá trị lớn nhất/nhỏ nhất của tất cả kiểu nguyên chuẩn trên máy bạn. Đạt khi: kết quả khớp với <limits.h> và có nhận xét khác biệt giữa char và unsigned char."],["BT 1.2.2 – So sánh số thực an toàn","Viết hàm so sánh hai double bằng sai số epsilon. Đạt khi: trả về đúng với 0.1+0.2 và 0.3, trả về sai với 1.0 và 1.0001."]]},{"t":"Bài 1.3 – Nhập xuất dữ liệu với printf và scanf","m":"60 phút","g":"Nhập xuất an toàn, kiểm tra giá trị trả về của scanf, xử lý dữ liệu nhập sai.","k":["Định dạng %d %i %u %ld %lld %f %lf %c %s %x %p và độ rộng, độ chính xác (%8.2f)","scanf trả về số mục đọc thành công; luôn kiểm tra giá trị này","Bộ đệm nhập: ký tự xuống dòng còn sót lại, cách xả bộ đệm","Đọc chuỗi an toàn bằng fgets thay vì gets/scanf(\"%s\") không giới hạn","Chuyển chuỗi sang số: strtol, strtod và kiểm tra lỗi"],"e":"#include <stdio.h>\n\nint main(void) {\n    int tuoi;\n    printf(\"Nhap tuoi: \");\n    if (scanf(\"%d\", &tuoi) != 1) {\n        fprintf(stderr, \"Du lieu khong hop le\\n\");\n        return 1;\n    }\n    printf(\"Nam sau ban %d tuoi\\n\", tuoi + 1);\n    return 0;\n}","h":[["BT 1.3.1 – Máy tính hóa đơn","Nhập đơn giá (double), số lượng (int), tính thành tiền có VAT 8%, in 2 chữ số thập phân. Đạt khi: nhập chữ vào ô số thì chương trình báo lỗi và thoát mã 1, không treo."],["BT 1.3.2 – Đọc họ tên có khoảng trắng","Dùng fgets đọc họ tên tối đa 50 ký tự, bỏ ký tự \\n cuối, in lại. Đạt khi: nhập chuỗi dài hơn 50 ký tự không gây tràn bộ nhớ (kiểm tra bằng -fsanitize=address)."]]}]},{"t":"Chương 2: Toán tử và biểu thức","ls":[{"t":"Bài 2.1 – Toán tử số học, so sánh và logic","m":"50 phút","g":"Tính đúng biểu thức; hiểu độ ưu tiên, kết hợp và đánh giá tắt (short-circuit).","k":["Phép chia nguyên và phần dư %; hành vi với số âm","Toán tử so sánh, logic && || !; giá trị 0 là sai, khác 0 là đúng","Đánh giá tắt: vế phải không được đánh giá nếu vế trái đã quyết định kết quả","Thứ tự ưu tiên và dùng ngoặc để rõ ý; lỗi nhầm = với ==","Ép kiểu ngầm định và tường minh: (double)a / b"],"e":"int a = 7, b = 2;\nprintf(\"%d %d %.2f\\n\", a / b, a % b, (double)a / b);   // 3 1 3.50\nif (b != 0 && a / b > 2) puts(\"an toan, khong chia cho 0\");","h":[["BT 2.1.1 – Năm nhuận","Nhập năm, kiểm tra năm nhuận chỉ bằng một biểu thức logic. Đạt khi: đúng với 1900 (không), 2000 (có), 2024 (có), 2100 (không)."],["BT 2.1.2 – Đổi giây","Nhập số giây, in ra dạng giờ:phút:giây. Đạt khi: 3725 giây → 1:02:05, 0 giây → 0:00:00."]]},{"t":"Bài 2.2 – Toán tử bit và dịch bit","m":"60 phút","g":"Thao tác bit để đặt/xóa/đảo/kiểm tra cờ; ứng dụng trong mã hóa trạng thái.","k":["& | ^ ~ << >> và bảng chân trị","Mẫu đặt bit, xóa bit, đảo bit, kiểm tra bit: x |= (1u<<n), x &= ~(1u<<n), x ^= (1u<<n)","Dịch bit trên số có dấu: vùng hành vi không xác định; ưu tiên kiểu không dấu","Đếm bit 1, kiểm tra lũy thừa của 2: (x & (x-1)) == 0","Dùng mặt nạ bit làm cờ quyền (đọc/ghi/chạy)"],"e":"unsigned flags = 0;\nflags |= (1u << 2);            // bat bit 2\nflags &= ~(1u << 2);           // tat bit 2\nint bat = (flags >> 2) & 1u;   // doc bit 2","h":[["BT 2.2.1 – In dạng nhị phân","Viết hàm in 8 bit của một số uint8_t. Đạt khi: 5 → 00000101, 255 → 11111111."],["BT 2.2.2 – Quyền truy cập","Cài 3 cờ READ/WRITE/EXEC bằng bit, viết hàm cấp, thu hồi, kiểm tra quyền. Đạt khi: có 6 ca thử cho đủ tổ hợp và kết quả đúng."]]}]},{"t":"Chương 3: Luồng điều khiển","ls":[{"t":"Bài 3.1 – Rẽ nhánh if/else và switch","m":"50 phút","g":"Chọn cấu trúc rẽ nhánh phù hợp; tránh lỗi quên break và dangling else.","k":["if, else if, else; toán tử ba ngôi ?:","switch trên kiểu nguyên/ký tự; hiện tượng rơi xuống (fall-through) và khi nào dùng có chủ ý","Quy tắc dangling else và luôn dùng dấu ngoặc nhọn","Kiểm tra điều kiện biên trước, xử lý lỗi sớm (early return)","Đừng lồng quá 3 tầng; tách hàm"],"e":"switch (thang) {\n    case 1: case 3: case 5: case 7: case 8: case 10: case 12: ngay = 31; break;\n    case 4: case 6: case 9: case 11: ngay = 30; break;\n    case 2: ngay = nhuan ? 29 : 28; break;\n    default: ngay = -1;\n}","h":[["BT 3.1.1 – Phân loại điểm","Nhập điểm 0–10, in xếp loại Giỏi/Khá/Trung bình/Yếu; điểm ngoài khoảng báo lỗi. Đạt khi: kiểm thử đủ các biên 4, 5, 6.5, 8, 9, -1, 11."],["BT 3.1.2 – Máy tính 4 phép","Nhập a, toán tử, b; dùng switch tính kết quả, chia cho 0 báo lỗi. Đạt khi: 5 phép thử gồm cả chia cho 0 và toán tử lạ."]]},{"t":"Bài 3.2 – Vòng lặp for, while, do-while","m":"60 phút","g":"Chọn vòng lặp đúng; tránh lỗi lệch một đơn vị và vòng lặp vô hạn.","k":["for, while, do-while và khi nào dùng loại nào","break, continue, vòng lặp lồng nhau; thoát nhiều tầng bằng cờ hoặc hàm","Bất biến vòng lặp (loop invariant) để chứng minh đúng","Lỗi off-by-one: < n hay <= n","Biến đếm kiểu size_t và cạm bẫy khi đếm ngược"],"e":"for (int i = 1; i <= 5; i++) {\n    for (int j = 1; j <= i; j++) putchar('*');\n    putchar('\\n');\n}","h":[["BT 3.2.1 – Số nguyên tố","In tất cả số nguyên tố nhỏ hơn N, tối ưu đến căn bậc hai. Đạt khi: N=100 cho 25 số, N=2 cho 0 số."],["BT 3.2.2 – Đoán số","Máy chọn ngẫu nhiên 1–100, người chơi đoán, báo cao/thấp, giới hạn 7 lần. Đạt khi: kết thúc đúng khi thắng hoặc hết lượt và in số lần đã đoán."]]}]}],"pj":["Bài kiểm tra cuối vùng 1: Chương trình \"Quản lý điểm lớp\" dạng menu dòng lệnh – nhập điểm n sinh viên, tính trung bình, xếp loại, tìm điểm cao nhất/thấp nhất; không dùng biến toàn cục; không có cảnh báo khi biên dịch -Wall -Wextra. Thời lượng làm: 3 giờ."]},{"n":"Hàm, mảng và chuỗi","ch":[{"t":"Chương 4: Hàm và phạm vi biến","ls":[{"t":"Bài 4.1 – Định nghĩa, nguyên mẫu và truyền tham số","m":"60 phút","g":"Thiết kế hàm nhỏ, một nhiệm vụ; hiểu truyền theo giá trị.","k":["Nguyên mẫu hàm (prototype) và vì sao cần; tệp tiêu đề .h","Truyền theo giá trị: hàm nhận bản sao, không đổi được biến gốc","Giá trị trả về, void, hàm không tham số: int f(void)","Phạm vi: cục bộ, toàn cục, static trong hàm, vòng đời biến","Quy tắc đặt tên động từ, hàm dài tối đa khoảng 30 dòng"],"e":"int max2(int a, int b) { return a > b ? a : b; }\n\nvoid doi_sai(int a, int b) {   // chi doi ban sao\n    int t = a; a = b; b = t;\n}","h":[["BT 4.1.1 – Thư viện toán nhỏ","Viết các hàm gcd, lcm, is_prime, factorial trong math_utils.c/.h. Đạt khi: main kiểm thử bằng assert và mọi assert qua."],["BT 4.1.2 – Chứng minh truyền theo giá trị","Viết chương trình chứng minh hàm doi_sai không đổi được biến gốc, giải thích bằng sơ đồ bộ nhớ. Đạt khi: có đầu ra in địa chỉ biến trong main và trong hàm khác nhau."]]},{"t":"Bài 4.2 – Đệ quy","m":"60 phút","g":"Viết đệ quy có điểm dừng; hiểu chi phí ngăn xếp và khi nào chuyển sang vòng lặp.","k":["Điểm dừng và bước đệ quy; cây gọi hàm","Ngăn xếp gọi hàm (call stack) và tràn ngăn xếp","Ví dụ: giai thừa, Fibonacci, tháp Hà Nội, tìm kiếm nhị phân","Đệ quy đuôi và khử đệ quy bằng vòng lặp","Độ phức tạp thời gian của Fibonacci đệ quy ngây thơ và cách ghi nhớ kết quả"],"e":"unsigned long long fib(int n, unsigned long long *memo) {\n    if (n < 2) return n;\n    if (memo[n]) return memo[n];\n    return memo[n] = fib(n-1, memo) + fib(n-2, memo);\n}","h":[["BT 4.2.1 – Tháp Hà Nội","In các bước chuyển đĩa cho n đĩa. Đạt khi: n=3 cho đúng 7 bước và n=10 cho 1023 bước."],["BT 4.2.2 – Fibonacci có ghi nhớ","So sánh thời gian fib(40) đệ quy thuần và có ghi nhớ. Đạt khi: nộp bảng thời gian đo bằng clock() và nhận xét."]]}]},{"t":"Chương 5: Mảng một chiều và nhiều chiều","ls":[{"t":"Bài 5.1 – Mảng một chiều và các thuật toán cơ bản","m":"75 phút","g":"Khai báo, duyệt, tìm kiếm, sắp xếp; tránh truy cập ngoài biên.","k":["Khai báo, khởi tạo, sizeof(mảng)/sizeof(phần tử) và giới hạn","Mảng là vùng nhớ liên tiếp; chỉ số từ 0; truy cập ngoài biên là UB","Mảng truyền vào hàm bị suy biến thành con trỏ: luôn truyền kèm độ dài","Tìm kiếm tuyến tính, tìm kiếm nhị phân, sắp xếp chọn và chèn","Dùng qsort của thư viện chuẩn với hàm so sánh"],"e":"int cmp(const void *a, const void *b) {\n    int x = *(const int *)a, y = *(const int *)b;\n    return (x > y) - (x < y);\n}\nqsort(arr, n, sizeof arr[0], cmp);","h":[["BT 5.1.1 – Thống kê mảng","Nhập n số, tính min, max, trung bình, trung vị. Đạt khi: n=1, n chẵn, n lẻ đều đúng."],["BT 5.1.2 – Xóa trùng","Viết hàm loại phần tử trùng trong mảng, trả về độ dài mới. Đạt khi: {1,2,2,3,1} → {1,2,3} và không truy cập ngoài biên."]]},{"t":"Bài 5.2 – Mảng hai chiều và ma trận","m":"60 phút","g":"Làm việc với ma trận; hiểu bố cục theo hàng trong bộ nhớ.","k":["Khai báo int m[R][C], duyệt theo hàng và theo cột, ảnh hưởng đến bộ nhớ đệm","Truyền mảng 2 chiều vào hàm: void f(int r, int c, int m[r][c])","Cộng, nhân ma trận, chuyển vị, tìm đường chéo","Mảng nhiều chiều thực chất là mảng của mảng","Kiểm tra kích thước hợp lệ trước khi nhân"],"e":"for (int i = 0; i < n; i++)\n  for (int j = 0; j < p; j++) {\n    c[i][j] = 0;\n    for (int k = 0; k < m; k++) c[i][j] += a[i][k] * b[k][j];\n  }","h":[["BT 5.2.1 – Nhân ma trận","Cài hàm nhân hai ma trận bất kỳ có kiểm tra điều kiện kích thước. Đạt khi: nhân ma trận đơn vị trả đúng ma trận gốc, kích thước không khớp báo lỗi."],["BT 5.2.2 – Xoay ma trận","Xoay ma trận vuông n×n 90 độ tại chỗ. Đạt khi: n=3 và n=4 cho kết quả đúng, không dùng mảng phụ."]]}]},{"t":"Chương 6: Chuỗi ký tự kiểu C","ls":[{"t":"Bài 6.1 – Chuỗi và ký tự kết thúc '\\0'","m":"60 phút","g":"Hiểu chuỗi là mảng char kết thúc bằng 0; dùng thư viện string.h an toàn.","k":["Chuỗi là mảng char có '\\0' ở cuối; strlen không tính ký tự kết thúc","strcpy/strcat không kiểm tra biên: dùng snprintf, strncpy kèm gán '\\0' hoặc các hàm tự viết có độ dài","strcmp, strchr, strstr, strtok (và vì sao strtok không an toàn luồng)","Chuỗi hằng là vùng chỉ đọc: sửa nội dung là UB","Tự cài strlen, strcpy, strcmp để hiểu cơ chế"],"e":"size_t my_strlen(const char *s) {\n    size_t n = 0;\n    while (s[n] != '\\0') n++;\n    return n;\n}\nchar buf[16];\nsnprintf(buf, sizeof buf, \"ID-%04d\", 42);","h":[["BT 6.1.1 – Đảo chuỗi","Viết hàm đảo chuỗi tại chỗ. Đạt khi: \"abc\" → \"cba\", chuỗi rỗng và chuỗi 1 ký tự không lỗi."],["BT 6.1.2 – Đếm từ","Đếm số từ trong câu có nhiều khoảng trắng liên tiếp. Đạt khi: \"  xin  chao  C  \" → 3 từ."]]},{"t":"Bài 6.2 – Xử lý văn bản thực tế","m":"60 phút","g":"Phân tích văn bản theo dòng, tách trường, chuẩn hóa dữ liệu.","k":["Đọc từng dòng bằng fgets và xử lý dòng dài hơn bộ đệm","Tách trường bằng strtok_r hoặc con trỏ thủ công","Chuẩn hóa: bỏ khoảng trắng đầu/cuối, đổi hoa/thường bằng ctype.h","Kiểm tra định dạng email/số điện thoại bằng máy trạng thái đơn giản","Quy ước xử lý UTF-8: byte, không phải ký tự"],"e":"void trim(char *s) {\n    char *start = s; while (isspace((unsigned char)*start)) start++;\n    char *end = start + strlen(start);\n    while (end > start && isspace((unsigned char)end[-1])) end--;\n    *end = '\\0';\n    memmove(s, start, (size_t)(end - start) + 1);\n}","h":[["BT 6.2.1 – Chuẩn hóa tên","Viết hàm đưa \"  nGUYỄN  văn   a \" về dạng viết hoa chữ cái đầu mỗi từ, chỉ một khoảng trắng. Đạt khi: ca thử với nhiều khoảng trắng và chuỗi rỗng đều đúng."],["BT 6.2.2 – Kiểm tra email","Viết hàm kiểm tra email có đúng một @, phần trước và sau không rỗng, phần sau có dấu chấm. Đạt khi: 10 ca thử hợp lệ và không hợp lệ cho kết quả đúng."]]}]}],"pj":["Bài kiểm tra cuối vùng 2: Thư viện xử lý chuỗi mini (mystring.c/.h) gồm 10 hàm tự cài (strlen, strcpy, strcat, strcmp, strchr, strstr, reverse, trim, to_upper, split) kèm 40 ca thử tự động; chạy sạch dưới AddressSanitizer. Thời lượng làm: 4 giờ."]},{"n":"Con trỏ và bộ nhớ động","ch":[{"t":"Chương 7: Con trỏ cơ bản","ls":[{"t":"Bài 7.1 – Địa chỉ, con trỏ và giải tham chiếu","m":"60 phút","g":"Hiểu con trỏ là biến chứa địa chỉ; dùng & và * đúng cách.","k":["Địa chỉ biến, toán tử &, khai báo int *p, giải tham chiếu *p","Con trỏ NULL và luôn kiểm tra trước khi giải tham chiếu","Truyền con trỏ vào hàm để thay đổi biến gốc (mô phỏng truyền tham chiếu)","Con trỏ const: const int *p và int *const p khác nhau thế nào","Con trỏ treo (dangling) và con trỏ chưa khởi tạo"],"e":"void swap(int *a, int *b) {\n    int t = *a; *a = *b; *b = t;\n}\nint x = 1, y = 2;\nswap(&x, &y);   // x=2, y=1","h":[["BT 7.1.1 – Hoán vị và nhiều giá trị trả về","Viết hàm minmax(const int *a, size_t n, int *min, int *max). Đạt khi: n=1 cho min=max và n=0 trả mã lỗi."],["BT 7.1.2 – Vẽ sơ đồ bộ nhớ","Cho đoạn mã 10 dòng dùng con trỏ, vẽ sơ đồ ô nhớ và địa chỉ từng bước. Đạt khi: sơ đồ khớp với giá trị in thực tế khi chạy."]]},{"t":"Bài 7.2 – Số học con trỏ và mảng","m":"60 phút","g":"Duyệt mảng bằng con trỏ; hiểu a[i] tương đương *(a+i).","k":["Cộng con trỏ với số nguyên được nhân theo kích thước kiểu","Tên mảng suy biến thành con trỏ tới phần tử đầu; sự khác nhau giữa mảng và con trỏ","Trừ hai con trỏ cùng mảng cho ra số phần tử","Con trỏ void * và ép kiểu; khi nào cần","Con trỏ tới phần tử cuối (one-past-the-end) hợp lệ để so sánh"],"e":"int sum(const int *begin, const int *end) {\n    int s = 0;\n    for (const int *p = begin; p != end; p++) s += *p;\n    return s;\n}\n// sum(a, a + n)","h":[["BT 7.2.1 – Đảo mảng bằng hai con trỏ","Đảo mảng chỉ dùng con trỏ đầu và cuối. Đạt khi: độ dài chẵn, lẻ và 0 đều đúng."],["BT 7.2.2 – Tự cài memcpy và memmove","Viết my_memcpy, my_memmove xử lý vùng chồng lấn. Đạt khi: ca thử chồng lấn xuôi và ngược cho kết quả như memmove chuẩn."]]}]},{"t":"Chương 8: Cấp phát bộ nhớ động","ls":[{"t":"Bài 8.1 – malloc, calloc, realloc, free","m":"75 phút","g":"Cấp phát và giải phóng đúng; không rò rỉ, không giải phóng hai lần.","k":["Stack và heap; vòng đời vùng nhớ cấp phát động","malloc/calloc/realloc/free và luôn kiểm tra kết quả NULL","realloc an toàn: gán vào con trỏ tạm rồi mới cập nhật","Quy tắc sở hữu: ai cấp phát, ai giải phóng; ghi chú trong tài liệu hàm","Các lỗi kinh điển: rò rỉ, free hai lần, dùng sau free, ghi ngoài biên"],"e":"int *a = malloc(n * sizeof *a);\nif (!a) return -1;\nint *tmp = realloc(a, 2 * n * sizeof *a);\nif (!tmp) { free(a); return -1; }\na = tmp;\n/* ... */\nfree(a); a = NULL;","h":[["BT 8.1.1 – Mảng tăng trưởng","Cài vector động (push_back, pop_back, free) tăng dung lượng gấp đôi. Đạt khi: thêm 1 triệu phần tử, valgrind báo 0 byte rò rỉ."],["BT 8.1.2 – Tìm lỗi","Cho sẵn chương trình có 5 lỗi bộ nhớ, tìm và sửa bằng valgrind/ASan. Đạt khi: báo cáo nêu rõ từng lỗi, dòng gây lỗi và cách sửa."]]},{"t":"Bài 8.2 – Mảng động hai chiều và chuỗi động","m":"60 phút","g":"Cấp phát ma trận và mảng chuỗi; giải phóng theo thứ tự ngược.","k":["Mảng con trỏ tới hàng (int **) so với một khối liên tiếp r*c","Cấp phát một khối và tự tính chỉ số: m[i*c + j]","Sao chép chuỗi động bằng strdup (hoặc tự cài) và trách nhiệm giải phóng","Giải phóng đầy đủ khi cấp phát thất bại giữa chừng","Con trỏ hàm trả về vùng nhớ động: quy ước tài liệu hóa"],"e":"int *m = calloc((size_t)r * c, sizeof *m);\nm[i * c + j] = 5;\nfree(m);","h":[["BT 8.2.1 – Ma trận động","Viết matrix_new, matrix_free, matrix_mul với ma trận một khối liên tiếp. Đạt khi: nhân ma trận 500×500 không lỗi bộ nhớ."],["BT 8.2.2 – Danh sách từ","Đọc tệp văn bản, lưu từng từ vào mảng chuỗi động, sắp xếp và in. Đạt khi: tệp 10.000 từ chạy sạch dưới valgrind."]]}]},{"t":"Chương 9: Con trỏ nâng cao","ls":[{"t":"Bài 9.1 – Con trỏ hàm và callback","m":"60 phút","g":"Truyền hành vi vào hàm; hiểu cách qsort hoạt động.","k":["Khai báo và dùng con trỏ hàm; typedef cho dễ đọc","Callback: hàm so sánh, hàm xử lý phần tử","Bảng con trỏ hàm thay chuỗi switch (dispatch table)","Con trỏ void * làm ngữ cảnh người dùng truyền kèm callback","Tự cài hàm map/filter cho mảng int"],"e":"typedef int (*binop)(int, int);\nint add(int a, int b) { return a + b; }\nint mul(int a, int b) { return a * b; }\nbinop ops[] = { add, mul };\nprintf(\"%d\\n\", ops[1](3, 4));   // 12","h":[["BT 9.1.1 – Máy tính bằng bảng hàm","Cài máy tính 4 phép bằng bảng con trỏ hàm thay switch. Đạt khi: thêm phép lũy thừa chỉ cần thêm một dòng vào bảng."],["BT 9.1.2 – Sắp xếp tổng quát","Tự cài hàm sắp xếp chèn tổng quát (void *, size, cmp). Đạt khi: sắp xếp được int, double, chuỗi với cùng một hàm."]]},{"t":"Bài 9.2 – Con trỏ tới con trỏ, kiểu struct và độ căn chỉnh","m":"60 phút","g":"Dùng con trỏ cấp hai đúng cách; hiểu bố cục struct trong bộ nhớ.","k":["Con trỏ cấp hai: khi hàm cần cấp phát và trả về con trỏ qua tham số","Sizeof struct, padding và căn chỉnh; offsetof","Con trỏ tới struct và toán tử ->","Cấu trúc tự trỏ: nền tảng cho danh sách liên kết","Quy tắc strict aliasing và vì sao tránh ép kiểu tùy tiện"],"e":"int tao_mang(size_t n, int **out) {\n    *out = malloc(n * sizeof **out);\n    return *out ? 0 : -1;\n}","h":[["BT 9.2.1 – Đo padding","Khai báo 3 struct cùng trường nhưng khác thứ tự, in sizeof và offsetof. Đạt khi: giải thích vì sao kích thước khác nhau và đề xuất thứ tự tiết kiệm nhất."],["BT 9.2.2 – Hàm tạo mảng","Viết hàm đọc n số từ tệp, cấp phát và trả mảng qua int **. Đạt khi: tệp lỗi giữa chừng không rò rỉ bộ nhớ."]]}]}],"pj":["Bài kiểm tra cuối vùng 3: Cài thư viện \"vector động + sắp xếp tổng quát + tìm kiếm\" (dynarray.c/.h) có hàm tạo, hủy, thêm, xóa, sắp xếp bằng callback; 30 ca thử; valgrind báo 0 lỗi. Thời lượng làm: 5 giờ."]},{"n":"Cấu trúc dữ liệu tự cài và làm việc với tệp","ch":[{"t":"Chương 10: Danh sách liên kết, ngăn xếp và hàng đợi","ls":[{"t":"Bài 10.1 – Danh sách liên kết đơn","m":"75 phút","g":"Cài đặt danh sách liên kết đơn an toàn bộ nhớ với các thao tác thêm, xóa, tìm, đảo.","k":["Nút (node) gồm dữ liệu và con trỏ next; con trỏ head","Thêm đầu, thêm cuối, chèn sau nút, xóa theo giá trị, giải phóng toàn bộ","Duyệt bằng vòng lặp; tránh truy cập NULL","Đảo ngược danh sách tại chỗ bằng ba con trỏ","Độ phức tạp: thêm đầu O(1), tìm O(n); khi nào nên dùng mảng thay thế"],"e":"typedef struct Node { int v; struct Node *next; } Node;\n\nNode *push_front(Node *h, int v) {\n    Node *n = malloc(sizeof *n);\n    if (!n) return h;\n    n->v = v; n->next = h;\n    return n;\n}\n\nNode *reverse(Node *h) {\n    Node *prev = NULL;\n    while (h) { Node *nx = h->next; h->next = prev; prev = h; h = nx; }\n    return prev;\n}","h":[["BT 10.1.1 – Thư viện list","Viết list.h/list.c với push_front, push_back, remove_value, find, free_all. Đạt khi: 15 ca thử đúng và valgrind báo 0 lỗi."],["BT 10.1.2 – Phát hiện chu trình","Cài thuật toán rùa và thỏ để phát hiện vòng trong danh sách. Đạt khi: nhận diện đúng danh sách có và không có vòng, kể cả danh sách rỗng và 1 nút."]]},{"t":"Bài 10.2 – Ngăn xếp (stack) và hàng đợi (queue)","m":"60 phút","g":"Cài stack bằng mảng động và queue vòng; áp dụng vào bài toán thực tế.","k":["Stack LIFO: push, pop, peek; cài bằng mảng động hoặc danh sách liên kết","Queue FIFO: enqueue, dequeue; hàng đợi vòng (circular buffer) với chỉ số head, tail","Xử lý tràn, rỗng và trả mã lỗi rõ ràng","Ứng dụng stack: kiểm tra ngoặc cân bằng, tính biểu thức hậu tố","Ứng dụng queue: xử lý tác vụ theo thứ tự, duyệt theo chiều rộng"],"e":"typedef struct { int *a; size_t n, cap; } Stack;\n\nint st_push(Stack *s, int v) {\n    if (s->n == s->cap) {\n        size_t nc = s->cap ? s->cap * 2 : 4;\n        int *t = realloc(s->a, nc * sizeof *t);\n        if (!t) return -1;\n        s->a = t; s->cap = nc;\n    }\n    s->a[s->n++] = v;\n    return 0;\n}","h":[["BT 10.2.1 – Ngoặc cân bằng","Kiểm tra chuỗi chứa ()[]{} có cân bằng không bằng stack. Đạt khi: đúng với 10 chuỗi thử gồm cả chuỗi rỗng và chuỗi lệch."],["BT 10.2.2 – Máy tính hậu tố","Đọc biểu thức hậu tố như \"3 4 + 2 *\" và tính giá trị. Đạt khi: báo lỗi đúng khi thiếu toán hạng hoặc chia cho 0."]]}]},{"t":"Chương 11: Cây nhị phân và bảng băm","ls":[{"t":"Bài 11.1 – Cây nhị phân tìm kiếm (BST)","m":"90 phút","g":"Cài BST với thêm, tìm, xóa và duyệt; hiểu vì sao cây mất cân bằng chậm.","k":["Định nghĩa BST: trái nhỏ hơn, phải lớn hơn","Thêm và tìm bằng đệ quy và vòng lặp","Ba kiểu duyệt: trước, giữa, sau; duyệt giữa cho dãy tăng","Xóa nút: ba trường hợp 0, 1, 2 con","Độ cao cây: trung bình O(log n), xấu nhất O(n); giới thiệu cây cân bằng AVL, đỏ-đen"],"e":"typedef struct T { int k; struct T *l, *r; } T;\n\nT *insert(T *t, int k) {\n    if (!t) { t = calloc(1, sizeof *t); if (t) t->k = k; return t; }\n    if (k < t->k) t->l = insert(t->l, k);\n    else if (k > t->k) t->r = insert(t->r, k);\n    return t;\n}\n\nvoid inorder(const T *t) {\n    if (!t) return;\n    inorder(t->l); printf(\"%d \", t->k); inorder(t->r);\n}","h":[["BT 11.1.1 – BST đầy đủ","Cài insert, find, remove, height, free_tree. Đạt khi: sau 1000 thao tác ngẫu nhiên, duyệt giữa luôn tăng dần và valgrind sạch."],["BT 11.1.2 – Đo độ cao","Chèn 10.000 số ngẫu nhiên và 10.000 số tăng dần, in độ cao. Đạt khi: giải thích bằng văn bản vì sao hai độ cao khác nhau rất xa."]]},{"t":"Bài 11.2 – Bảng băm (hash table)","m":"90 phút","g":"Cài bảng băm xử lý va chạm bằng chaining và tự động mở rộng.","k":["Hàm băm cho chuỗi (djb2, FNV-1a); phân phối đều và tính tất định","Va chạm và hai cách xử lý: chaining, open addressing","Hệ số tải (load factor) và rehash khi vượt 0.75","Độ phức tạp trung bình O(1), xấu nhất O(n)","Sở hữu bộ nhớ: bảng có sao chép khóa không, ai giải phóng"],"e":"static unsigned long djb2(const char *s) {\n    unsigned long h = 5381;\n    for (; *s; s++) h = h * 33 + (unsigned char)*s;\n    return h;\n}\n// bucket = djb2(key) % cap","h":[["BT 11.2.1 – Đếm tần suất từ","Đọc một tệp văn bản, dùng bảng băm đếm số lần xuất hiện của mỗi từ, in 10 từ nhiều nhất. Đạt khi: chạy được trên tệp 1 MB dưới 1 giây."],["BT 11.2.2 – Rehash","Thêm tự động mở rộng khi load factor > 0.75. Đạt khi: kiểm thử chứng minh mọi khóa vẫn tìm được sau khi mở rộng."]]}]},{"t":"Chương 12: Tệp và đầu vào/đầu ra","ls":[{"t":"Bài 12.1 – Đọc và ghi tệp văn bản","m":"60 phút","g":"Đọc ghi tệp văn bản an toàn, kiểm tra mọi lỗi I/O.","k":["fopen, fclose và các chế độ \"r\", \"w\", \"a\", \"r+\"","fgets đọc theo dòng an toàn thay cho gets; fprintf, fscanf","Kiểm tra giá trị trả về của mọi hàm I/O; dùng perror và errno","Buffering, fflush; ghi tệp tạm rồi đổi tên để tránh hỏng dữ liệu","Phân tích dòng CSV đơn giản bằng strtok hoặc tự tách"],"e":"FILE *f = fopen(\"data.txt\", \"r\");\nif (!f) { perror(\"fopen\"); return 1; }\nchar line[256];\nwhile (fgets(line, sizeof line, f)) {\n    line[strcspn(line, \"\\n\")] = 0;\n    puts(line);\n}\nfclose(f);","h":[["BT 12.1.1 – Đếm dòng, từ, ký tự","Cài lại lệnh wc đơn giản. Đạt khi: kết quả trùng lệnh wc trên 3 tệp thử."],["BT 12.1.2 – Sổ điểm CSV","Đọc tệp CSV (tên, điểm), in trung bình, cao nhất, thấp nhất và ghi báo cáo ra tệp mới. Đạt khi: bỏ qua dòng lỗi và báo số dòng lỗi."]]},{"t":"Bài 12.2 – Tệp nhị phân và lưu trữ có cấu trúc","m":"75 phút","g":"Lưu và nạp struct bằng tệp nhị phân; hiểu rủi ro về tính tương thích.","k":["fread, fwrite, fseek, ftell, rewind","Ghi struct nguyên khối và hạn chế: padding, endianness, kích thước kiểu","Thiết kế định dạng có tiêu đề: magic number, phiên bản, số bản ghi","Cập nhật bản ghi tại chỗ bằng fseek","So sánh với định dạng văn bản: dễ đọc hơn nhưng chậm hơn"],"e":"typedef struct { char name[32]; int32_t score; } Rec;\n\nint save(const char *p, const Rec *a, size_t n) {\n    FILE *f = fopen(p, \"wb\");\n    if (!f) return -1;\n    uint32_t magic = 0x52454331, cnt = (uint32_t)n;\n    fwrite(&magic, sizeof magic, 1, f);\n    fwrite(&cnt, sizeof cnt, 1, f);\n    fwrite(a, sizeof *a, n, f);\n    return fclose(f);\n}","h":[["BT 12.2.1 – Sổ liên lạc nhị phân","Lưu danh bạ ra tệp nhị phân có tiêu đề và nạp lại. Đạt khi: tệp sai magic bị từ chối với thông báo rõ ràng."],["BT 12.2.2 – Sửa bản ghi","Cho phép sửa điểm của bản ghi thứ k bằng fseek mà không ghi lại toàn tệp. Đạt khi: các bản ghi khác không bị thay đổi."]]}]}],"pj":["Bài kiểm tra cuối vùng 4: Xây ứng dụng \"Từ điển\" dòng lệnh: nạp từ điển từ tệp CSV vào bảng băm, tìm, thêm, xóa từ và lưu lại; có BST để liệt kê theo thứ tự chữ cái. Yêu cầu valgrind 0 lỗi và 20 ca thử tự động. Thời lượng làm: 6 giờ."]},{"n":"Biên dịch, build và gỡ lỗi","ch":[{"t":"Chương 13: Tổ chức dự án nhiều tệp","ls":[{"t":"Bài 13.1 – Tệp header, nhiều tệp nguồn và Makefile","m":"75 phút","g":"Chia dự án thành nhiều module, build bằng Makefile.","k":["Khai báo trong .h, định nghĩa trong .c; include guard hoặc #pragma once","Biên dịch tách rời từng .c thành .o rồi liên kết","Từ khóa static để giới hạn phạm vi trong tệp; extern cho biến toàn cục","Makefile: target, dependency, recipe, biến, quy tắc mẫu %.o: %.c","Cờ -MMD -MP để tự theo dõi phụ thuộc header"],"e":"CC=gcc\nCFLAGS=-std=c17 -Wall -Wextra -g -MMD -MP\nOBJ=main.o list.o\napp: $(OBJ)\n\t$(CC) $(OBJ) -o app\n%.o: %.c\n\t$(CC) $(CFLAGS) -c $< -o $@\n-include $(OBJ:.o=.d)\nclean:\n\trm -f app *.o *.d","h":[["BT 13.1.1 – Tách module","Tách bài danh sách liên kết thành list.h, list.c, main.c và viết Makefile. Đạt khi: sửa một header thì chỉ các tệp phụ thuộc được biên dịch lại."],["BT 13.1.2 – Mục tiêu phụ","Thêm target test chạy bộ kiểm thử và target clean. Đạt khi: make test trả mã khác 0 khi có ca sai."]]},{"t":"Bài 13.2 – Thư viện tĩnh, thư viện động và CMake cơ bản","m":"60 phút","g":"Đóng gói mã thành thư viện và build bằng CMake.","k":["Thư viện tĩnh .a bằng ar; thư viện động .so với -fPIC -shared","Cách liên kết: -L, -l và biến LD_LIBRARY_PATH","CMakeLists.txt tối thiểu: project, add_executable, add_library, target_link_libraries","Build ngoài cây nguồn: cmake -S . -B build","Giới thiệu CTest để chạy kiểm thử"],"e":"cmake_minimum_required(VERSION 3.20)\nproject(demo C)\nset(CMAKE_C_STANDARD 17)\nadd_library(mylist list.c)\nadd_executable(app main.c)\ntarget_link_libraries(app PRIVATE mylist)\nenable_testing()\nadd_test(NAME basic COMMAND app)","h":[["BT 13.2.1 – Thư viện tĩnh","Đóng gói list.c thành libmylist.a và liên kết vào chương trình. Đạt khi: build thành công bằng lệnh gcc thủ công và bằng CMake."],["BT 13.2.2 – Thư viện động","Tạo libmylist.so và chạy chương trình dùng nó. Đạt khi: giải thích được lỗi khi không đặt LD_LIBRARY_PATH."]]}]},{"t":"Chương 14: Gỡ lỗi và công cụ phân tích","ls":[{"t":"Bài 14.1 – Gỡ lỗi với gdb","m":"75 phút","g":"Dùng gdb tìm nguyên nhân lỗi segfault và logic.","k":["Biên dịch với -g -O0; chạy gdb ./app","Lệnh: break, run, next, step, continue, print, bt, frame, watch, info locals","Điều kiện breakpoint và watchpoint cho biến bị ghi sai","Phân tích core dump: ulimit -c unlimited, gdb app core","Quy trình: tái hiện ổn định, thu hẹp, giả thuyết, kiểm chứng"],"e":"$ gcc -g -O0 bug.c -o bug\n$ gdb ./bug\n(gdb) break process\n(gdb) run\n(gdb) bt\n(gdb) print *node\n(gdb) watch node->count\n(gdb) continue","h":[["BT 14.1.1 – Săn lỗi segfault","Được giao 3 chương trình có lỗi con trỏ. Dùng gdb tìm dòng gây lỗi. Đạt khi: nộp bản ghi lệnh gdb và nguyên nhân gốc cho từng chương trình."],["BT 14.1.2 – Watchpoint","Tìm điểm làm biến đếm bị ghi đè bất thường. Đạt khi: chỉ ra chính xác dòng ghi sai."]]},{"t":"Bài 14.2 – Sanitizer, valgrind và phân tích tĩnh","m":"75 phút","g":"Phát hiện rò rỉ, tràn bộ đệm và hành vi không xác định bằng công cụ.","k":["AddressSanitizer: -fsanitize=address để bắt tràn heap, stack, use-after-free","UndefinedBehaviorSanitizer: bắt tràn số có dấu, chia 0, dịch bit sai","Valgrind memcheck: rò rỉ và đọc bộ nhớ chưa khởi tạo","Phân tích tĩnh: cppcheck, clang-tidy, -fanalyzer","Đưa các công cụ này vào CI để chặn lỗi sớm"],"e":"gcc -std=c17 -g -O1 -fsanitize=address,undefined -fno-omit-frame-pointer a.c -o a\n./a\nvalgrind --leak-check=full --error-exitcode=1 ./app","h":[["BT 14.2.1 – Bảy lỗi kinh điển","Cho 7 đoạn mã lỗi (tràn mảng, use-after-free, double free, rò rỉ, chưa khởi tạo, tràn số, free sai con trỏ). Đạt khi: mỗi lỗi được công cụ phù hợp phát hiện và nộp ảnh chụp kết quả."],["BT 14.2.2 – Làm sạch dự án","Chạy sanitizer và valgrind trên dự án từ vùng 3. Đạt khi: 0 lỗi, 0 rò rỉ và có báo cáo."]]}]},{"t":"Chương 15: Chất lượng mã và đồ án tổng kết","ls":[{"t":"Bài 15.1 – Kiểm thử đơn vị và quy ước mã","m":"60 phút","g":"Viết kiểm thử tự động và áp dụng quy ước mã nhất quán.","k":["Viết macro assert tự chế hoặc dùng thư viện Unity/Check để kiểm thử","Thiết kế hàm dễ kiểm thử: ít phụ thuộc, trả mã lỗi rõ","Quy ước đặt tên, độ dài hàm, chú thích có ích","Định dạng bằng clang-format; bật cảnh báo nghiêm ngặt","Kiểm tra giá trị biên: rỗng, một phần tử, đầy, tràn"],"e":"#define CHECK(c) do { if (!(c)) { fprintf(stderr, \"FAIL %s:%d %s\\n\", __FILE__, __LINE__, #c); fails++; } } while (0)","h":[["BT 15.1.1 – Bộ kiểm thử list","Viết ít nhất 20 ca kiểm thử cho thư viện list gồm các ca biên. Đạt khi: make test chạy tự động và báo tổng số ca đạt."],["BT 15.1.2 – Rà soát mã","Hoán đổi mã với một bạn và rà soát theo danh sách 10 mục. Đạt khi: nộp danh sách lỗi và bản sửa."]]},{"t":"Bài 15.2 – Đồ án tổng kết: trình quản lý dữ liệu dòng lệnh","m":"4 giờ","g":"Hoàn thành một dự án C nhiều module theo chuẩn chất lượng.","k":["Yêu cầu: nhiều module, Makefile hoặc CMake, kiểm thử, README","Cấu trúc dữ liệu tự cài: bảng băm hoặc cây","Lưu trữ bền vững bằng tệp có tiêu đề và phiên bản","Sạch sanitizer và valgrind, không cảnh báo với -Wall -Wextra","Trình bày: demo 5 phút và giải thích lựa chọn thiết kế"],"e":"","h":[["BT 15.2.1 – Ứng dụng quản lý","Chọn một đề: quản lý sinh viên, kho hàng hoặc ghi chú. Đạt khi: đủ thêm, sửa, xóa, tìm, lưu, nạp; ít nhất 30 ca thử đạt."],["BT 15.2.2 – Báo cáo kỹ thuật","Viết README mô tả kiến trúc, cách build, hạn chế đã biết. Đạt khi: người khác build và chạy được chỉ bằng README."]]}]}],"pj":["Bài kiểm tra cuối vùng 5: Nhận một dự án 3 module có sẵn 5 lỗi cố ý, tìm và sửa hết bằng gdb, sanitizer, valgrind trong 3 giờ; nộp nhật ký gỡ lỗi từng lỗi (triệu chứng, công cụ, nguyên nhân, cách sửa)."]}]},{"id":"cpp","name":"C++ hiện đại","tag":"RAII, smart pointer, move, template, STL, đa luồng","level":"Trung cấp → Nâng cao","time":"10–12 tuần (6–8 giờ/tuần)","code":"code-cpp","who":"Người đã nắm C hoặc một ngôn ngữ hướng đối tượng, muốn viết mã hiệu năng cao và an toàn theo chuẩn C++17/20.","pre":["Nắm cơ bản C hoặc Java","Hiểu con trỏ và bộ nhớ","Cài g++/clang++ hỗ trợ C++20 và CMake"],"map":[{"t":"Giai đoạn 1 – Ngôn ngữ cốt lõi","w":"Tuần 1–4","g":"Viết được lớp có vòng đời đối tượng đúng và chương trình nhiều tệp.","i":["Tham chiếu, const, auto, range-for, structured binding","Lớp, constructor, destructor, quy tắc 0/3/5","Kế thừa, hàm ảo, đa hình, không gian tên, header"],"o":"Thư viện nhỏ (vector hoặc string tự cài) có bộ kiểm thử và build bằng CMake."},{"t":"Giai đoạn 2 – Tư duy C++ hiện đại","w":"Tuần 5–8","g":"Quản lý tài nguyên an toàn bằng RAII và smart pointer, không dùng new/delete trần.","i":["RAII, unique_ptr, shared_ptr, weak_ptr","Move semantics, perfect forwarding","Lambda, std::function, optional, variant, string_view, span"],"o":"Chương trình quản lý tài nguyên (tệp, kết nối) không rò rỉ, chạy sạch dưới sanitizers."},{"t":"Giai đoạn 3 – Tổng quát hóa và đồng thời","w":"Tuần 9–12","g":"Viết mã tổng quát bằng template và concepts, chương trình đa luồng không có data race.","i":["Template, concepts, constexpr","STL, algorithm, ranges","thread/jthread, mutex, condition_variable, atomic, future"],"o":"Dự án cuối khóa: thread pool hoặc trình xử lý log đa luồng, có kiểm thử và chạy sạch ThreadSanitizer."}],"areas":[{"n":"Lớp, đối tượng và vòng đời","d":"Hiểu khi nào đối tượng được tạo, sao chép, di chuyển và hủy để thiết kế lớp an toàn.","p":["Constructor, destructor, danh sách khởi tạo thành viên","Quy tắc 0/3/5: khi nào cần tự viết sao chép và di chuyển","Đóng gói, const đúng chỗ, toán tử nạp chồng hợp lý","Kế thừa, hàm ảo, destructor ảo, override/final","Tách khai báo và định nghĩa, header guard"],"x":[["Bài 1 – Cơ bản: Lớp Fraction","Cài phân số với cộng, trừ, nhân, chia, rút gọn và toán tử <<. Đạt khi: có test cho mẫu số 0 và số âm."],["Bài 2 – Nâng cao: Vector tự cài","Cài MyVector<int> với copy, move, push_back, tăng dung lượng gấp đôi. Đạt khi: không rò rỉ và so sánh kết quả với std::vector trên 1.000 thao tác ngẫu nhiên."]]},{"n":"RAII và smart pointer","d":"Gắn vòng đời tài nguyên vào vòng đời đối tượng để mã vừa gọn vừa an toàn trước ngoại lệ.","p":["Nguyên lý RAII với bộ nhớ, tệp, khóa, socket","unique_ptr: sở hữu duy nhất, make_unique, deleter tùy chỉnh","shared_ptr và weak_ptr: đếm tham chiếu, phá vòng tham chiếu","Khi nào truyền con trỏ thô hoặc tham chiếu (không sở hữu)","Ngoại lệ và đảm bảo an toàn ngoại lệ"],"x":[["Bài 1 – Cơ bản: Bọc tệp bằng RAII","Viết lớp FileHandle mở tệp trong constructor và đóng trong destructor. Đạt khi: tệp luôn được đóng kể cả khi ném ngoại lệ giữa chừng."],["Bài 2 – Nâng cao: Đồ thị và weak_ptr","Cài cây có nút cha và con dùng shared_ptr và weak_ptr. Đạt khi: hủy cây không rò rỉ (kiểm tra bằng ASan hoặc đếm destructor)."]]},{"n":"Move semantics, lambda và thư viện chuẩn","d":"Chuyển tài nguyên thay vì sao chép và dùng các kiểu vocabulary hiện đại để mã rõ ràng hơn.","p":["Lvalue, rvalue, std::move, move constructor và move assignment (noexcept)","Perfect forwarding với universal reference và std::forward","Lambda: capture theo giá trị và tham chiếu, generic lambda","optional, variant, string_view, span và thời gian sống của dữ liệu","Đối tượng hàm và std::function"],"x":[["Bài 1 – Cơ bản: Đếm bản sao","Viết lớp Tracer in thông báo khi copy hoặc move. Thử truyền vào hàm và container, giải thích từng lần. Đạt khi: giải thích đúng cả 5 tình huống cho trước."],["Bài 2 – Nâng cao: Bộ lọc bằng lambda","Cài hàm nhận std::vector<Order> và danh sách điều kiện lọc lambda, trả về kết quả đã sắp xếp. Đạt khi: không sao chép dữ liệu thừa (chứng minh bằng Tracer)."]]},{"n":"Template, concepts và STL","d":"Viết mã tổng quát, kiểm soát bằng ràng buộc kiểu và tận dụng thư viện chuẩn.","p":["Function template, class template, chuyên biệt hóa","Concepts và requires (C++20) thay cho SFINAE","constexpr và tính toán lúc biên dịch","Container: vector, deque, map, unordered_map, set; độ phức tạp của từng thao tác","algorithm và ranges: sort, find_if, transform, views"],"x":[["Bài 1 – Cơ bản: Thống kê từ khóa","Đọc tệp văn bản, đếm tần suất từ bằng unordered_map, in 10 từ nhiều nhất. Đạt khi: đúng với tệp thử 1 MB."],["Bài 2 – Nâng cao: Hàm tổng quát có concepts","Viết hàm sum_if nhận mọi range số và một predicate, ràng buộc bằng concepts. Đạt khi: truyền kiểu sai cho thông báo lỗi biên dịch dễ hiểu."]]},{"n":"Lập trình đa luồng","d":"Tận dụng nhiều lõi CPU mà vẫn đúng và dễ bảo trì.","p":["thread và jthread, join và detach","mutex, lock_guard, scoped_lock, tránh deadlock bằng thứ tự khóa","condition_variable và mô hình producer–consumer","atomic và các thứ tự bộ nhớ ở mức cơ bản","async, future, promise; phát hiện data race bằng ThreadSanitizer"],"x":[["Bài 1 – Cơ bản: Cộng song song","Chia mảng 10 triệu số cho 4 luồng cộng riêng rồi gộp kết quả. Đạt khi: kết quả đúng và nhanh hơn bản đơn luồng."],["Bài 2 – Nâng cao: Thread pool","Cài thread pool với hàng đợi công việc, hàm submit trả về future. Đạt khi: chạy 1.000 tác vụ đúng kết quả và sạch dưới ThreadSanitizer."]]}],"pit":["Dùng sau khi move (đối tượng ở trạng thái hợp lệ nhưng không xác định giá trị)","Vòng tham chiếu giữa các shared_ptr gây rò rỉ","Trả về tham chiếu tới biến cục bộ","Lạm dụng shared_ptr khắp nơi","Quên virtual destructor khi xóa đối tượng qua con trỏ lớp cơ sở"],"proj":["Thư viện container nhỏ (vector tự cài) có move semantics","Thread pool với hàng đ delegating constructor","Hàm thành viên const, getter hợp lý, tránh setter vô ích","Tách khai báo .hpp và định nghĩa .cpp; include guard","explicit cho hàm tạo một tham số"],"e":"class Account {\npublic:\n    explicit Account(std::string owner, double balance = 0)\n        : owner_{std::move(owner)}, balance_{balance} {}\n    void deposit(double x) { if (x > 0) balance_ += x; }\n    double balance() const { return balance_; }\nprivate:\n    std::string owner_;\n    double balance_;\n};","h":[["BT 1.2.1 – Lớp Fraction","Cài phân số có hàm tạo kiểm tra mẫu khác 0, rút gọn tự động, cộng và nhân. Đạt khi: 10 ca thử đúng, mẫu 0 bị từ chối bằng ngoại lệ."],["BT 1.2.2 – Lớp Account","Thêm withdraw không cho rút quá số dư. Đạt khi: invariant \"số dư ≥ 0\" không thể bị phá từ bên ngoài."]]}]},{"t":"Chương 2: Vòng đời đối tượng","ls":[{"t":"Bài 2.1 – Hàm hủy, sao chép và quy tắc 0/3/5","m":"90 phút","g":"Hiểu khi nào đối tượng được tạo, sao chép, hủy; áp dụng quy tắc 0/3/5.","k":["Thời điểm gọi hàm tạo, hàm hủy; thứ tự hủy ngược thứ tự tạo","Hàm tạo sao chép và toán tử gán sao chép; sao chép nông và sâu","Quy tắc 3: tự quản lý tài nguyên thì phải định nghĩa cả 3","Quy tắc 0: ưu tiên thành viên tự quản lý (vector, string, smart pointer)","=default và =delete để thể hiện ý định"],"e":"class Buffer {\npublic:\n    explicit Buffer(size_t n) : n_{n}, p_{new int[n]{}} {}\n    ~Buffer() { delete[] p_; }\n    Buffer(const Buffer& o) : n_{o.n_}, p_{new int[o.n_]} { std::copy(o.p_, o.p_ + n_, p_); }\n    Buffer& operator=(Buffer o) { swap(o); return *this; }\n    void swap(Buffer& o) noexcept { std::swap(n_, o.n_); std::swap(p_, o.p_); }\nprivate:\n    size_t n_; int* p_;\n};","h":[["BT 2.1.1 – Nhật ký vòng đời","Viết lớp Tracer in thông điệp ở mỗi hàm tạo, sao chép, hủy; tạo, truyền và trả về trong hàm. Đạt khi: dự đoán đúng thứ tự thông điệp trước khi chạy."],["BT 2.1.2 – Chuỗi tự cài","Cài lớp MyString đúng quy tắc 3. Đạt khi: AddressSanitizer không báo lỗi với phép gán tự thân và sao chép."]]},{"t":"Bài 2.2 – Toán tử nạp chồng, friend và static","m":"75 phút","g":"Nạp chồng toán tử hợp lý và dùng thành viên static đúng chỗ.","k":["Toán tử so sánh, <<, +, [], (); thành viên hay hàm tự do","Toán tử <=> (C++20) để sinh bộ so sánh","friend: khi nào hợp lý","Thành viên static, hằng số lớp, inline static","Kế thừa cơ bản: public inheritance, virtual, override, hàm hủy ảo"],"e":"struct Version {\n    int major, minor;\n    auto operator<=>(const Version&) const = default;\n};\nstatic_assert(Version{1,2} < Version{1,3});","h":[["BT 2.2.1 – Lớp Vector2D","Nạp chồng +, -, *, ==, << và [] cho vector hai chiều. Đạt khi: không sao chép thừa, các toán tử const đúng chỗ."],["BT 2.2.2 – Hình học đa hình","Tạo Shape ảo với Circle, Rect, tính diện tích qua vector<unique_ptr<Shape>>. Đạt khi: hàm hủy ảo và không rò rỉ."]]}]}],"pj":["Bài kiểm tra cuối vùng 1: Cài lớp Matrix kích thước động (hàm tạo, sao chép, di chuyển cơ bản, +, *, <<) kèm 20 ca thử; sạch AddressSanitizer. Thời lượng: 4 giờ."]},{"n":"RAII và smart pointer","ch":[{"t":"Chương 3: RAII và quản lý tài nguyên","ls":[{"t":"Bài 3.1 – Nguyên lý RAII","m":"60 phút","g":"Gắn vòng đời tài nguyên với phạm vi đối tượng.","k":["Ý tưởng: tạo tài nguyên ở hàm tạo, giải phóng ở hàm hủy","Ví dụ: lock_guard, fstream, unique_ptr","Vì sao RAII an toàn trước ngoại lệ so với free thủ công","Tự viết lớp bao (wrapper) cho FILE* hoặc socket","Tránh new/delete trần trong mã ứng dụng"],"e":"class File {\npublic:\n    explicit File(const char* p) : f_{std::fopen(p, \"r\")} { if (!f_) throw std::runtime_error(\"open\"); }\n    ~File() { std::fclose(f_); }\n    File(const File&) = delete;\n    File& operator=(const File&) = delete;\n    std::FILE* get() const { return f_; }\nprivate:\n    std::FILE* f_;\n};","h":[["BT 3.1.1 – Wrapper tệp C","Viết lớp File ở trên có thêm di chuyển. Đạt khi: ném ngoại lệ giữa chừng vẫn đóng được tệp (kiểm chứng bằng strace hoặc đếm)."],["BT 3.1.2 – Scope guard","Viết ScopeExit chạy lambda khi ra khỏi phạm vi. Đạt khi: dùng được để mở/đóng giao dịch giả lập."]]},{"t":"Bài 3.2 – An toàn ngoại lệ và noexcept","m":"60 phút","g":"Viết mã an toàn ngoại lệ ở mức cơ bản và mạnh.","k":["Ba mức đảm bảo: no-throw, strong, basic","Copy-and-swap để đạt strong guarantee","noexcept và ảnh hưởng đến move trong container","Không ném ngoại lệ từ hàm hủy","Khi nào dùng ngoại lệ, khi nào dùng std::optional/expected"],"e":"void Stack::push(const T& v) {\n    auto copy = data_;     // strong guarantee\n    copy.push_back(v);\n    data_.swap(copy);\n}","h":[["BT 3.2.1 – Thêm phần tử an toàn","Viết hàm add_all cho container đảm bảo strong guarantee. Đạt khi: giả lập ngoại lệ ở phần tử thứ k, container giữ nguyên."],["BT 3.2.2 – Phân loại lỗi","Với 6 tình huống (tệp thiếu, đầu vào sai, hết RAM...), chọn ngoại lệ hay mã lỗi. Đạt khi: có lý do cho từng lựa chọn."]]}]},{"t":"Chương 4: Smart pointer","ls":[{"t":"Bài 4.1 – unique_ptr","m":"60 phút","g":"Dùng unique_ptr cho quyền sở hữu duy nhất.","k":["make_unique, truyền sở hữu bằng std::move","Custom deleter cho tài nguyên không phải new","unique_ptr<T[]> và vì sao ưu tiên vector","Trả về unique_ptr từ factory","Truyền tham số: raw pointer/reference khi không chuyển sở hữu"],"e":"std::unique_ptr<Shape> make(std::string_view k) {\n    if (k == \"circle\") return std::make_unique<Circle>(1.0);\n    return nullptr;\n}\nauto p = make(\"circle\");\nauto q = std::move(p);   // p rỗng","h":[["BT 4.1.1 – Factory","Viết factory tạo Shape từ chuỗi, lưu vào vector<unique_ptr>. Đạt khi: không rò rỉ, không con trỏ thô sở hữu."],["BT 4.1.2 – Custom deleter","Bọc FILE* bằng unique_ptr với deleter fclose. Đạt khi: không cần viết lớp File riêng."]]},{"t":"Bài 4.2 – shared_ptr, weak_ptr và các bẫy","m":"75 phút","g":"Dùng shared_ptr đúng chỗ, tránh vòng tham chiếu.","k":["Đếm tham chiếu, make_shared, chi phí và khi nào cần","Vòng tham chiếu và cách phá bằng weak_ptr","enable_shared_from_this","Không tạo hai shared_ptr từ cùng con trỏ thô","Thread-safety: đếm an toàn, đối tượng bên trong thì không"],"e":"struct Node {\n    std::shared_ptr<Node> next;\n    std::weak_ptr<Node> prev;  // tránh vòng\n};","h":[["BT 4.2.1 – Danh sách đôi","Cài danh sách liên kết đôi dùng shared_ptr và weak_ptr. Đạt khi: in ra use_count đúng và hủy hết nút khi bỏ head."],["BT 4.2.2 – Observer","Cài Subject giữ weak_ptr tới các Observer. Đạt khi: observer bị hủy thì Subject tự bỏ qua."]]}]}],"pj":["Bài kiểm tra cuối vùng 2: Viết thư viện \"ResourcePool\" (tài nguyên tái sử dụng) dùng RAII và smart pointer; kiểm thử với ngoại lệ; sạch sanitizer. Thời lượng: 4 giờ."]},{"n":"Move semantics, lambda và thư viện chuẩn","ch":[{"t":"Chương 5: Move semantics","ls":[{"t":"Bài 5.1 – Giá trị trái, giá trị phải và std::move","m":"75 phút","g":"Hiểu lvalue/rvalue và vì sao move tránh sao chép.","k":["lvalue, prvalue, xvalue; tham chiếu rvalue T&&","std::move chỉ là ép kiểu, không di chuyển gì","Hàm tạo và gán di chuyển; noexcept","Trạng thái hợp lệ nhưng không xác định sau khi move","Copy elision và RVO: đừng viết return std::move(local)"],"e":"Buffer::Buffer(Buffer&& o) noexcept : n_{std::exchange(o.n_, 0)}, p_{std::exchange(o.p_, nullptr)} {}\nBuffer& Buffer::operator=(Buffer&& o) noexcept {\n    if (this != &o) { delete[] p_; n_ = std::exchange(o.n_, 0); p_ = std::exchange(o.p_, nullptr); }\n    return *this;\n}","h":[["BT 5.1.1 – Thêm move vào Buffer","Bổ sung move cho Buffer ở vùng 1 và đo thời gian chèn 1 triệu phần tử vào vector. Đạt khi: nộp so sánh có/không noexcept."],["BT 5.1.2 – Dự đoán","Cho 8 đoạn code gọi hàm với lvalue/rvalue, dự đoán hàm nào được gọi. Đạt khi: đúng ít nhất 7/8 và giải thích."]]},{"t":"Bài 5.2 – Perfect forwarding và quy tắc 5","m":"60 phút","g":"Viết hàm bao bọc chuyển tiếp tham số chính xác.","k":["Forwarding reference T&& trong template","std::forward và reference collapsing","emplace_back so với push_back","Quy tắc 5 tổng hợp","Khi nào KHÔNG cần tự viết move"],"e":"template <class T, class... A>\nstd::unique_ptr<T> my_make(A&&... a) {\n    return std::unique_ptr<T>(new T(std::forward<A>(a)...));\n}","h":[["BT 5.2.1 – make_unique tự cài","Cài my_make và kiểm thử với kiểu chỉ move được. Đạt khi: không sao chép thừa (đếm bằng Tracer)."],["BT 5.2.2 – Hàm gọi lại","Viết call_logged(f, args...) in log rồi gọi f. Đạt khi: giữ nguyên lvalue/rvalue của tham số."]]}]},{"t":"Chương 6: Lambda và thư viện chuẩn hiện đại","ls":[{"t":"Bài 6.1 – Lambda và hàm là giá trị","m":"60 phút","g":"Dùng lambda với thuật toán chuẩn.","k":["Cú pháp [capture](params){body}; capture theo giá trị, tham chiếu, init-capture","Lambda generic (auto) và constexpr lambda","std::function so với auto và template","Thuật toán: sort, find_if, transform, accumulate, remove_erase","Cạm bẫy: capture tham chiếu tới biến đã hết hạn"],"e":"std::vector<int> v{5, 2, 9, 1};\nstd::ranges::sort(v, [](int a, int b){ return a > b; });\nint th = 3;\nauto cnt = std::ranges::count_if(v, [th](int x){ return x > th; });","h":[["BT 6.1.1 – Sổ điểm","Cho danh sách sinh viên, dùng lambda để sắp xếp theo điểm giảm dần, lọc điểm ≥ 8, tính trung bình. Đạt khi: không dùng vòng for thủ công."],["BT 6.1.2 – Capture an toàn","Viết hàm trả lambda đếm số lần gọi (init-capture). Đạt khi: giải thích vì sao capture & sẽ lỗi."]]},{"t":"Bài 6.2 – optional, variant, string_view, span và ranges","m":"75 phút","g":"Dùng các kiểu từ vựng của C++17/20 để mã an toàn hơn.","k":["std::optional cho giá trị có thể vắng; std::variant + visit","string_view và span: tham số không sở hữu, cẩn thận vòng đời","Ranges và views: filter, transform, take (lazy)","std::filesystem cơ bản","Giới thiệu std::expected (C++23) cho xử lý lỗi"],"e":"std::optional<int> parse(std::string_view s) {\n    int v{};\n    auto [p, ec] = std::from_chars(s.data(), s.data() + s.size(), v);\n    if (ec != std::errc{}) return std::nullopt;\n    return v;\n}\nauto evens = v | std::views::filter([](int x){ return x % 2 == 0; });","h":[["BT 6.2.1 – Phân tích cấu hình","Đọc file key=value, trả optional cho từng khóa; báo lỗi rõ ràng. Đạt khi: không dùng giá trị đặc biệt như -1."],["BT 6.2.2 – Pipeline ranges","Từ dãy số, lọc số nguyên tố, bình phương, lấy 10 số đầu bằng views. Đạt khi: chạy lazy, không tạo vector trung gian."]]}]}],"pj":["Bài kiểm tra cuối vùng 3: Viết chương trình đọc log lớn (100 MB), thống kê top 10 IP/URL bằng thuật toán chuẩn, lambda, string_view; không sao chép chuỗi thừa; thời gian < 2 giây. Thời lượng: 5 giờ."]},{"n":"Template, concepts và STL","ch":[{"t":"Chương 7: Template và concepts","ls":[{"t":"Bài 7.1 – Function template và class template","m":"75 phút","g":"Viết template đơn giản, hiểu cách thực thể hóa.","k":["Function template, suy luận tham số, đặc hóa","Class template, tham số mặc định, alias template","Template trong header; vì sao định nghĩa phải thấy được","Lỗi biên dịch dài và cách đọc","if constexpr thay cho đặc hóa phức tạp"],"e":"template <class T>\nclass Stack {\npublic:\n    void push(T v) { d_.push_back(std::move(v)); }\n    T pop() { T v = std::move(d_.back()); d_.pop_back(); return v; }\n    bool empty() const { return d_.empty(); }\nprivate:\n    std::vector<T> d_;\n};","h":[["BT 7.1.1 – Mảng cố định","Cài Array<T,N> có at(), size(), iterator. Đạt khi: dùng được range-for và static_assert kiểm tra kích thước."],["BT 7.1.2 – print","Viết print(const T&) dùng if constexpr để in vector, số và chuỗi khác nhau. Đạt khi: không cần nạp chồng thủ công cho từng kiểu."]]},{"t":"Bài 7.2 – Concepts và ràng buộc kiểu","m":"60 phút","g":"Dùng concepts để lỗi template rõ ràng.","k":["concept, requires-clause, requires-expression","Concept có sẵn: integral, floating_point, same_as, invocable, ranges::range","Ràng buộc trên tham số và kiểu trả về","Viết concept riêng cho miền bài toán","Variadic template và fold expression"],"e":"template <class T>\nconcept Number = std::integral<T> || std::floating_point<T>;\n\ntemplate <Number T>\nT sum(std::span<const T> xs) { return std::accumulate(xs.begin(), xs.end(), T{}); }\n\ntemplate <class... A> auto add(A... a) { return (a + ...); }","h":[["BT 7.2.1 – Concept Printable","Định nghĩa concept yêu cầu toán tử << và dùng nó cho hàm log. Đạt khi: truyền kiểu không hợp lệ cho thông báo lỗi ngắn, rõ."],["BT 7.2.2 – Hàm thống kê","Viết mean, variance dùng concept Number. Đạt khi: từ chối chuỗi ngay lúc biên dịch."]]}]},{"t":"Chương 8: STL: container, iterator, thuật toán","ls":[{"t":"Bài 8.1 – Container và độ phức tạp","m":"75 phút","g":"Chọn đúng container theo yêu cầu truy cập.","k":["vector, deque, list, array: bố cục bộ nhớ và độ phức tạp","map, set, unordered_map, unordered_set: so sánh và băm","priority_queue, stack, queue","Vô hiệu hóa iterator khi thay đổi container","reserve, emplace, node handle, erase-remove"],"e":"std::unordered_map<std::string, int> freq;\nfor (const auto& w : words) ++freq[w];\nstd::vector<std::pair<std::string,int>> top(freq.begin(), freq.end());\nstd::ranges::sort(top, std::greater{}, &std::pair<std::string,int>::second);","h":[["BT 8.1.1 – Đo thực tế","Chèn, tìm, xóa 1 triệu phần tử trên vector, list, map, unordered_map và lập bảng thời gian. Đạt khi: giải thích kết quả bằng bố cục cache."],["BT 8.1.2 – Lịch sử trình duyệt","Cài lịch sử back/forward bằng hai stack. Đạt khi: ca thử 10 thao tác đúng."]]},{"t":"Bài 8.2 – Iterator, thuật toán và tự cài container","m":"90 phút","g":"Hiểu mô hình iterator và cài container nhỏ tương thích STL.","k":["Phân loại iterator: input, forward, bidirectional, random access, contiguous","Thuật toán chuẩn và phân tích độ phức tạp","Viết iterator cho container tự cài","Allocator: khái niệm, pmr::monotonic_buffer_resource","Parallel algorithms với std::execution"],"e":"template <class T> class Ring {\n    // ...\npublic:\n    struct iterator { /* tiến, so sánh, dereference */ };\n    iterator begin(); iterator end();\n};\nstd::sort(std::execution::par, v.begin(), v.end());","h":[["BT 8.2.1 – Ring buffer","Cài Ring<T> có begin/end và dùng được với std::copy, range-for. Đạt khi: qua kiểm thử cơ bản của container."],["BT 8.2.2 – So sánh tuần tự và song song","Sắp xếp 10 triệu số bằng sort và sort(par). Đạt khi: báo cáo tăng tốc và điều kiện cần."]]}]}],"pj":["Bài kiểm tra cuối vùng 4: Cài thư viện \"mini-STL\" gồm Vector<T>, LinkedList<T>, HashMap<K,V> dùng template, iterator, concepts; qua 40 ca thử đối chiếu với STL. Thời lượng: 6 giờ."]},{"n":"Lập trình đa luồng","ch":[{"t":"Chương 9: Luồng và đồng bộ hóa","ls":[{"t":"Bài 9.1 – std::thread, jthread và chia sẻ dữ liệu","m":"75 phút","g":"Tạo luồng an toàn và hiểu data race.","k":["std::thread, join, detach; jthread và stop_token (C++20)","Data race là hành vi không xác định","mutex, lock_guard, unique_lock, scoped_lock (tránh deadlock)","Truyền tham số vào luồng: sao chép hay tham chiếu","Công cụ: ThreadSanitizer (-fsanitize=thread)"],"e":"std::mutex m; int counter = 0;\nstd::vector<std::jthread> ts;\nfor (int i = 0; i < 4; ++i)\n    ts.emplace_back([&]{ for (int k = 0; k < 100000; ++k) { std::scoped_lock l{m}; ++counter; } });","h":[["BT 9.1.1 – Gây và sửa data race","Viết chương trình tăng biến đếm không khóa từ 4 luồng, quan sát sai lệch, sửa bằng mutex rồi atomic. Đạt khi: TSan sạch sau khi sửa."],["BT 9.1.2 – Bữa tối của triết gia","Cài bài 5 triết gia không deadlock bằng scoped_lock. Đạt khi: chạy 1 phút không treo."]]},{"t":"Bài 9.2 – condition_variable, atomic và mô hình bộ nhớ","m":"90 phút","g":"Đồng bộ luồng bằng điều kiện và hiểu atomic cơ bản.","k":["condition_variable, wait với predicate, notify_one/all","Spurious wakeup và vì sao luôn dùng predicate","std::atomic, fetch_add, compare_exchange; memory_order mặc định seq_cst","Mô hình producer-consumer","Latch, barrier, semaphore (C++20)"],"e":"std::mutex m; std::condition_variable cv; std::queue<int> q; bool done = false;\nvoid consumer() {\n    std::unique_lock l{m};\n    while (true) {\n        cv.wait(l, []{ return !q.empty() || done; });\n        if (q.empty()) break;\n        int v = q.front(); q.pop();\n        l.unlock(); process(v); l.lock();\n    }\n}","h":[["BT 9.2.1 – Hàng đợi an toàn luồng","Cài BlockingQueue<T> với push, pop, close. Đạt khi: 4 producer, 4 consumer xử lý 1 triệu phần tử không mất, không treo."],["BT 9.2.2 – Bộ đếm atomic","So sánh mutex và atomic cho bộ đếm. Đạt khi: nộp số đo và kết luận."]]}]},{"t":"Chương 10: Bất đồng bộ cấp cao và đồ án","ls":[{"t":"Bài 10.1 – async, future và thread pool","m":"75 phút","g":"Dùng tác vụ bất đồng bộ và xây thread pool.","k":["std::async, future, promise, packaged_task","Chuyển ngoại lệ qua future","Thiết kế thread pool: hàng đợi tác vụ, worker, tắt an toàn","Chọn số luồng: hardware_concurrency","Song song theo dữ liệu và định luật Amdahl"],"e":"auto f = std::async(std::launch::async, []{ return heavy(); });\n// ...\nint r = f.get();   // ném lại ngoại lệ nếu có","h":[["BT 10.1.1 – Thread pool","Cài ThreadPool::submit trả future. Đạt khi: 1000 tác vụ chạy đúng, destructor đợi xong, TSan sạch."],["BT 10.1.2 – Tính song song","Đếm số nguyên tố ≤ 10^7 bằng 1, 2, 4, 8 luồng. Đạt khi: lập bảng tăng tốc và nhận xét."]]},{"t":"Bài 10.2 – Đồ án: bộ tải tệp song song","m":"4 giờ","g":"Hoàn thành một ứng dụng đa luồng có kiểm thử.","k":["Yêu cầu: đọc danh sách tệp, băm SHA hoặc đếm từ song song","Thread pool hoặc async, không data race","Báo cáo đo hiệu năng theo số luồng","CMake, kiểm thử, sanitizer (ASan, TSan)","Trình bày thiết kế và hạn chế"],"e":"","h":[["BT 10.2.1 – Ứng dụng","Xử lý thư mục 1000 tệp song song với kết quả tổng hợp đúng. Đạt khi: kết quả khớp bản tuần tự và nhanh hơn ≥ 2 lần với 4 luồng."],["BT 10.2.2 – Báo cáo","Viết README mô tả kiến trúc và bảng đo. Đạt khi: người khác build và chạy được chỉ bằng README."]]}]}],"pj":["Bài kiểm tra cuối vùng 5: Cho chương trình đa luồng có 3 lỗi cố ý (data race, deadlock, mất thông báo); tìm và sửa bằng TSan và gdb, nộp nhật ký. Thời lượng: 3 giờ."]}]},{"id":"html","name":"HTML5","tag":"Semantic, form, a11y, SEO, Web Components","level":"Cơ bản → Trung cấp","time":"3–4 tuần","code":"code-html","who":"Mọi lập trình viên web; là nền để học CSS, JavaScript và các framework.","pre":["Biết dùng trình duyệt và trình soạn thảo mã (VS Code)","Không cần kiến thức lập trình trước"],"map":[{"t":"Giai đoạn 1 – Cấu trúc và ngữ nghĩa","w":"Tuần 1","g":"Dựng được trang tĩnh đúng chuẩn, có thẻ ngữ nghĩa và nội dung rõ ràng.","i":["Khung tài liệu, văn bản, danh sách, liên kết, hình ảnh","Bảng dữ liệu đúng cách","Header, nav, main, section, article, aside, footer"],"o":"Trang giới thiệu bản thân vượt qua W3C Validator."},{"t":"Giai đoạn 2 – Biểu mẫu và truy cập","w":"Tuần 2","g":"Xây biểu mẫu thân thiện và trang dùng được bằng bàn phím, trình đọc màn hình.","i":["Form, label, các loại input, kiểm tra hợp lệ gốc","Landmark, thứ tự tiêu đề, văn bản thay thế","ARIA ở mức tối thiểu cần thiết"],"o":"Biểu mẫu đăng ký đạt Lighthouse Accessibility từ 95."},{"t":"Giai đoạn 3 – SEO, hiệu năng và Web Components","w":"Tuần 3–4","g":"Tối ưu để công cụ tìm kiếm hiểu trang và tải nhanh, đóng gói thành phần tái sử dụng.","i":["Title, meta, canonical, Open Graph, JSON-LD","Ảnh responsive, lazy-load, preload","Custom elements, shadow DOM, template, slot"],"o":"Trang sản phẩm đạt Lighthouse SEO từ 95 và có một Web Component dùng lại được."}],"areas":[{"n":"Cấu trúc tài liệu và thẻ ngữ nghĩa","d":"Chọn thẻ theo ý nghĩa thay vì theo giao diện để trình duyệt, máy tìm kiếm và người bảo trì cùng hiểu.","p":["Khung chuẩn: doctype, html lang, head (charset, viewport, title), body","Tiêu đề h1–h6 liên tục, chỉ một h1 mỗi trang","Thẻ ngữ nghĩa: header, nav, main, section, article, aside, footer, figure","Danh sách, liên kết (đường dẫn tương đối và tuyệt đối), bảng với caption và th scope","Hình ảnh: alt, width/height, srcset, sizes, picture"],"x":[["Bài 1 – Cơ bản: Trang giới thiệu bản thân","Dựng trang có header, nav, main (ít nhất 3 section), footer, một bảng kỹ năng và một ảnh có alt. Đạt khi: W3C Validator báo 0 lỗi."],["Bài 2 – Nâng cao: Bài báo ngữ nghĩa","Dựng một bài báo có article, figure, figcaption, time, aside bình luận, mục lục liên kết trong trang. Đạt khi: đọc bằng chế độ Reader của trình duyệt vẫn ra đúng cấu trúc."]]},{"n":"Biểu mẫu","d":"Biểu mẫu là nơi người dùng bỏ cuộc nhiều nhất, nên cần rõ ràng, ít trường và báo lỗi dễ hiểu.","p":["label gắn với input bằng for/id, fieldset và legend","Các type: email, tel, number, date, url, password, search","required, pattern, min, max, minlength, maxlength, autocomplete","Nút submit, GET và POST, tên trường (name)","Kiểm tra phía máy chủ vẫn bắt buộc"],"x":[["Bài 1 – Cơ bản: Biểu mẫu đăng ký","Xây form gồm họ tên, email, số điện thoại, ngày sinh, mật khẩu, đồng ý điều khoản, có kiểm tra gốc của trình duyệt. Đạt khi: nhập sai từng trường đều có thông báo rõ."],["Bài 2 – Nâng cao: Biểu mẫu nhiều bước","Chia form thành 3 bước bằng fieldset, có thanh tiến độ, giữ dữ liệu khi quay lại. Đạt khi: dùng được hoàn toàn bằng bàn phím."]]},{"n":"Khả năng truy cập (a11y)","d":"Trang web tốt phải dùng được cho cả người khiếm thị, người chỉ dùng bàn phím và người dùng màn hình nhỏ.","p":["Mục tiêu tham chiếu WCAG 2.2 mức AA","Tương phản màu tối thiểu, không chỉ dùng màu để truyền đạt thông tin","Thứ tự focus, focus nhìn thấy, liên kết bỏ qua điều hướng (skip link)","Landmark và thuộc tính ARIA cơ bản: aria-label, aria-describedby, aria-live","Thử bằng trình đọc màn hình (NVDA hoặc VoiceOver) và axe DevTools"],"x":[["Bài 1 – Cơ bản: Sửa trang lỗi a11y","Nhận một trang có 10 lỗi truy cập (ảnh thiếu alt, input thiếu label, tương phản thấp...). Tìm và sửa hết. Đạt khi: axe DevTools báo 0 lỗi nghiêm trọng."],["Bài 2 – Nâng cao: Menu truy cập được","Xây menu thả xuống dùng được bằng bàn phím (Tab, Enter, Esc, phím mũi tên) và đọc đúng bằng trình đọc màn hình. Đạt khi: kiểm thử thủ công đạt cả 3 thao tác."]]},{"n":"SEO kỹ thuật và hiệu năng","d":"Giúp công cụ tìm kiếm hiểu trang và giúp trang tải nhanh trên mạng yếu.","p":["title và meta description độc nhất, canonical, robots","Open Graph và Twitter Card cho chia sẻ mạng xã hội","Dữ liệu có cấu trúc JSON-LD (Product, Article, BreadcrumbList)","Tối ưu ảnh: định dạng hiện đại, kích thước đúng, loading=lazy","Đo bằng Lighthouse và Core Web Vitals"],"x":[["Bài 1 – Cơ bản: Meta cho 3 trang","Viết title, description, canonical và Open Graph cho 3 trang khác nhau. Đạt khi: không trùng lặp và công cụ xem trước chia sẻ hiện đúng."],["Bài 2 – Nâng cao: Trang sản phẩm có JSON-LD","Thêm dữ liệu cấu trúc Product (tên, giá, tình trạng, ảnh) và tối ưu ảnh. Đạt khi: Rich Results Test không báo lỗi và Lighthouse SEO từ 95."]]},{"n":"Web Components","d":"Tạo thẻ HTML riêng, đóng gói giao diện, dùng được ở mọi framework hoặc không framework.","p":["Custom elements: class kế thừa HTMLElement, customElements.define","connectedCallback, attributeChangedCallback, observedAttributes","Shadow DOM đóng gói CSS, slot để chèn nội dung","template và cloneNode","Sự kiện tùy chỉnh (CustomEvent) để giao tiếp ra ngoài"],"x":[["Bài 1 – Cơ bản: Thẻ user-badge","Tạo thẻ hiển thị tên và ảnh đại diện qua thuộc tính, có kiểu riêng trong shadow DOM. Đạt khi: đổi thuộc tính thì giao diện cập nhật."],["Bài 2 – Nâng cao: Thẻ product-card","Tạo thẻ có slot cho mô tả, nút thêm vào giỏ phát CustomEvent. Đạt khi: trang chủ lắng nghe sự kiện và cập nhật số lượng giỏ."]]}],"pit":["Dùng div/span cho mọi thứ thay vì thẻ ngữ nghĩa","Ô nhập không có label","Bỏ qua thuộc tính alt hoặc viết alt vô nghĩa","Nhảy cấp tiêu đề chỉ để đổi cỡ chữ","Lạm dụng ARIA làm hỏng trải nghiệm của trình đọc màn hình"],"proj":["Trang giới thiệu sản phẩm đạt điểm Lighthouse Accessibility và SEO từ 95 trở lên","Biểu mẫu đăng ký đầy đủ kiểm tra hợp lệ và thân thiện bàn phím","Thành phần thẻ sản phẩm bằng Web Component"],"tools":["VS Code","Chrome DevTools và Lighthouse","axe DevTools","W3C Validator","NVDA hoặc VoiceOver để thử trình đọc màn hình"],"refs":["MDN Web Docs (developer.mozilla.org)","Đặc tả HTML Living Standard (html.spec.whatwg.org)","WCAG và WAI-ARIA Authoring Practices (w3.org/WAI)","web.dev"],"check":["Trang vượt qua W3C Validator","Điều hướng được toàn trang chỉ bằng bàn phím","Lighthouse Accessibility ≥ 95","Biết viết một custom element đơn giản"],"cur":[{"n":"Cấu trúc tài liệu và thẻ ngữ nghĩa","ch":[{"t":"Chương 1: Nền tảng của một trang web","ls":[{"t":"Bài 1.1 – Cách web hoạt động và khung tài liệu HTML5","m":"60 phút","g":"Hiểu vòng đời yêu cầu–phản hồi và viết khung HTML đúng chuẩn.","k":["Trình duyệt, máy chủ, HTTP, DNS ở mức tổng quan; DOM là gì","Khung tối thiểu: doctype, html lang, head, body","Thẻ meta charset UTF-8 và viewport; title và description","Phần tử, thuộc tính, phần tử rỗng, ký tự đặc biệt (entity)","Công cụ: VS Code, Live Server, DevTools (Elements, Network)"],"e":"<!doctype html>\n<html lang=\"vi\">\n<head>\n  <meta charset=\"utf-8\">\n  <meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n  <title>Trang đầu tiên<\/title>\n<\/head>\n<body>\n  <h1>Xin chào<\/h1>\n<\/body>\n<\/html>","h":[["BT 1.1.1 – Trang giới thiệu bản thân","Dựng trang giới thiệu có tiêu đề, đoạn văn, danh sách kỹ năng và liên kết. Đạt khi: qua kiểm tra validator.w3.org không lỗi."],["BT 1.1.2 – Khám phá DevTools","Mở một trang tin, ghi lại 5 phần tử và thuộc tính của chúng, xem tab Network. Đạt khi: nộp ảnh chụp và mô tả."]]},{"t":"Bài 1.2 – Văn bản, danh sách, liên kết, hình ảnh và bảng","m":"75 phút","g":"Dùng đúng thẻ nội dung cơ bản với đường dẫn và thuộc tính chuẩn.","k":["Tiêu đề h1–h6 đúng cấp bậc; p, strong, em, blockquote, code, pre","Danh sách ul, ol, dl","Liên kết: đường dẫn tương đối và tuyệt đối, target, rel=\"noopener\"","Ảnh: alt, width, height, loading=\"lazy\"; picture, srcset","Bảng: thead, tbody, th scope, caption; không dùng bảng để dàn trang"],"e":"<figure>\n  <img src=\"logo.png\" alt=\"Logo công ty\" width=\"120\" height=\"40\" loading=\"lazy\">\n  <figcaption>Logo chính thức<\/figcaption>\n<\/figure>\n<table>\n  <caption>Điểm kỳ này<\/caption>\n  <thead><tr><th scope=\"col\">Môn<\/th><th scope=\"col\">Điểm<\/th><\/tr><\/thead>\n  <tbody><tr><td>Web<\/td><td>9<\/td><\/tr><\/tbody>\n<\/table>","h":[["BT 1.2.1 – CV bằng HTML","Viết CV có tiêu đề, danh sách kinh nghiệm, bảng kỹ năng và ảnh đại diện có alt. Đạt khi: cấp tiêu đề không nhảy cấp, ảnh có kích thước."],["BT 1.2.2 – Trang tài liệu","Tạo mục lục nhảy tới các mục bằng id. Đạt khi: mọi liên kết hoạt động."]]}]},{"t":"Chương 2: Thẻ ngữ nghĩa và bố cục tài liệu","ls":[{"t":"Bài 2.1 – header, nav, main, article, section, aside, footer","m":"60 phút","g":"Chia trang thành vùng có ý nghĩa cho trình đọc màn hình và công cụ tìm kiếm.","k":["Vì sao div không đủ: ngữ nghĩa, điều hướng bằng landmark","Mỗi trang một main; header và footer có thể lồng trong article","article và section khác nhau thế nào","Outline tài liệu và cấp tiêu đề","Chọn div/span khi không có thẻ phù hợp"],"e":"<body>\n  <header><nav aria-label=\"Chính\"><a href=\"/\">Trang chủ<\/a><\/nav><\/header>\n  <main>\n    <article>\n      <h1>Bài viết<\/h1>\n      <section><h2>Mở đầu<\/h2><p>…<\/p><\/section>\n    <\/article>\n    <aside>Liên quan<\/aside>\n  <\/main>\n  <footer><small>© 2026<\/small><\/footer>\n<\/body>","h":[["BT 2.1.1 – Trang tin","Dựng trang tin 100% thẻ ngữ nghĩa, không dùng div bố cục. Đạt khi: DevTools Accessibility tree hiển thị đủ landmark."],["BT 2.1.2 – Cải tạo","Nhận một trang toàn div, viết lại bằng thẻ ngữ nghĩa. Đạt khi: nộp danh sách ánh xạ div → thẻ mới."]]},{"t":"Bài 2.2 – Nội dung nhúng, đa phương tiện và metadata","m":"60 phút","g":"Nhúng video, âm thanh, iframe an toàn và khai báo metadata chia sẻ.","k":["video, audio, source, track (phụ đề)","iframe: sandbox, allow, loading; rủi ro của nhúng bên thứ ba","Open Graph và Twitter Card để chia sẻ mạng xã hội","Favicon, manifest, theme-color","details/summary, dialog, time, mark, abbr"],"e":"<video controls width=\"640\" preload=\"metadata\" poster=\"p.jpg\">\n  <source src=\"a.webm\" type=\"video/webm\">\n  <source src=\"a.mp4\" type=\"video/mp4\">\n  <track kind=\"captions\" src=\"vi.vtt\" srclang=\"vi\" label=\"Tiếng Việt\">\n<\/video>\n<details><summary>Xem thêm<\/summary><p>Nội dung ẩn.<\/p><\/details>","h":[["BT 2.2.1 – Bài giảng video","Trang có video có phụ đề và bản ghi chép dưới video. Đạt khi: video chạy với bàn phím và có phụ đề."],["BT 2.2.2 – Thẻ chia sẻ","Thêm Open Graph cho trang và kiểm tra bằng công cụ xem trước. Đạt khi: hiển thị đúng tiêu đề và ảnh."]]}]}],"pj":["Bài kiểm tra cuối vùng 1: Dựng trang \"Bài blog\" đầy đủ landmark, ảnh responsive, bảng, video có phụ đề, metadata; validator không lỗi. Thời lượng: 3 giờ."]},{"n":"Biểu mẫu","ch":[{"t":"Chương 3: Phần tử biểu mẫu và kiểm tra dữ liệu","ls":[{"t":"Bài 3.1 – form, input, label và các kiểu nhập","m":"75 phút","g":"Xây biểu mẫu truy cập được, dùng đúng kiểu input.","k":["form: action, method, enctype; GET và POST","Mỗi input có label gắn bằng for/id hoặc bọc","Kiểu input: text, email, tel, number, date, password, file, range, color, search","select, textarea, datalist, fieldset, legend","Thuộc tính autocomplete, name, inputmode"],"e":"<form action=\"/dang-ky\" method=\"post\">\n  <label for=\"em\">Email<\/label>\n  <input id=\"em\" name=\"email\" type=\"email\" autocomplete=\"email\" required>\n  <label for=\"pw\">Mật khẩu<\/label>\n  <input id=\"pw\" name=\"password\" type=\"password\" autocomplete=\"new-password\" minlength=\"8\" required>\n  <button type=\"submit\">Đăng ký<\/button>\n<\/form>","h":[["BT 3.1.1 – Form đăng ký","Dựng form đăng ký 6 trường. Đạt khi: nhấp vào label thì focus input, autocomplete đúng."],["BT 3.1.2 – Form liên hệ","Thêm select, textarea, checkbox đồng ý điều khoản. Đạt khi: dùng bàn phím hoàn thành được mà không cần chuột."]]},{"t":"Bài 3.2 – Kiểm tra hợp lệ (validation) và thông báo lỗi","m":"75 phút","g":"Dùng Constraint Validation API và hiển thị lỗi rõ ràng.","k":["required, pattern, min, max, minlength, maxlength, step","Pseudo-class :valid, :invalid, :user-invalid","Constraint Validation API: checkValidity, setCustomValidity","Thông báo lỗi gắn với aria-describedby, aria-invalid","Luôn kiểm tra lại ở phía máy chủ: client chỉ là tiện ích"],"e":"<input id=\"sdt\" name=\"tel\" pattern=\"0[0-9]{9}\" aria-describedby=\"sdt-err\" required>\n<p id=\"sdt-err\" role=\"alert\" hidden>Số điện thoại gồm 10 chữ số, bắt đầu bằng 0.<\/p>\n<script>\n  const i = document.getElementById('sdt');\n  i.addEventListener('input', () => {\n    const bad = !i.checkValidity();\n    document.getElementById('sdt-err').hidden = !bad;\n    i.setAttribute('aria-invalid', bad);\n  });\n<\/script>","h":[["BT 3.2.1 – Luật nhập liệu","Đặt 5 luật kiểm tra khác nhau cho form đăng ký. Đạt khi: mỗi lỗi có thông báo tiếng Việt cụ thể gắn với trường."],["BT 3.2.2 – Kiểm tra mật khẩu khớp","Dùng setCustomValidity kiểm tra xác nhận mật khẩu. Đạt khi: thông báo biến mất khi nhập khớp."]]}]},{"t":"Chương 4: Gửi dữ liệu và biểu mẫu nâng cao","ls":[{"t":"Bài 4.1 – Gửi form bằng JavaScript và tải tệp lên","m":"75 phút","g":"Gửi dữ liệu bằng fetch và FormData, xử lý tệp.","k":["FormData, fetch POST, xử lý phản hồi lỗi","Tải tệp: accept, multiple, giới hạn kích thước ở client","Hiển thị tiến trình và xem trước ảnh (URL.createObjectURL)","Chống gửi hai lần: vô hiệu hóa nút khi đang gửi","CSRF và lý do cần token phía máy chủ"],"e":"form.addEventListener('submit', async e => {\n  e.preventDefault();\n  btn.disabled = true;\n  try {\n    const r = await fetch(form.action, { method: 'POST', body: new FormData(form) });\n    if (!r.ok) throw new Error('HTTP ' + r.status);\n  } finally { btn.disabled = false; }\n});","h":[["BT 4.1.1 – Tải ảnh đại diện","Cho chọn ảnh, xem trước và giới hạn 2 MB. Đạt khi: ảnh quá lớn bị từ chối với thông báo."],["BT 4.1.2 – Gửi không tải lại trang","Gửi form bằng fetch tới API giả (json-server) và hiển thị kết quả. Đạt khi: lỗi mạng hiện thông báo thân thiện."]]},{"t":"Bài 4.2 – Mẫu thiết kế biểu mẫu nhiều bước và UX","m":"60 phút","g":"Thiết kế form dài dễ hoàn thành.","k":["Chia bước, thanh tiến trình, lưu nhá Đạt khi: axe không lỗi nghiêm trọng."],["BT 10.2.2 – Hướng dẫn sử dụng","Viết README và ví dụ cho từng thành phần. Đạt khi: người mới dùng được trong 10 phút."]]}]}],"pj":["Bài kiểm tra cuối vùng 5: Dựng bộ ba thành phần ui-tabs, ui-modal, ui-toast truy cập được, có kiểm thử và demo; qua axe và kiểm thử bàn phím. Thời lượng: 5 giờ."]}]},{"id":"css","name":"CSS hiện đại","tag":"Flex/Grid, container query, @layer, :has(), oklch","level":"Cơ bản → Nâng cao","time":"4–6 tuần","code":"code-css","who":"Người làm giao diện web cần bố cục linh hoạt, dễ bảo trì và có hệ thống thiết kế rõ ràng.","pre":["Nắm HTML5 cơ bản","Biết dùng DevTools để kiểm tra phần tử"],"map":[{"t":"Giai đoạn 1 – Nền tảng","w":"Tuần 1–2","g":"Hiểu cascade, đặc hiệu, mô hình hộp và dựng được trang tĩnh đẹp, đúng.","i":["Selector, specificity, kế thừa","Box model, đơn vị, typography, màu sắc","Nền, viền, bo góc, bóng"],"o":"Trang giới thiệu cá nhân có kiểu chữ và màu nhất quán."},{"t":"Giai đoạn 2 – Bố cục","w":"Tuần 3–4","g":"Dựng được bố cục responsive bằng Flexbox và Grid.","i":["Flexbox một chiều","Grid hai chiều, auto-fit, minmax","Mobile-first, clamp(), media query"],"o":"Trang landing và lưới sản phẩm responsive, không dùng thư viện CSS."},{"t":"Giai đoạn 3 – CSS hiện đại và hệ thống","w":"Tuần 5–6","g":"Tổ chức CSS bền vững bằng layer, container query, biến và design tokens.","i":["Container queries, @layer, :has(), nesting","Biến CSS, oklch(), color-mix()","Chuyển động và prefers-reduced-motion"],"o":"Bộ thành phần giao diện có chế độ sáng và tối, dùng chung design tokens."}],"areas":[{"n":"Cascade, đặc hiệu và mô hình hộp","d":"Hiểu vì sao một quy tắc thắng quy tắc khác, đây là gốc của hầu hết lỗi CSS khó hiểu.","p":["Thứ tự ưu tiên: nguồn, layer, độ đặc hiệu, thứ tự xuất hiện","Selector: loại, class, id, thuộc tính, tổ hợp, pseudo-class, pseudo-element","Kế thừa và các giá trị initial, inherit, unset","box-sizing: border-box, margin collapse, display, overflow","Đơn vị: px, rem, em, %, vw, vh, ch, lh"],"x":[["Bài 1 – Cơ bản: Dựng thẻ hồ sơ","Dựng thẻ hồ sơ cá nhân bằng CSS thuần theo ảnh mẫu (khoảng cách, bo góc, bóng). Đạt khi: sai khác với ảnh mẫu không quá vài pixel."],["Bài 2 – Nâng cao: Trò chơi đặc hiệu","Cho 10 cặp quy tắc xung đột, dự đoán quy tắc thắng rồi kiểm chứng bằng DevTools. Đạt khi: dự đoán đúng từ 9/10 và giải thích được cách tính."]]},{"n":"Flexbox","d":"Công cụ chính để căn chỉnh và phân bổ không gian theo một chiều (hàng hoặc cột).","p":["Trục chính và trục phụ, flex-direction, flex-wrap","justify-content, align-items, align-content, gap","flex-grow, flex-shrink, flex-basis và viết tắt flex","order và căn chỉnh từng phần tử (align-self)","Mẫu thường dùng: thanh điều hướng, thẻ cùng chiều cao, footer dính đáy"],"x":[["Bài 1 – Cơ bản: Thanh điều hướng","Dựng navbar logo bên trái, menu ở giữa, nút bên phải, thu gọn khi màn hình hẹp. Đạt khi: không vỡ ở chiều rộng 320 px."],["Bài 2 – Nâng cao: Bố cục thẻ giá","Dựng 3 thẻ bảng giá cùng chiều cao, nút luôn nằm đáy thẻ dù nội dung dài ngắn khác nhau. Đạt khi: thêm dòng chữ vào thẻ nào cũng không lệch."]]},{"n":"Grid và thiết kế responsive","d":"Dựng bố cục hai chiều và làm giao diện co giãn tự nhiên trên mọi kích thước màn hình.","p":["grid-template-columns/rows, fr, repeat, minmax, auto-fit/auto-fill","grid-template-areas và đặt phần tử theo vùng","gap, căn chỉnh trong ô, subgrid","Mobile-first, media query, clamp(), min(), max()","Ảnh và video co giãn: aspect-ratio, object-fit"],"x":[["Bài 1 – Cơ bản: Lưới sản phẩm","Dựng lưới thẻ sản phẩm tự co giãn từ 1 đến 4 cột bằng repeat(auto-fit, minmax()). Đạt khi: không dùng media query nhưng vẫn đúng ở 5 độ rộng thử."],["Bài 2 – Nâng cao: Trang dashboard","Dựng bố cục dashboard có header, sidebar, nội dung, footer bằng grid-template-areas, sidebar thu gọn trên di động. Đạt khi: Lighthouse không báo vấn đề về khung nhìn."]]},{"n":"Container query, @layer, :has() và nesting","d":"Các tính năng giúp CSS gọn, dễ dự đoán và thành phần thích ứng the
